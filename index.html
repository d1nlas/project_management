sion","correct_position":"D"},{"id":"M2-07","area":"A · Strategy & stakeholders","topic":"Scheduling inputs","level":"Exam standard","stem":"Which group contains all six scheduling inputs from SS3?","options":["CSFs, stakeholders, Kano, risk owner, sprint goal, budget","Activity list, dependencies, durations, calendars, constraints, resources","Only activities and durations","Deliverables, attitude, IPO, constraints, Scrum values, CPM"],"answer":1,"feedback":["Correct.","These are the six inputs shown in SS3.","This mixes unrelated concepts.","This mixes unrelated concepts."],"kind":"Concept in context","correct_position":"B"},{"id":"M2-08","area":"C · Scheduling","topic":"SS dependency","level":"Exam standard","stem":"B can start once A has started; A need not finish first. Which relationship?","options":["SF","FF","SS","FS"],"answer":2,"feedback":["FF and SF constrain finish events.","Correct.","Start-to-Start allows B to start after A starts.","FS requires A to finish."],"kind":"Sequence","correct_position":"C"},{"id":"M2-09","area":"A · Strategy & stakeholders","topic":"Mandatory/discretionary","level":"Exam standard","stem":"A team uses an established preferred sequence although work could be performed in another order. What is this?","options":["Risk event","Mandatory dependency","Discretionary dependency","Success criterion"],"answer":2,"feedback":["Correct.","Mandatory is dictated by nature of work.","A preferred sequence based on previous experience is discretionary.","These are unrelated."],"kind":"Sequence","correct_position":"C"},{"id":"M2-10","area":"C · Scheduling","topic":"Critical path consequence","level":"Exam standard","stem":"A delay in a critical activity will most likely:","options":["Improve stakeholder interest","Have no effect on project duration","Remove the need for risk management","Delay the whole project"],"answer":3,"feedback":["This is the opposite of criticality.","Correct.","Stakeholder interest is separate.","Critical activities, if delayed, delay the whole project."],"kind":"Concept in context","correct_position":"D"},{"id":"M2-11","area":"C · Scheduling","topic":"PERT expected duration","level":"Exam standard","stem":"O=4, M=7, P=13. What is TE?","options":["7","7.5","8","9"],"answer":2,"feedback":["7 is not the weighted result.","Correct.","TE=(4+28+13)/6=45/6=7.5; the best option is 7.5.","8 is not the exact result."],"kind":"Calculation","correct_position":"C"},{"id":"M2-12","area":"D · Risk Management","topic":"Risk process ordering","level":"Exam standard","stem":"After risk identification, what is the next stage in SS4?","options":["Risk response","Risk analysis","Project closure","Risk monitoring"],"answer":1,"feedback":["Response occurs after analysis and planning.","Risk Analysis follows Identification in the five-stage sequence.","Monitoring follows response.","Correct."],"kind":"Sequence","correct_position":"B"},{"id":"M2-13","area":"D · Risk Management","topic":"Risk description","level":"Exam standard","stem":"A useful risk statement should include:","options":["Owner, cost, due date","Input, output, calendar","Power, interest, attitude","Condition, uncertain event, consequence"],"answer":3,"feedback":["These are not the risk-description components.","These are stakeholder attributes.","Correct.","SS4 recommends Condition → Risk → Consequence."],"kind":"Concept in context","correct_position":"D"},{"id":"M2-14","area":"D · Risk Management","topic":"Risk matrix","level":"Exam standard","stem":"Why can low probability still deserve priority?","options":["Impact may be severe on a single project","Risk score is always zero","All risks are identical","Probability is never used"],"answer":0,"feedback":["SS4 warns that impact should receive more importance in single-project assessment.","Impacts differ.","Probability remains relevant.","Correct."],"kind":"Classification / distinction","correct_position":"A"},{"id":"M2-15","area":"D · Risk Management","topic":"Mitigation","level":"Exam standard","stem":"A project adds redundancy to reduce outage impact, but outage remains possible. Which response?","options":["Mitigate","Transfer","Accept only","Avoid"],"answer":0,"feedback":["Mitigation reduces probability or impact while residual risk remains.","The action actively reduces exposure.","Correct.","Avoid removes the source."],"kind":"Concept in context","correct_position":"A"},{"id":"M2-16","area":"D · Risk Management","topic":"Transfer/share","level":"Exam standard","stem":"A contract allocates defined failure consequences to a service provider. Which response?","options":["Accept","Transfer/share","Avoid","Mitigate"],"answer":1,"feedback":["Accept retains exposure.","SS4 describes transfer/share as allocating defined consequences to another party, usually by contract.","Avoid removes source.","Correct."],"kind":"Sequence","correct_position":"B"},{"id":"M2-17","area":"D · Risk Management","topic":"Risk roles","level":"Exam standard","stem":"A technical specialist provides knowledge to assess a risk but is not accountable for it. Role?","options":["Risk Owner","Risk Resource","Sponsor","Risk Originator"],"answer":1,"feedback":["Owner is in charge.","Risk Resource is the expert supporting assessment and management.","Originator identifies.","Correct."],"kind":"Concept in context","correct_position":"B"},{"id":"M2-18","area":"E · Agile, Predictive & Hybrid","topic":"Predictive fit","level":"Exam standard","stem":"Stable and predictable requirements with high cost of change point toward:","options":["Predictive","Agile","Only Scrum","No methodology"],"answer":0,"feedback":["This matches the Predictive column in SS6.","Agile suits uncertain and changing work.","The course expects method fit.","Correct."],"kind":"Concept in context","correct_position":"A"},{"id":"M2-19","area":"E · Agile, Predictive & Hybrid","topic":"Agile fit","level":"Exam standard","stem":"A team can ship useful modules and learn through frequent customer feedback. Which approach?","options":["Agile","No project scope","Predictive only","No risk plan"],"answer":0,"feedback":["Incremental value and continuous feedback favour Agile.","Correct.","This misses the learning opportunities.","Agile still retains scope framing."],"kind":"Concept in context","correct_position":"A"},{"id":"M2-20","area":"E · Agile, Predictive & Hybrid","topic":"Hybrid","level":"Exam standard","stem":"A predictable regulatory package and uncertain customer features coexist. What is plausible?","options":["Pure Predictive without feedback","No planning","Hybrid approach","Pure Agile without constraints"],"answer":2,"feedback":["Correct.","Agile does not remove constraints.","Hybrid combines appropriate methods for stable and uncertain work.","This may be too rigid for changing features."],"kind":"Concept in context","correct_position":"C"},{"id":"M2-21","area":"E · Agile, Predictive & Hybrid","topic":"Manifesto qualification","level":"Exam standard","stem":"Does Agile mean documentation has no value?","options":["No, comprehensive documentation must always dominate","Yes, tools and plans are banned","Yes, all documentation is prohibited","No, items on the right still have value; left items are valued more"],"answer":3,"feedback":["This overstates the right-hand priorities.","Correct.","It is not a prohibition.","The Manifesto explicitly qualifies the values: right-hand items still have value."],"kind":"Concept in context","correct_position":"D"},{"id":"M2-22","area":"F · Scrum & prioritisation","topic":"Scrum adaptation","level":"Exam standard","stem":"Inspection reveals the product is unacceptable. What should happen?","options":["Keep the process unchanged","Wait until project closure","Delete the Product Backlog","Adapt process or product work promptly"],"answer":3,"feedback":["This ignores the pillar.","Correct.","Adaptation should not be deferred until closure.","SS7 says adapt promptly when process or product is outside acceptable limits."],"kind":"Managerial decision","correct_position":"D"},{"id":"M2-23","area":"F · Scrum & prioritisation","topic":"Sprint Review","level":"Exam standard","stem":"Who participates in inspecting the Sprint outcome?","options":["Only the Scrum Master","Only Developers","Only users after project end","Relevant stakeholders and Scrum Team"],"answer":3,"feedback":["Correct.","This excludes stakeholder collaboration.","The Scrum Master is not the only participant.","Sprint Review is the product-outcome inspection with stakeholders."],"kind":"Concept in context","correct_position":"D"},{"id":"M2-24","area":"F · Scrum & prioritisation","topic":"Sprint Retrospective","level":"Exam standard","stem":"Which question belongs in a Retrospective?","options":["How can the team work more effectively?","What is the risk score?","What did customers think of increment?","What is the next product goal?"],"answer":0,"feedback":["The Retrospective focuses on team effectiveness and improvements.","The Product Goal is not the central retrospective question.","That is Sprint Review feedback.","Correct."],"kind":"Concept in context","correct_position":"A"},{"id":"M2-25","area":"F · Scrum & prioritisation","topic":"MoSCoW Should","level":"Exam standard","stem":"A requirement is wanted but not vital. Which category?","options":["Must","Won’t","Should","Could"],"answer":2,"feedback":["Must is vital.","Could is nice to have.","Should means wanted but not vital.","Correct."],"kind":"Concept in context","correct_position":"C"},{"id":"M2-26","area":"F · Scrum & prioritisation","topic":"Kano Basic","level":"Exam standard","stem":"A basic feature is expected; absence creates dissatisfaction. Which category?","options":["Indifferent","Excitement","Performance","Basic"],"answer":3,"feedback":["Correct.","Excitement is unexpected delight.","Performance improves satisfaction with execution.","This is the Basic/Must-be attribute."],"kind":"Concept in context","correct_position":"D"},{"id":"M2-27","area":"F · Scrum & prioritisation","topic":"Backlog reprioritisation","level":"Exam standard","stem":"A user test reveals a higher-value feature. What should happen?","options":["Reprioritise future backlog work based on customer value","Never change the original order","Abandon project scope","Delete all lower items automatically"],"answer":0,"feedback":["The course says the backlog is dynamic and prioritised through customer collaboration and value.","The slide shows reprioritisation.","Items may be removed or re-ordered, but not automatically all deleted.","Correct."],"kind":"Managerial decision","correct_position":"A"},{"id":"M2-28","area":"F · Scrum & prioritisation","topic":"Backlog detail","level":"Exam standard","stem":"Which statement fits the backlog visual?","options":["Every item always has the same detail","High-priority items may be modelled in greater detail","Low-priority work must be fully specified first","New items cannot be added"],"answer":1,"feedback":["The slide shows different levels of detail.","The SS7 visual shows higher priority items modelled in greater detail, with reprioritisation and removal possible.","Correct.","Lower priority may be less detailed."],"kind":"Concept in context","correct_position":"B"},{"id":"M2-29","area":"A · Strategy & stakeholders","topic":"LIBRA","level":"Exam standard","stem":"Which concepts does LIBRA connect?","options":["Only project budget","WBS, CPM and PERT","Stakeholders, CSFs and project performance","Kano, Scrum and risk owner"],"answer":2,"feedback":["This combination is not LIBRA’s stated focus.","Correct.","The syllabus expressly describes LIBRA as connecting Stakeholder Management, CSFs and Project Performance.","These are scheduling areas."],"kind":"Concept in context","correct_position":"C"},{"id":"M2-30","area":"A · Strategy & stakeholders","topic":"SS8 integration","level":"Exam standard","stem":"A project is complex and intuition alone is insufficient. What does SS8 advise?","options":["Use instinct only","Remove monitoring and change management","Leverage all available resources and structured project management","Avoid strategic planning"],"answer":2,"feedback":["This contradicts the course summary.","Strategic planning is central to the course.","SS8 stresses that emotions and instinct are not enough in complex environments; managers should leverage resources.","Correct."],"kind":"Concept in context","correct_position":"C"}],[{"id":"M3-01","area":"A · Strategy & stakeholders","topic":"Project versus process","level":"Exam standard","stem":"A team performs repetitive inventory reconciliation each week. How should the effort be classified?","options":["Project because it uses resources","Neither because it is measurable","Process because it is repetitive and stable","Project because it has constraints"],"answer":2,"feedback":["Both use resources.","Both may have constraints.","Repetitive stable effort is characteristic of a process.","Correct."],"kind":"Classification / distinction","correct_position":"C"},{"id":"M3-02","area":"A · Strategy & stakeholders","topic":"CSF and dynamic planning","level":"Exam standard","stem":"A supplier changes its minimum order quantity during execution, threatening production capacity. What should the team do?","options":["Delete the WBS","Stop monitoring stakeholders","Review the CSF and supporting actions in light of the changed environment","Never revisit CSFs after kickoff"],"answer":2,"feedback":["Correct.","The WBS remains important.","SS1 says CSFs can be used during a project and the Mind the Gum case shows dynamic response to supplier conditions.","The lecture says CSFs can be reviewed during execution."],"kind":"Sequence","correct_position":"C"},{"id":"M3-03","area":"A · Strategy & stakeholders","topic":"Stakeholder attitude","level":"Exam standard","stem":"A stakeholder has high power and high interest but is hostile to the project. What information is missing from a simple power-interest classification?","options":["PERT duration","Stakeholder attitude and management strategy","Kano curve","Work package cost"],"answer":1,"feedback":["Correct.","SS1 stakeholder analysis includes attitude and management strategy as well as power and interest.","Cost estimates work packages.","PERT estimates activity duration."],"kind":"Concept in context","correct_position":"B"},{"id":"M3-04","area":"B · Scope & WBS","topic":"PSS justification","level":"Exam standard","stem":"A project is proposed to respond to a regulatory obligation. Which PSS element explains why the project is needed?","options":["Main deliverables","Boundaries","Justification","WBS"],"answer":2,"feedback":["Correct.","Boundaries define inclusion/exclusion.","Project justification answers WHY and can be driven by problems, opportunities or obligations.","Deliverables are outputs."],"kind":"Concept in context","correct_position":"C"},{"id":"M3-05","area":"B · Scope & WBS","topic":"Deliverables","level":"Exam standard","stem":"A project produces a validated capability to operate a service. Can this be a deliverable?","options":["Only if it is a KPI","Only if it is a risk response","No, deliverables must be physical products","Yes, a deliverable can be a unique product, result or capability to perform a service"],"answer":3,"feedback":["Correct.","A KPI measures performance.","The definition is broader than physical goods.","SS2 explicitly includes capability to perform a service in the deliverable definition."],"kind":"Concept in context","correct_position":"D"},{"id":"M3-06","area":"B · Scope & WBS","topic":"WBS and sequence","level":"Exam standard","stem":"Why does the WBS not show activity sequence?","options":["It is a risk response","It is not a scope tool","It contains only costs","It defines the perimeter/work breakdown; schedule sequence is handled by scheduling"],"answer":3,"feedback":["Cost estimation is one WBS benefit but not its purpose alone.","WBS is a scope tool.","Correct.","SS2 says the WBS has no time sequence; it decomposes scope."],"kind":"Sequence","correct_position":"D"},{"id":"M3-07","area":"D · Risk Management","topic":"Work package ownership","level":"Exam standard","stem":"A work package has specific responsibility and authority assigned to a single potential owner. Which rule?","options":["Kano","Manageable","Risk Transfer","Estimatable"],"answer":1,"feedback":["Correct.","Manageable includes assignable responsibility and authority.","Kano is customer satisfaction.","Estimatable concerns duration/resources/cost."],"kind":"Concept in context","correct_position":"B"},{"id":"M3-08","area":"D · Risk Management","topic":"Scheduling resources","level":"Exam standard","stem":"Why do resource quality and quantity matter for scheduling?","options":["They replace the activity list","They can influence duration and feasibility","They eliminate calendars","They are the stakeholder interest axis"],"answer":1,"feedback":["Correct.","SS3 includes qualitative and quantitative resources as schedule inputs.","Stakeholder interest is unrelated.","Activity list is a separate input."],"kind":"Concept in context","correct_position":"B"},{"id":"M3-09","area":"C · Scheduling","topic":"SF dependency","level":"Exam standard","stem":"B can finish only after A has started. Which relationship?","options":["SF","SS","FF","FS"],"answer":0,"feedback":["Start-to-Finish links B’s finish to A’s start.","SS constrains start after start.","FF constrains finish after finish.","FS constrains start after finish."],"kind":"Dependency logic","correct_position":"A"},{"id":"M3-10","area":"C · Scheduling","topic":"Leads","level":"Exam standard","stem":"A successor begins before its predecessor finishes, where overlap is allowed. Which modifier?","options":["Lead","Risk score","Lag","Sprint Goal"],"answer":0,"feedback":["A lead allows overlap/earlier start relative to the predecessor finish.","Correct.","Lag is waiting time.","These are unrelated."],"kind":"Concept in context","correct_position":"A"},{"id":"M3-11","area":"C · Scheduling","topic":"CPM management tip","level":"Exam standard","stem":"A manager wants to shorten a project duration. Where should they begin?","options":["Only non-critical tasks","Critical Path, considering discretionary dependencies","Stakeholder attitude","Only high-cost tasks"],"answer":1,"feedback":["Correct.","SS3 says act on the Critical Path and begin with discretionary dependencies where feasible.","Non-critical delay may not affect duration.","Cost is not the same as criticality."],"kind":"Calculation","correct_position":"B"},{"id":"M3-12","area":"C · Scheduling","topic":"PERT formula","level":"Exam standard","stem":"O=5, M=8, P=17 days. What is TE?","options":["8","10","9","11"],"answer":2,"feedback":["Not the weighted estimate.","Correct.","TE=(5+32+17)/6=54/6=9 days.","Incorrect calculation."],"kind":"Calculation","correct_position":"C"},{"id":"M3-13","area":"D · Risk Management","topic":"Risk positive effect","level":"Exam standard","stem":"An uncertain event may create a beneficial effect on project objectives. Is it a risk?","options":["It is a constraint","Only if the effect has already happened","Yes, positive risks link to opportunity management","No, risk is always negative"],"answer":2,"feedback":["Risk is uncertain before occurrence.","Correct.","SS4 expressly includes positive and negative effects.","The slide includes positive effects."],"kind":"Concept in context","correct_position":"C"},{"id":"M3-14","area":"D · Risk Management","topic":"Risk identification","level":"Exam standard","stem":"Which technique is listed by SS4?","options":["Brainstorming","Mendelow","MoSCoW","Kano"],"answer":0,"feedback":["Brainstorming is listed among risk identification methods, with a salience-bias caution.","Kano classifies satisfaction.","Mendelow classifies stakeholders.","Correct."],"kind":"Concept in context","correct_position":"A"},{"id":"M3-15","area":"D · Risk Management","topic":"Risk matrix impact","level":"Exam standard","stem":"A risk is unlikely but could cause severe project failure. What is the course-based response?","options":["Use only the risk score product and ignore context","Assume it is low priority","Ignore it due to low likelihood","Give particular attention to impact in the single-project assessment"],"answer":3,"feedback":["Impact is severe.","Correct.","Low probability does not make severe impact irrelevant.","SS4 emphasises impact and a non-symmetric matrix for a single project."],"kind":"Classification / distinction","correct_position":"D"},{"id":"M3-16","area":"D · Risk Management","topic":"Risk response acceptance","level":"Exam standard","stem":"A manager retains exposure and funds possible consequences. Which strategy?","options":["Accept","Mitigate","Transfer","Avoid"],"answer":0,"feedback":["Accept retains exposure and funds consequences if they occur.","Mitigation reduces probability or impact.","Correct.","Avoid removes source."],"kind":"Sequence","correct_position":"A"},{"id":"M3-17","area":"D · Risk Management","topic":"Risk resource","level":"Exam standard","stem":"A specialist helps the owner analyse and manage a risk. What role?","options":["Risk Originator","Risk Resource","Risk Owner","Sponsor"],"answer":1,"feedback":["Correct.","Risk Resource is the expert supporting assessment and management.","Owner is accountable.","Originator identified the risk."],"kind":"Concept in context","correct_position":"B"},{"id":"M3-18","area":"E · Agile, Predictive & Hybrid","topic":"Predictive and error impact","level":"Exam standard","stem":"A project has clear fixed requirements and errors discovered only at the end could be catastrophic. Which approach fits better?","options":["MoSCoW","Agile always","No approach","Predictive, given the conditions in SS6"],"answer":3,"feedback":["A methodology is still needed.","Agile is not automatically best.","Correct.","Predictable requirements and catastrophic error impact appear on the Predictive side of the SS6 comparison."],"kind":"Concept in context","correct_position":"D"},{"id":"M3-19","area":"E · Agile, Predictive & Hybrid","topic":"Agile collaboration","level":"Exam standard","stem":"Business people and developers work together daily. Which Agile principle is reflected?","options":["Daily collaboration","Only end-of-project testing","Hierarchical hand-offs","Fixed contract negotiation"],"answer":0,"feedback":["Principle 4 calls for daily collaboration between business people and developers.","Correct.","This is contrary to frequent delivery/feedback.","Agile favours cross-functional communication."],"kind":"Concept in context","correct_position":"A"},{"id":"M3-20","area":"E · Agile, Predictive & Hybrid","topic":"I-shaped organisation","level":"Exam standard","stem":"Different professional language and inflexible roles are associated with which organisation?","options":["I-shaped","Hybrid","T-shaped","Scrum"],"answer":0,"feedback":["SS6 lists these characteristics under I-shaped organisations.","Correct.","T-shaped is the broader collaboration contrast.","Hybrid is a project approach."],"kind":"Concept in context","correct_position":"A"},{"id":"M3-21","area":"F · Scrum & prioritisation","topic":"Scrum values","level":"Exam standard","stem":"Which group is shown as Scrum values in the SS7 visual?","options":["Power, Interest, Attitude, Cost, Quality","Must, Should, Could, Won’t, Maybe","Scope, Schedule, Budget, Risk, Control","Courage, Focus, Commitment, Respect, Openness"],"answer":3,"feedback":["Correct.","These are stakeholder/project dimensions, not Scrum values.","MoSCoW has four categories.","The SS7 visual lists these five Scrum values."],"kind":"Concept in context","correct_position":"D"},{"id":"M3-22","area":"F · Scrum & prioritisation","topic":"Daily Scrum","level":"Exam standard","stem":"What is inspected during Daily Scrum?","options":["Stakeholder power score","Project charter legality","Annual budget","Progress toward Sprint Goal and plan for next work"],"answer":3,"feedback":["These are outside the event purpose.","Correct.","Stakeholder power is a different analysis.","Daily Scrum is the event for inspecting progress toward the Sprint Goal and adapting the plan."],"kind":"Concept in context","correct_position":"D"},{"id":"M3-23","area":"F · Scrum & prioritisation","topic":"Sprint Retrospective","level":"Exam standard","stem":"A team discusses how to improve collaboration and technical quality next Sprint. Which event?","options":["Retrospective","Planning","Review","Product Backlog refinement"],"answer":0,"feedback":["The Retrospective focuses on improving team effectiveness and ways of working.","Correct.","Review inspects the product with stakeholders.","Planning sets the Sprint Goal and plan."],"kind":"Concept in context","correct_position":"A"},{"id":"M3-24","area":"F · Scrum & prioritisation","topic":"Epic detail","level":"Exam standard","stem":"A broad feature is broken down into smaller user stories and tasks as work gets closer. What does the SS7 backlog visual illustrate?","options":["Fixed equal detail at all levels","Progressively greater detail for higher-priority/nearer work","Only hours-level planning","No prioritisation"],"answer":1,"feedback":["The visual shows varying detail, not equal detail at every level.","The visual shows use cases/features, epics, user stories and tasks with increasing detail at lower levels.","The visual includes multiple levels of detail, not only hour-level tasks.","Prioritisation is central to the backlog."],"kind":"Concept in context","correct_position":"B"},{"id":"M3-25","area":"F · Scrum & prioritisation","topic":"Backlog priority and value","level":"Exam standard","stem":"What should guide a good backlog prioritisation?","options":["Customer collaboration and understanding value for the customer","Largest cost first in all cases","Power of the loudest stakeholder only","Alphabetical order"],"answer":0,"feedback":["The course summary says prioritisation is based on customer collaboration and understanding customer value.","No such rule appears.","Cost alone is not the stated rule.","Correct."],"kind":"Managerial decision","correct_position":"A"},{"id":"M3-26","area":"F · Scrum & prioritisation","topic":"Kano excitement","level":"Exam standard","stem":"An unexpected feature delights customers but is not expected. Which category?","options":["Basic","Performance","Excitement","Indifferent"],"answer":2,"feedback":["Basic is expected.","Performance scales with execution.","Excitement attributes delight when present; their absence need not cause dissatisfaction.","Correct."],"kind":"Concept in context","correct_position":"C"},{"id":"M3-27","area":"F · Scrum & prioritisation","topic":"Kano indifferent","level":"Exam standard","stem":"An attribute has little effect on satisfaction whether execution is good or poor. Which category?","options":["Performance","Excitement","Basic","Indifferent"],"answer":3,"feedback":["Performance affects satisfaction with execution.","Excitement creates unexpected delight.","Basic absence causes dissatisfaction.","Indifferent attributes have little impact on satisfaction."],"kind":"Concept in context","correct_position":"D"},{"id":"M3-28","area":"F · Scrum & prioritisation","topic":"Backlog types","level":"Exam standard","stem":"A team creates a technical task to improve the ability to generate customer value. Is this within the slide’s backlog concept?","options":["Only after final release","Yes, technical tasks and knowledge acquisition can be backlog items","No, only features count","No, only bugs count"],"answer":1,"feedback":["Bugs are one type, not the only type.","The SS7 items slide includes features, bugs, knowledge acquisition and technical tasks.","Backlog is broader than visible features.","Correct."],"kind":"Concept in context","correct_position":"B"},{"id":"M3-29","area":"A · Strategy & stakeholders","topic":"LIBRA trade-off","level":"Exam standard","stem":"A project decision may improve stakeholder satisfaction but reduce project performance. Which course idea applies?","options":["No trade-off exists","Ignore stakeholder satisfaction","Stakeholder satisfaction and project performance can involve trade-offs","Always prioritise the loudest stakeholder"],"answer":2,"feedback":["The summary says trade-offs exist.","Power is relevant but not the only decision criterion.","The course summary specifically notes trade-offs between stakeholder satisfaction and project performance.","Correct."],"kind":"Concept in context","correct_position":"C"},{"id":"M3-30","area":"D · Risk Management","topic":"SS8 application","level":"Exam standard","stem":"In a quick but complex project, what should the manager avoid relying on exclusively?","options":["Structured project management","Emotions, energy and instinct","Strategic planning","All available resources"],"answer":1,"feedback":["Correct.","SS8 says emotions/energy/instinct are not enough; managers should leverage all available resources.","Strategic planning is central.","Leveraging resources is encouraged."],"kind":"Managerial decision","correct_position":"B"}]],"lessons":[{"code":"A","title":"Project strategy, CSFs & stakeholders","short":"Strategy & stakeholders","intro":"Choose what matters before choosing the tools. SS1 frames project management as action-oriented and manager-focused. Gantt charts and controls matter, but the lecture says the difference is made in setting the tone: a team must know what really matters.","refs":"SS1 · 2026","application":"Apply the concepts to identify what must go well, what work is required, which constraints apply and what decision best fits the project's conditions.","sections":[{"h":"What is a project?","body":"<p>The lecture contrasts projects with processes. Processes are associated with repetitive effort, stability and efficiency. Projects are associated with one-time or non-repetitive effort, innovation and effectiveness. SS1 also describes a project as a non-repetitive effort aimed at one or more goals, carried out within a period using a pool of resources. The lecture adds an important qualification: a simple one-off action is not automatically a project; some degree of complexity is needed.</p><div class='callout'><b>Application / example:</b> Teaching example — a monthly payroll run is a process; implementing a new payroll platform across multiple locations is a project because it is temporary, goal-oriented, cross-functional and complex.</div>"},{"h":"The Project Management Framework","body":"<p>The course framework begins with a Project Charter containing objectives, resources, constraints and risks. Strategic planning identifies Critical Success Factors and analyses stakeholders. Operational planning translates direction into the Project Management Plan, including scope breakdown, scheduling, budgeting, risk management, checklists and other tools. Activities produce deliverables. Monitoring, controlling and change management provide feedback into the plan.</p><div class='callout'><b>Application / example:</b> Teaching example — for a hospital expansion, strategic planning identifies clinical readiness and patient access as success drivers; operational planning defines wards, equipment, staffing, dates, costs and risks.</div>"},{"h":"Critical Success Factors","body":"<p>SS1 adapts Rockart's definition: CSFs are the limited number of areas in which satisfactory results greatly increase the probability of successful project performance. CSFs can be used before the project, during execution and after completion as part of lessons learned. They focus leadership and team attention on the drivers of performance; they are not a complete activity list or simply a collection of numerical targets.</p><div class='callout'><b>Application / example:</b> Slide cases: HCL's 'Employees First, Customers Second' illustrates a strategic CSF; Tesla Model 3 distinguishes product success factors (range, price, performance, technology) from a project CSF (sufficient battery production capacity); Mind the Gum shows how a supplier refusing small batches can make a large pre-production contract a critical action.</div>"},{"h":"Discovering CSFs: IPO","body":"<p>Input includes key project characteristics, the project environment and strategic directions. Process means analysing those inputs, their correlations and impacts, and possible solutions. Output is the final decision about the CSFs. Do not confuse IPO with the project life cycle or with WBS decomposition.</p><div class='callout'><b>Application / example:</b> Teaching example — a product has limited marketing funds (input), the team analyses customer access and low-cost channels (process), and concludes that trusted independent distributors are a CSF (output). This is an illustrative application, not a slide answer.</div>"},{"h":"Typical CSFs","body":"<p>The SS1 slide citing Pinto and Slevin lists: project mission; top-management support; project schedule/plan; client consultation; personnel; technical tasks; client acceptance; monitoring and feedback; communication; and troubleshooting. These are typical drivers, not an instruction that every project must copy the list unchanged. A CSF should reflect the actual project context.</p><div class='callout'><b>Application / example:</b> Exam connection — when the project requires specialist clinical expertise, the manager should secure that expertise and include it in resource and budget planning. Keeping the CSF only as a reminder is not enough.</div>"},{"h":"Stakeholders","body":"<p>SS1 defines a stakeholder as an individual, group or organisation who may affect, be affected by, or perceive itself to be affected by a project decision, activity or outcome. Stakeholders are not limited to project-team members. Potential users, suppliers, regulators, sponsors and impacted communities may qualify even before a product exists. Involving stakeholders can support information, consultation, consensus-building, group decision-making, approval and joint implementation.</p><div class='callout'><b>Application / example:</b> Teaching example — for a healthy-recipe app, prospective users count as stakeholders before launch because the project is designed for them and their future behaviour may influence success.</div>"},{"h":"Power–Interest analysis","body":"<p>Power is the ability to influence project performance. Interest is how much the stakeholder feels affected or impacted. Mendelow's matrix guides the management approach: high power/high interest — manage closely; high power/low interest — keep satisfied; low power/high interest — keep informed; low power/low interest — monitor. This is a way to focus engagement, not a reason to omit low-power stakeholders from identification. SS1's stakeholder summary also considers attitude, perceptions, what the project needs from the group, inter-stakeholder relationships and management strategy.</p><div class='callout'><b>Application / example:</b> Teaching example — a regulator may be high power/low interest in routine project details and should be kept satisfied; a community group may be low power/high interest and should be kept informed.</div>"}],"masterclass":{"promise":"At the end of this module, you should be able to tell the difference between a project and a process, move from strategy to operational planning, identify CSFs, and classify stakeholders without confusing influence with interest.","map":"Project Charter → strategic planning (CSFs + stakeholder analysis) → Project Management Plan → activities → deliverables → monitoring, controlling and change management.","sections":[["1. Start with the nature of the effort","<p>Do not classify an effort by asking only whether it uses people, money or equipment. The lecture explicitly notes that projects and processes both use resources and can face constraints. The stronger distinction is the nature of the work.</p><p>A process is repetitive and relatively stable. Its management emphasis is efficiency: performing known work reliably. A project is a temporary, non-repetitive effort aimed at one or more goals, carried out within a period by a pool of resources. It is associated with innovation and effectiveness. The lecturer adds a useful boundary condition: moving one chair is one-time, but it may not have enough complexity to merit being treated as a project.</p><div class=\"callout\"><b>How to reason in an MCQ:</b> Look for a combination of uniqueness, temporary organisation, goal, time boundary, resource coordination and complexity. Do not choose “project” merely because an activity happens once.</div><p><b>Worked contrast:</b> A hotel checks room stock every morning using a stable checklist: process. The hotel redesigns its booking system across properties, trains teams, migrates data and launches by a target date: project. The redesign is a unique, cross-functional change with a defined end.</p>"],["2. Understand the course framework as a flow, not a checklist","<p>The framework begins with the Project Charter: objectives, resources, constraints and risks. Strategic planning then asks what must go particularly well and who can affect or be affected by the work. Operational planning translates those priorities into the Project Management Plan: scope and objectives, CSFs, stakeholder management, scope breakdown, resources, communication, time, cost, risk, monitoring/control and change management.</p><p>Activities are performed to create deliverables. Monitoring, controlling and change management feed information back into the plan. This is why the framework is cyclical: a project plan is not a document that is written once and then ignored.</p><h4>Strategic versus operational planning</h4><div class=\"table-wrap\"><table><thead><tr><th>Strategic planning</th><th>Operational planning</th></tr></thead><tbody><tr><td>What really matters?</td><td>What work, people, time and money are needed?</td></tr><tr><td>CSFs and stakeholder analysis</td><td>Scope breakdown, schedule, budget, risk actions, checklists</td></tr><tr><td>Sets direction and focus</td><td>Converts direction into executable work</td></tr></tbody></table></div><p><b>Worked example — hospital expansion:</b> “Clinical readiness before monsoon” is strategic. It becomes operational only when the plan includes clinical validation, equipment, staffing, training, facilities, dates, budgets and risk responses.</p>"],["3. Identify CSFs; do not confuse them with targets","<p>SS1 adapts Rockart’s definition: CSFs are the limited number of areas in which satisfactory results greatly increase the probability of successful project performance. Their purpose is focus. They identify the few drivers that deserve management attention.</p><p>A CSF is not every target, activity or constraint. “Achieve retailer acceptance” may be a CSF. “Reach 4 million rupees in sales by month three” is a measurable success criterion. “Discounts are prohibited by local law” is a constraint. One can be strategically important without being a CSF.</p><h4>Product success factor versus project CSF</h4><p>The Tesla Model 3 slide makes this distinction vivid. Product success factors included range, price, performance and technology. The project CSF for scaling production was sufficient battery production capacity. A desirable product can still fail to scale if the project cannot deliver the production capability.</p><h4>CSFs are dynamic</h4><p>Mind the Gum illustrates why the manager must revisit CSFs when conditions change. If large gum producers will not accept small batches, securing a large contract before production may become indispensable. A CSF is not a slogan to preserve; it is a driver of performance to honour as reality changes.</p>"],["4. Discover CSFs with IPO","<div class=\"two-col\"><div class=\"callout\"><b>Input</b><br>Key project characteristics, project environment and strategic directions.</div><div class=\"callout\"><b>Process</b><br>Analyse inputs, correlations, impacts and possible solutions.</div></div><div class=\"callout\"><b>Output</b><br>Final decisions expressed as CSFs.</div><p><b>Worked example:</b> Inputs: no money for mass advertising; product is difficult to sell through bars; founder has a compelling origin story; agents have exclusive supply arrangements. Process: examine which conditions affect the ability to reach customers and which solutions are feasible. Possible output: trusted independent distribution and credible storytelling become critical areas to secure.</p><p>This follows the logic of the lecture's CSF exercise. The output is not a long list of observations; it is the small number of decisions about what must go particularly well.</p>"],["5. Identify stakeholders before classifying them","<p>SS1’s definition is broad: an individual, group or organisation who may affect, be affected by, or perceive itself to be affected by a project decision, activity or outcome. Therefore, a stakeholder does not need to work on the project, and the product does not need to exist yet. Potential users can be stakeholders before launch because their acceptance, behaviour and feedback can affect success.</p><p>The lecture shows a spectrum of involvement: receive information, consultation, consensus-building, group decision-making, approval and joint implementation. A project manager must choose the appropriate level rather than either involving everyone in every decision or starting alone.</p><p><b>Stakeholder inventory:</b> do not stop at the project team. Consider sponsor, top management, customers, future users, suppliers, regulators, partners, employees, affected communities and other groups whose actions or perceptions matter.</p>"],["6. Use Power–Interest to focus management attention","<p>Power is the stakeholder’s ability to influence project performance. Interest is how much the stakeholder feels affected or impacted by the project. The Mendelow matrix supports engagement choices:</p><div class=\"table-wrap\"><table><thead><tr><th>Power</th><th>Interest</th><th>Approach</th><th>Why</th></tr></thead><tbody><tr><td>High</td><td>High</td><td>Manage closely</td><td>Can strongly influence outcomes and is highly affected.</td></tr><tr><td>High</td><td>Low</td><td>Keep satisfied</td><td>Can influence outcomes but may not want routine detail.</td></tr><tr><td>Low</td><td>High</td><td>Keep informed</td><td>Strongly affected, even if formal influence is limited.</td></tr><tr><td>Low</td><td>Low</td><td>Monitor</td><td>Lower immediate priority, but do not assume “not a stakeholder”.</td></tr></tbody></table></div><p>SS1’s stakeholder-analysis template goes beyond the matrix: interest and power scores, attitude, how the stakeholder sees the project, what the project needs from the group, relationships with other stakeholders and management strategy. Two stakeholders with identical power/interest may require different management if one supports the project and the other resists it.</p><div class=\"callout warning\"><b>Common exam trap:</b> Power–Interest is a prioritisation tool, not a definition of who counts as a stakeholder. Low-power users still belong in the stakeholder analysis.</div>"]],"worked":["<b>Integrated walkthrough — a healthy-recipe app.</b><ol><li><b>Define the effort:</b> building and launching an app is a temporary, unique, cross-functional project; ongoing recipe publishing after launch may become a process.</li><li><b>State the strategic intent:</b> help users create healthy recipes and achieve adoption.</li><li><b>Choose a small number of CSFs:</b> user trust in nutritional information, usable recipe generation and access to the intended user segment. These are illustrative choices, not a slide answer.</li><li><b>Identify stakeholders:</b> sponsor, developers, nutrition experts, potential users, food partners and relevant regulators.</li><li><b>Classify them:</b> use power and interest, then examine attitude and relationships.</li><li><b>Translate the direction:</b> ensure later scope and resource decisions support the selected CSFs.</li></ol>","Examiner’s lens: a scenario may ask you to identify a stakeholder, distinguish a CSF from a success criterion, or decide what a manager should do when a CSF is not funded."],"source":"SS1 pages 6–8, 11–16, 18–19, 23, 25–38; CSF examples include HCL, Tesla Model 3 and Mind the Gum."}},{"code":"B","title":"Project Scope Statement & WBS","short":"Scope & WBS","intro":"Define what success requires and what work must exist. SS2 says that if the correct work is not identified, budgets and resources will never be sufficient or optimised. The WBS is presented as a pivotal planning and control methodology.","refs":"SS2 · 2026","application":"Apply the concepts to identify what must go well, what work is required, which constraints apply and what decision best fits the project's conditions.","sections":[{"h":"Project Scope Statement","body":"<p>The PSS gives stakeholders a common understanding of project scope and describes major objectives. SS2 names three characteristics: clear on objectives, well known by stakeholders, and agreeable (the slide says not mandatory). A PSS is more a framework than a detailed list of every low-level activity.</p><div class='callout'><b>Application / example:</b> Teaching example — an event PSS describes why the event is needed, what it includes, main outputs, success measures, exclusions and unusual constraints.</div>"},{"h":"The six PSS elements","body":"<p>(1) Project justification — WHY: problems, opportunities or obligations. (2) Project description — WHAT the project is about; detailed specifications can be placed in annexes or a Statement of Work (SOW). (3) Main deliverables — unique and verifiable products, results or capabilities. (4) Success criteria/measures — measurable conditions for an acceptable result. (5) Boundaries/exclusions — what is included and what is not. (6) Constraints — limiting factors affecting execution; SS2 recommends mentioning unusual or peculiar requirements rather than listing every ordinary requirement.</p><div class='callout'><b>Application / example:</b> Exam connection — sales of ₹40 lakh in three months is a measurable success criterion; a legal prohibition on discounts is a constraint. A budget ceiling is also a limiting constraint in the mock's framing. These are not automatically CSFs.</div>"},{"h":"Output, outcome, KPI and CSF","body":"<p>Output is what the project produces; outcome is the effect or benefit sought. SS2 notes that outcome measurement can be costly and recommends designing output indicators correlated with outcome indicators. KPI means Key Performance Indicator. A variable to monitor is not necessarily a KPI. A success criterion is not a CSF: CSF identifies what must go particularly well; success criteria express measurable results acceptable to users/customers/stakeholders.</p><div class='callout'><b>Application / example:</b> Teaching example — 12 training sessions delivered is an output; improved employee performance is an outcome. Attendance can be a monitored variable; a defined competency target may be a KPI or success criterion, depending on the measurement design.</div>"},{"h":"Boundaries and constraints","body":"<p>Boundaries establish what work is in and out of scope, clear grey areas and set expectations. SS2's management tip says to focus on defining what is out of scope because included work is represented elsewhere in the project plan. A constraint is a limiting factor that affects execution and, if respected, supports compliance. Do not confuse an exclusion with a legal or resource constraint.</p><div class='callout'><b>Application / example:</b> Teaching example — 'international rollout excluded' is a boundary; 'must comply with local data-protection law' is a constraint.</div>"},{"h":"Work Breakdown Structure","body":"<p>The WBS is a hierarchical decomposition of the total scope of work into manageable work elements undertaken to accomplish project objectives and create required deliverables. SS2 is emphatic: WBS is not a Gantt chart, has no time sequence and defines the perimeter of activities. A good WBS is normally deliverable-oriented. Everything needed to reach the final result should be embedded in it.</p><div class='callout'><b>Application / example:</b> Teaching example — for a website launch, deliverable branches might include research, design, development, content migration, testing, deployment and handover. These branches describe work; they do not yet tell you the dates or order.</div>"},{"h":"Work packages","body":"<p>The work package is the smallest unit in the WBS example. SS2 lists four rules: estimatable in duration, resource effort/quality/quantity and cost; measurable for progress; manageable with specific responsibility and authority assignable to a potential owner; and clear input/output relationships. If an item is too large to estimate or measure, break it down further.</p><div class='callout'><b>Application / example:</b> Teaching example — 'integrate payment gateway' may be a work package if its duration, people, cost, progress and inputs/outputs can be estimated. 'Build the entire platform' is likely too broad.</div>"},{"h":"Building a WBS","body":"<p>Four methods are shown: Top Down (the slide warns it may be non-effective for innovative projects), Bottom Up (participatory brainstorming), Analogy and Template. Bottom Up has five steps: brainstorm activities without sequencing; recognise the difficulty of brainstorming; group activities; group them around main deliverables; reread to find omissions or inconsistencies. Activity sequence is handled later by scheduling.</p><div class='callout'><b>Application / example:</b> Exam connection — brainstorming activities without sequence and grouping them around deliverables is Bottom Up.</div>"}],"masterclass":{"promise":"You should be able to draft and diagnose a Project Scope Statement, classify its six elements, distinguish output from outcome, and build a deliverable-oriented WBS that can feed scheduling.","map":"WHY (justification) → WHAT (description + deliverables) → how success is measured → boundaries/exclusions → constraints → WBS decomposition → work packages.","sections":[["1. Why the Project Scope Statement comes early","<p>The PSS provides a common understanding of project scope among stakeholders and describes the project’s major objectives. SS2 calls it more of a framework than an exhaustive activity list. It should be clear on objectives, well known by stakeholders and agreeable (the slide explicitly says “not mandatory”).</p><p>Why does it matter? If stakeholders hold different assumptions about what the project includes, they can expect different deliverables, resource needs and dates. Scope ambiguity becomes rework, conflict and unrealistic planning.</p><p><b>Management discipline:</b> first agree what the project is for and what it covers. Do not jump directly to a detailed Gantt chart or task list while the basic scope is still disputed.</p>"],["2. Build the six PSS elements in order","<div class=\"table-wrap\"><table><thead><tr><th>Element</th><th>Question</th><th>Example</th></tr></thead><tbody><tr><td>Justification</td><td>WHY is it needed?</td><td>Problem, opportunity or obligation.</td></tr><tr><td>Project description</td><td>WHAT is it about?</td><td>Concise explanation of the service/product/change.</td></tr><tr><td>Main deliverables</td><td>WHAT is produced?</td><td>Unique, verifiable products, results or capabilities.</td></tr><tr><td>Success criteria / measures</td><td>HOW do we judge an acceptable result?</td><td>Target performance, KPIs or measurable conditions.</td></tr><tr><td>Boundaries / exclusions</td><td>WHAT is in and out?</td><td>Markets, channels or functions excluded from this phase.</td></tr><tr><td>Constraints</td><td>WHAT limits execution?</td><td>Legal requirements, fixed deadline, budget or unusual restrictions.</td></tr></tbody></table></div><p>Project justification may arise from problems, opportunities or obligations. The “why” influences the “what” and the “how”; the lecture’s keynote-speaker example shows that the same event component has different value depending on whether the purpose is networking or learning.</p><p>Project description should explain key characteristics. Full detail can sit in annexes or a Statement of Work (SOW). Main deliverables should focus attention on the important interim and final achievements; exhaustive lists can sit in supporting documentation.</p>"],["3. Success criteria, KPIs, outputs and outcomes","<p>SS2 defines success criteria as measurable terms describing a result acceptable to end users, customers and stakeholders. The slide insists: success criteria are not CSFs.</p><p><b>Output</b> is what the project produces. <b>Outcome</b> is the effect or benefit sought. The lecture notes that measuring outcomes can be costly, so output indicators can be designed that correlate with outcome indicators. A KPI is a key performance indicator; not every variable that is monitored is automatically a KPI.</p><div class=\"callout\"><b>Worked classification:</b> 12 training workshops conducted = output. Improved manager decision quality = outcome. “At least 80% of participants pass a competency assessment” = an illustrative measurable success criterion/KPI target. “Specialist trainers must be available” could be a CSF-related condition.</div><p><b>Original mock connection:</b> sales of ₹40 lakh in three months is a measurable success criterion. A budget ceiling and a law prohibiting discounts are constraints in the question’s framing. The list is therefore a mix of success criteria and constraints, not a clean CSF list.</p>"],["4. Boundaries are not constraints","<p>Boundaries define what is included and excluded. Their purpose is to clear grey areas and set expectations. SS2 offers a management tip: focus on what is out of scope, because included work is represented in other parts of the plan.</p><p>A constraint is a limiting factor affecting execution. If respected, it supports compliance. The slide advises mentioning unusual or peculiar requirements rather than every ordinary requirement.</p><div class=\"table-wrap\"><table><thead><tr><th>Statement</th><th>Classification</th><th>Reason</th></tr></thead><tbody><tr><td>“This phase covers Mumbai only.”</td><td>Boundary</td><td>Defines scope perimeter.</td></tr><tr><td>“International rollout is excluded.”</td><td>Exclusion</td><td>Explicitly outside scope.</td></tr><tr><td>“Must comply with local law.”</td><td>Constraint</td><td>Limits how the project is executed.</td></tr><tr><td>“Budget cannot exceed ₹2 crore.”</td><td>Constraint</td><td>Limits available expenditure.</td></tr></tbody></table></div>"],["5. WBS: scope decomposition, not time sequencing","<p>The WBS is a hierarchical decomposition of the total scope of work into manageable work elements to accomplish project objectives and create required deliverables. SS2 is emphatic: <b>WBS is not a Gantt; it has no time sequence.</b> It defines the perimeter of activities.</p><p>A good WBS is normally deliverable-oriented. Everything needed to reach the final result should be represented. The WBS gives the team a way to check completeness, improve estimates and assign accountability.</p><p><b>Example — launch an e-commerce site:</b> top-level deliverables might be customer research, platform, product catalogue, payment capability, fulfilment integration, tested launch and handover. Each can be decomposed into smaller deliverables/work packages. This tree says what needs to exist; it does not yet say the dates or predecessor order.</p>"],["6. Work packages: the test of useful decomposition","<p>The work package is the smallest unit shown in the WBS example. SS2 provides four quality tests:</p><ol><li><b>Estimatable:</b> duration, resource effort/quality/quantity and cost can be estimated.</li><li><b>Measurable:</b> progress can be observed.</li><li><b>Manageable:</b> a meaningful unit with specific responsibility and authority assignable to a potential owner.</li><li><b>Clear input/output relationships:</b> it is clear what the activity needs and what it produces.</li></ol><p>If a work package is “transform the business”, you cannot estimate it or measure progress. Decompose it. If it is “configure payment API sandbox and demonstrate successful test transaction”, duration, resources, evidence and ownership are more observable.</p>"],["7. Choosing a WBS development method","<p>SS2 names Top Down, Bottom Up, Analogy and Template. The slide cautions that Top Down can be non-effective for innovative projects. Bottom Up is grounded in participatory brainstorming.</p><p><b>Bottom-Up sequence:</b> brainstorm activities without focusing on sequence; recognise the difficulty (“crisis”) of brainstorming; review the activity list and group activities; organise groups around main deliverables; reread for missing elements and inconsistencies. The deliberate instruction not to sequence activities is a key exam point: sequence belongs to scheduling, not WBS construction.</p>"]],"worked":["<b>Worked PSS and WBS — pop-up retail launch.</b><ol><li><b>Justification:</b> opportunity to test demand in a new neighbourhood.</li><li><b>Description:</b> a 4-week pop-up store with online ordering and local fulfilment.</li><li><b>Main deliverables:</b> ready retail space, stocked assortment, payment/ordering setup, trained staff, launch campaign and close-out report.</li><li><b>Success criteria:</b> target sales and customer conversion over the 4 weeks.</li><li><b>Boundaries:</b> one location; no permanent lease or national rollout.</li><li><b>Constraints:</b> site permit, spend ceiling, safety rules and fixed opening date.</li><li><b>WBS:</b> decompose each deliverable into work packages that can be estimated, measured and owned. Only after this should the team build the schedule.</li></ol>","Examiner’s lens: expect classification, “what is missing from the PSS?”, WBS-versus-Gantt logic, and a work-package-quality diagnosis."],"source":"SS2 pages 4–24; PSS six-element summary on page 15; WBS definition and work-package rules on pages 18–20."}},{"code":"C","title":"Scheduling, Dependencies & CPM","short":"Scheduling","intro":"Turn the defined work into a feasible temporal plan. The syllabus describes scheduling as creating and understanding the temporal dimension: how long the project takes and whether it can be brought back on track.","refs":"SS3 · 2024 teaching slides","application":"Apply the concepts to identify what must go well, what work is required, which constraints apply and what decision best fits the project's conditions.","sections":[{"h":"Six scheduling inputs","body":"<p>SS3 shows: Activity List, Dependencies, Durations, Calendars, Constraints and Resources (qualitative and quantitative). These inputs combine to create the schedule. A schedule is not reliable if activities, durations, calendars or resource availability have not been considered.</p><div class='callout'><b>Application / example:</b> Teaching example — the same installation may take longer with one qualified technician than with a properly staffed crew; resource quantity and quality can influence duration.</div>"},{"h":"Four dependency types","body":"<p>FS — Finish-to-Start: B can start only after A finishes. SS — Start-to-Start: B can start only after A starts. FF — Finish-to-Finish: B can finish only after A finishes. SF — Start-to-Finish: B can finish only after A starts. With multiple predecessors, all applicable conditions must be satisfied.</p><div class='callout'><b>Application / example:</b> Memory cue: identify which event of the predecessor constrains which event of the successor.</div>"},{"h":"Mandatory and discretionary dependencies","body":"<p>Mandatory dependencies are determined by the nature of the work. Discretionary dependencies represent preferred sequences based on experience. SS3 notes that dependencies are important schedule components and also indicate communication/coordination points. Discretionary dependencies are a place to start when optimising duration, provided work logic is not violated.</p><div class='callout'><b>Application / example:</b> Teaching example — curing concrete before loading it is likely mandatory; painting all rooms before any furniture assembly may be a discretionary preference depending on the actual work.</div>"},{"h":"Leads and lags","body":"<p>SS3 says predecessors can be further detailed with leads and lags. A lag inserts waiting time between linked activities. A lead permits overlap or an earlier start relative to a finish-based relationship. The slides introduce the terms but do not give a full calculation example.</p><div class='callout'><b>Application / example:</b> Teaching example — FS with a 2-day lag means the successor waits two days after the predecessor finishes. A 2-day lead permits overlap where feasible.</div>"},{"h":"Critical Path Method","body":"<p>CPM identifies activities that are critical for the project: if they are delayed, the whole project is delayed. The Critical Path is the longest-duration path through the network and determines the earliest project completion under the model. SS3 advises acting on the Critical Path and beginning with discretionary dependencies where appropriate.</p><div class='callout'><b>Application / example:</b> Teaching example — if commissioning cannot begin until installation and testing are complete, and that chain is the longest path, delay in one activity can delay project completion.</div>"},{"h":"PERT","body":"<p>The slide contrasts CPM's determined activity durations with PERT's probability-based durations. Expected time: TE = (O + 4M + P) / 6. Standard deviation: σ = (P − O) / 6. O is optimistic, M most likely and P pessimistic.</p><div class='callout'><b>Application / example:</b> Worked example — O=3, M=6, P=15 days. TE=(3+24+15)/6=7 days. σ=(15−3)/6=2 days.</div>"},{"h":"Critical Chain Project Management","body":"<p>SS3 lists Critical Chain Project Management as another framework to explore, but the supplied slide does not explain its mechanics. Treat it as a named supplementary scheduling framework rather than assume detailed calculations are examinable from this slide alone.</p><div class='callout'><b>Application / example:</b> Source boundary — the lecture names Critical Chain but does not provide enough detail to build a course-specific numerical procedure.</div>"}],"masterclass":{"promise":"You should be able to read all four dependency types, combine predecessor conditions, distinguish mandatory from discretionary links, use leads/lags, reason about the Critical Path and calculate PERT estimates.","map":"WBS/work packages → activity list → dependencies → durations → calendars → constraints/resources → schedule → critical path → optimisation.","sections":[["1. A schedule needs six inputs","<p>SS3 shows six inputs around the schedule: Activity List, Dependencies, Durations, Calendars, Constraints and Resources (qualitative and quantitative). An activity list without duration cannot answer “how long?”. Durations without calendars may confuse working time with elapsed time. A dependency list without resource consideration may describe a theoretically possible sequence that cannot be staffed.</p><p>Scheduling is the temporal dimension of the project. It answers how long the project takes and whether there is a way to get back on track.</p>"],["2. Four dependency types — read the letters literally","<div class=\"table-wrap\"><table><thead><tr><th>Type</th><th>Rule in SS3</th><th>Everyday illustration</th></tr></thead><tbody><tr><td><b>FS</b> Finish-to-Start</td><td>Successor B can start only after predecessor A finishes.</td><td>Testing starts after assembly finishes.</td></tr><tr><td><b>SS</b> Start-to-Start</td><td>B can start only after A has started.</td><td>Documentation begins after development starts.</td></tr><tr><td><b>FF</b> Finish-to-Finish</td><td>B can finish only after A finishes.</td><td>Final packaging cannot finish until production finishes.</td></tr><tr><td><b>SF</b> Start-to-Finish</td><td>B can finish only after A starts.</td><td>Old shift cannot finish until replacement shift starts.</td></tr></tbody></table></div><p><b>How to solve a multiple-dependency question:</b> write each condition separately. If C has FS with A and SS with B, C may start only when A has finished <em>and</em> B has started. Do not select an answer that satisfies only one predecessor.</p><div class=\"callout warning\"><b>Exam trap:</b> SS means the predecessor must have started, not finished. FF constrains the finishes. SF constrains the successor’s finish based on the predecessor’s start.</div>"],["3. Mandatory versus discretionary links","<p>SS3 distinguishes mandatory links, determined by the nature of the work, from discretionary links, representing preferred sequences based on previous experience. This distinction matters when optimising a project. The lecturer’s management tip is to start by examining discretionary dependencies when trying to shorten project duration. A manager cannot responsibly remove a true technical prerequisite merely to make the chart look shorter.</p><p>Example: electrical testing cannot occur before a circuit exists — mandatory. A team prefers to complete all design reviews before procurement because that worked previously — potentially discretionary if procurement could begin earlier with controlled assumptions.</p>"],["4. Leads and lags","<p>Leads and lags add detail to predecessor relationships. A <b>lag</b> inserts waiting time; a <b>lead</b> allows overlap. For example, FS + 2 days means the successor starts two days after the predecessor finishes. FS with a two-day lead means the successor may start two days before the predecessor finishes, where the work can safely overlap.</p><p>Do not confuse a lag with a different dependency type. The underlying relationship remains FS; the modifier changes the timing offset.</p>"],["5. Critical Path Method: why it matters","<p>SS3 defines critical activities as those whose delay delays the whole project. The Critical Path is the longest-duration path through the dependency network and determines the minimum completion time under the plan. When the lecturer says to optimise duration by acting on the Critical Path, the logic is that shortening a non-critical activity may not change the end date.</p><p><b>Worked network (supplementary CPM arithmetic to make the lecture concept usable):</b></p><div class=\"table-wrap\"><table><thead><tr><th>Activity</th><th>Duration</th><th>Predecessor</th><th>Earliest finish</th></tr></thead><tbody><tr><td>A</td><td>2 days</td><td>—</td><td>Day 2</td></tr><tr><td>B</td><td>3 days</td><td>A</td><td>Day 5</td></tr><tr><td>C</td><td>4 days</td><td>A</td><td>Day 6</td></tr><tr><td>D</td><td>5 days</td><td>B and C</td><td>Day 11</td></tr><tr><td>E</td><td>2 days</td><td>D</td><td>Day 13</td></tr></tbody></table></div><p>There are two paths: A–B–D–E = 2+3+5+2 = 12 days; A–C–D–E = 2+4+5+2 = 13 days. The second path is critical. Shortening B alone will not reduce the 13-day completion time unless the other constraints change. Shortening C, D or E may affect the critical path.</p><p><b>Source qualification:</b> the SS3 deck identifies CPM and uses ProjectLibre for a network example, but does not fully teach forward/backward-pass arithmetic. The path-sum walkthrough above is a supplementary teaching example of the named method.</p>"],["6. PERT: estimate duration when time is uncertain","<p>SS3 contrasts CPM, where activity duration is determined, with PERT, where duration is based on probability. The lecture gives:</p><div class=\"formula\">Expected time = (O + 4M + P) / 6</div><div class=\"formula\">Standard deviation = (P − O) / 6</div><p>O is optimistic, M most likely, P pessimistic.</p><b>Worked calculation:</b> O=4 days, M=7 days, P=16 days. Expected duration = (4 + 28 + 16)/6 = 48/6 = <b>8 days</b>. Standard deviation = (16−4)/6 = <b>2 days</b>. The expected time is not the same as the most likely time.</p><p>SS3 also names Critical Chain Project Management, but the supplied slide does not develop its mechanics. Know that it is mentioned; do not invent detailed mechanics from the lecture.</p>"]],"worked":["<b>Worked scheduling diagnosis — product launch.</b><ol><li>List the work packages already identified by the WBS.</li><li>Convert them into an activity list with durations, calendars and resources.</li><li>Write every predecessor condition in words before selecting FS/SS/FF/SF.</li><li>Mark each relationship mandatory or discretionary.</li><li>Add lead/lag only where an overlap or wait is justified.</li><li>Find the longest path; identify which activities can delay the whole project.</li><li>For uncertain durations, use PERT estimates rather than pretending the most likely estimate is certain.</li></ol>","Examiner’s lens: the original mock’s task C has FS with A and SS with B. The correct start condition must satisfy both. Other likely forms include path comparison, lead/lag classification and PERT calculations."],"source":"SS3 2024 pages 3–12; Course Summary SS3 page 5."}},{"code":"D","title":"Project Risk Management","short":"Risk management","intro":"Make the plan robust enough to face uncertainty. SS4 says the best project is not the one without risks, but the one robust enough to address risks.","refs":"SS4 · 2024 teaching slides","application":"Apply the concepts to identify what must go well, what work is required, which constraints apply and what decision best fits the project's conditions.","sections":[{"h":"What is risk?","body":"<p>A risk is an uncertain event or condition that, if it occurs, has a negative or positive effect on project objectives. Positive risks connect to opportunity management. A risk is not the same as an issue that has already occurred.</p><div class='callout'><b>Application / example:</b> Teaching example — a supplier may miss a delivery date (risk); after the delivery is actually missed, the project has an issue to manage.</div>"},{"h":"Five-stage process","body":"<p>Risk Identification → Risk Analysis → Risk Response Planning → Risk Response → Risk Monitor and Control. Identification discovers possible events. Analysis assesses significance. Response planning selects a strategy and actions. Response implements them. Monitoring/control checks exposure and response effectiveness over time.</p><div class='callout'><b>Application / example:</b> Exam connection — do not jump to contingency activation without checking whether the trigger condition has been reached.</div>"},{"h":"Identification methods","body":"<p>SS4 lists the Project Management Plan (scope/boundaries/constraints, WBS, Gantt/Critical Path), contracts, brainstorming, assumption analysis and checklists. The slide cautions that brainstorming can over-represent salient risks.</p><div class='callout'><b>Application / example:</b> Teaching example — a WBS may expose a specialist work package; a contract may expose a supplier dependency; assumption analysis may reveal that a permit is expected but not secured.</div>"},{"h":"Risk description","body":"<p>A useful risk description contains Condition → Risk → Consequence: 'Due to… there is a risk that… causing…'. General names and very short descriptions can be misleading.</p><div class='callout'><b>Application / example:</b> Example from slide — due to a new software development methodology, productivity may be lower than expected, causing a schedule slip.</div>"},{"h":"Probability, impact and risk matrix","body":"<p>The slide gives Risk Score = Probability × Impact, but asks whether this treats the project as risk-neutral. A car worth €60,000 with a 1-in-1,000 theft chance and a phone worth €600 with a 10-in-100 theft chance both have expected value €60. SS4 concludes that on a single project, impact should have more value than probability and the matrix is not symmetric.</p><div class='callout'><b>Application / example:</b> Use the multiplication formula when asked for a simple score, but do not assume equal products always imply equal managerial priority. Consider severity and context.</div>"},{"h":"Four response strategies","body":"<p>Avoid: change the plan so the source of risk no longer applies. Mitigate: reduce probability or impact while residual risk remains. Transfer/share: allocate defined consequences to another party, usually by contract. Accept: keep exposure and fund consequences if they occur.</p><div class='callout'><b>Application / example:</b> Teaching example — redesign away from a hazardous chemical (avoid); add inspections (mitigate); contractually allocate defined loss (transfer/share); retain a low-impact risk and fund consequences (accept).</div>"},{"h":"Plan A and Plan B","body":"<p>Plan A is the response action/strategy implemented before the risk happens. Plan B is the contingency plan activated when the risk happens or is near to happening. Plan B is not merely a budget reserve.</p><div class='callout'><b>Application / example:</b> Teaching example — Plan A: monitor weather and secure covered equipment. Plan B: activate indoor venue when the severe-weather trigger is met.</div>"},{"h":"Risk roles","body":"<p>Risk Owner: person in charge. Risk Resource(s): experts helping assess, analyse and manage. Risk Originator: person who identified the risk. The originator is not automatically the owner.</p><div class='callout'><b>Application / example:</b> Teaching example — site engineer identifies ground-condition risk (originator); geotechnical expert advises (resource); project manager is accountable (owner).</div>"}],"masterclass":{"promise":"You should be able to identify risks from project documents, write a useful risk statement, assess probability and impact with the lecture’s caveat, select a response, distinguish Plan A from Plan B and assign risk roles.","map":"Risk identification → risk analysis → response planning → response implementation → monitoring and control.","sections":[["1. Risk is uncertainty with an effect on objectives","<p>SS4 defines a risk as an uncertain event or condition that, if it occurs, has a negative or positive effect on project objectives. The positive side is linked to opportunity management. A risk is not simply a problem that has already happened; it is an uncertainty about something that may happen and affect an objective.</p><p>Keep the objective visible. “Supplier delay” is too generic. “A supplier delay may cause the installation milestone to slip” explains why the uncertainty matters.</p>"],["2. The five-stage risk process","<ol><li><b>Risk Identification:</b> discover what may affect objectives.</li><li><b>Risk Analysis:</b> assess the risk, including probability and impact.</li><li><b>Risk Response Planning:</b> decide what action/strategy is appropriate.</li><li><b>Risk Response:</b> implement the chosen action.</li><li><b>Risk Monitoring and Control:</b> follow the risk and the effectiveness of responses; detect changes.</li></ol><p>Do not collapse analysis and response into one step. “We identified a risk” does not mean we know its priority. “We planned a response” does not mean the response has been implemented.</p>"],["3. Where do risks come from?","<p>SS4 lists the Project Management Plan as a source: scope (boundaries/constraints), WBS, Gantt/Critical Path and other plan elements. It also lists contracts, brainstorming, assumption analysis and checklists. This connects risk management to the earlier project-planning sessions: the project plan is not separate from risk identification; it gives the team evidence about where uncertainty can arise.</p><p>The slide warns that brainstorming can overrepresent risks that are salient. A memorable hazard is not necessarily the most consequential. Use systematic analysis instead of relying only on what people happen to remember.</p>"],["4. Write risks so people can understand them later","<p>SS4 says short generic names can mislead. A good description contains:</p><div class=\"three-col\"><div class=\"callout\"><b>Condition</b><br>Due to…</div><div class=\"callout\"><b>Risk event</b><br>There is a risk that…</div><div class=\"callout\"><b>Consequence</b><br>Causing…</div></div><p><b>Weak:</b> “New software risk.”<br><b>Strong:</b> “Due to the team’s first use of the new development method, there is a risk that programmer productivity will be lower than expected, causing a schedule slip.”</p><p>The second statement helps a future reader understand cause, uncertain event and effect. It also supports learning from experience.</p>"],["5. Probability, impact and the asymmetric matrix","<p>The slide gives the simple expression Risk Score = Probability × Impact, but immediately questions whether this is always sufficient. It notes that this formula makes sense for repeatable events where an average can be calculated. For a single project, impact should receive more importance than probability; this is why the risk matrix is not symmetric.</p><p>The car/phone illustration is deliberately provocative: a €60,000 car stolen at 1/1,000 and a €600 phone stolen at 10/100 have the same expected monetary value (€60), but the manager should not assume that the consequences are equivalent in a single project. The matrix considers probability and impact categories together.</p><p><b>How to answer:</b> never dismiss a low-probability event if its impact on project objectives could be severe. Equally, do not declare every high-probability minor nuisance the most important risk without examining consequences.</p>"],["6. Four response strategies","<div class=\"table-wrap\"><table><thead><tr><th>Strategy</th><th>What changes?</th><th>Illustration</th></tr></thead><tbody><tr><td>Avoid</td><td>Change the plan so the stated source no longer applies.</td><td>Choose a different site to remove a known access hazard.</td></tr><tr><td>Mitigate</td><td>Reduce probability or impact; residual risk remains.</td><td>Add redundancy to reduce the effect of equipment failure.</td></tr><tr><td>Transfer / Share</td><td>Allocate defined consequences to another party, usually by contract.</td><td>Contractual allocation of specified supplier failure consequences.</td></tr><tr><td>Accept</td><td>Keep the exposure and fund consequences if they occur.</td><td>Retain a low exposure and set aside resources for its consequences.</td></tr></tbody></table></div><p>“Transfer” does not mean the project has no remaining concern; the lecture says defined consequences are allocated/shared. “Mitigate” does not mean eliminate. “Avoid” changes the plan so the identified source no longer applies.</p>"],["7. Plan A and Plan B are about timing","<p>Plan A is the response actions/strategies implemented before the risk happens. Plan B is the contingency plan activated when the risk happens or it is near to happening.</p><p><b>Example — outdoor festival weather:</b> Plan A: monitor forecasts, secure weather-rated equipment, prepare covered areas and agree an indoor alternative. Plan B: activate the indoor venue when the defined severe-weather trigger is reached. Do not confuse preventive action with contingency activation.</p>"],["8. Assign the three risk roles","<p><b>Risk Owner:</b> the person in charge of the risk. <b>Risk Resource(s):</b> expert(s) with knowledge to help assess, analyse and manage. <b>Risk Originator:</b> the person who identified the risk. The originator is not automatically the owner. These roles answer three different questions: who noticed it, who has expertise, and who is accountable for it.</p>"]],"worked":["<b>Worked risk register — stage build.</b><ol><li><b>Objective:</b> festival opens safely on the announced date.</li><li><b>Condition:</b> stage build depends on a specialist rigging supplier.</li><li><b>Risk:</b> there is a risk that the supplier misses delivery.</li><li><b>Consequence:</b> causing sound check and opening to slip.</li><li><b>Analys
