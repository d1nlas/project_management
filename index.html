ng because the item is high priority.","Defer testing until the predecessor is complete; plan feasible Sprint work that supports the CSF."],"answer":3,"feedback":["Integration is required work, not optional scope.","Dependency types must reflect the nature of the work, not a desire to fit the schedule.","Priority cannot override the prerequisite.","Correct. Strategy determines importance; dependency logic determines when work can start."],"why":"Correct. Strategy determines importance; dependency logic determines when work can start.","correct_position":"D"},{"id":"INT-ADE","area":"ADE","topic":"Strategy, risk and methodology","kind":"Method selection under external uncertainty","level":"3-area integration","stem":"A service project has stable requirements and limited client access, but external approval may be delayed. What should the manager do?","options":["Use Agile because every external risk requires it.","Ignore the regulator because requirements are stable.","Remove the approval requirement from scope.","Use Predictive planning for the stable work and identify approval delay as a risk; keep the CSF and stakeholder needs visible."],"answer":3,"feedback":["Risk alone does not determine the methodology.","The regulator can affect project success regardless of client access.","An essential approval cannot be removed merely to simplify planning.","Correct. Method fit is based on project characteristics; external uncertainty still needs risk management."],"why":"Correct. Method fit is based on project characteristics; external uncertainty still needs risk management.","correct_position":"D"},{"id":"INT-ADF","area":"ADF","topic":"Strategy, risk and Scrum","kind":"Security risk and backlog","level":"3-area integration","stem":"A payment app has customer trust as a CSF. A possible security vulnerability is identified during Scrum work. What should the team do?","options":["Classify it as Won’t because it is not a feature.","Assume the CSF guarantees trust.","Ignore it until a breach occurs.","Make it transparent, assess probability and impact, and prioritise necessary investigation/remediation in the backlog."],"answer":3,"feedback":["Backlog work includes knowledge and technical tasks, not just visible features.","A CSF is a condition for success, not a guarantee.","Risk management is proactive.","Correct. This aligns strategic intent, risk analysis and backlog planning."],"why":"Correct. This aligns strategic intent, risk analysis and backlog planning.","correct_position":"D"},{"id":"INT-AEF","area":"AEF","topic":"Strategy, Agile and Scrum","kind":"Feedback-to-backlog logic","level":"3-area integration","stem":"After a Sprint Review, customers say the delivered feature does not support the project’s CSF of reducing drop-off. What should the Product Owner do?","options":["Treat completed code as success and keep the original backlog.","Use feedback to inspect progress toward the CSF and reprioritise future work by customer value.","Stop holding Sprint Reviews.","Replace the CSF with number of Sprints completed."],"answer":1,"feedback":["Output completion does not prove the intended outcome is being achieved.","Correct. Strategic objective remains the reference point; customer feedback informs backlog adaptation.","Sprint Review is a core inspection point.","Sprint count is not a meaningful substitute for the strategic result."],"why":"Correct. Strategic objective remains the reference point; customer feedback informs backlog adaptation.","correct_position":"B"},{"id":"INT-BCD","area":"BCD","topic":"Scope, schedule and risk","kind":"Plan documents as risk inputs","level":"3-area integration","stem":"A WBS reveals a supplier-dependent installation work package that must finish before commissioning. Supplier delays are possible. What should the manager do?","options":["Wait until commissioning is missed.","Remove the supplier work from WBS because it is external.","Use the WBS and schedule relationship to identify the risk, analyse its effect on commissioning and plan responses.","Treat the delay as a scope boundary."],"answer":2,"feedback":["Risk identification is proactive.","Externally performed work can still be in the project scope and affect delivery.","Correct. SS4 explicitly lists WBS and Gantt/Critical Path as risk-identification inputs.","A delay possibility is uncertainty, not a definition of what is in/out of scope."],"why":"Correct. SS4 explicitly lists WBS and Gantt/Critical Path as risk-identification inputs.","correct_position":"C"},{"id":"INT-BCE","area":"BCE","topic":"Scope, schedule and Agile","kind":"Hybrid with logical sequencing","level":"3-area integration","stem":"Stable regulatory infrastructure and an evolving user interface are part of the same project. Interface testing depends on infrastructure integration. Which statement is best?","options":["Use Pure Agile and ignore the integration prerequisite.","Use Hybrid, retain scope boundaries and dependency logic, and adapt interface development through feedback.","Remove the PSS because the interface evolves.","Use Pure Predictive and forbid user feedback."],"answer":1,"feedback":["Dependencies still apply in Agile.","Correct. The project contains stable and uncertain components; flexible development still respects dependencies.","PSS remains useful with more flexible boundaries.","This ignores the uncertainty and customer learning opportunity."],"why":"Correct. The project contains stable and uncertain components; flexible development still respects dependencies.","correct_position":"B"},{"id":"INT-BCF","area":"BCF","topic":"Scope, WBS and Scrum","kind":"Work decomposition and backlog","level":"3-area integration","stem":"A deliverable-oriented WBS is used to plan a platform. The team moves to Scrum. What should happen to the work representation?","options":["Discard the deliverables and keep only dates.","Convert required work into backlog items, refine and prioritise by value, and respect dependencies in Sprint planning.","Copy the WBS hierarchy and order unchanged.","Use the WBS as the Sprint Goal."],"answer":1,"feedback":["Deliverables remain important.","Correct. Scope decomposition and backlog prioritisation serve related but distinct purposes.","The course describes the Agile equivalent as more dynamic; backlog ordering is not simply WBS order.","A Sprint Goal describes the outcome the Sprint seeks, not the WBS hierarchy."],"why":"Correct. Scope decomposition and backlog prioritisation serve related but distinct purposes.","correct_position":"B"},{"id":"INT-BDE","area":"BDE","topic":"Scope, risk and Agile","kind":"Scope constraints and uncertainty","level":"3-area integration","stem":"A transport project has fixed safety constraints, but passenger features are evolving. Integration technology may not work. What should the project manager do?","options":["Delay all risk identification until requirements stabilise.","Use Agile to remove safety constraints.","Assume WBS eliminates technical risk.","Use Hybrid where appropriate, preserve safety scope, analyse integration risk and adapt evolving features."],"answer":3,"feedback":["Risk identification can begin from current project information and assumptions.","Agile flexibility does not override legal or safety constraints.","WBS helps reveal risks; it does not eliminate them.","Correct. Scope, risk and adaptive planning all remain relevant."],"why":"Correct. Scope, risk and adaptive planning all remain relevant.","correct_position":"D"},{"id":"INT-BDF","area":"BDF","topic":"Scope, risk and Scrum","kind":"Technical knowledge in backlog","level":"3-area integration","stem":"A Scrum team discovers that a feature requires unfamiliar integration technology. The uncertainty may cause rework. What should the team do?","options":["Add investigation and technical work to planning, analyse the risk and prioritise the knowledge needed to create value.","Exclude the issue because it is not customer-visible.","Remove the feature immediately.","Leave the WBS unchanged because only tasks are in a backlog."],"answer":0,"feedback":["Correct. The work is needed to understand and reduce uncertainty in delivering scope.","SS7 includes knowledge acquisition and technical tasks among backlog item types.","Removing the feature may be premature before assessing it.","The backlog is broader than only low-level implementation tasks."],"why":"Correct. The work is needed to understand and reduce uncertainty in delivering scope.","correct_position":"A"},{"id":"INT-BEF","area":"BEF","topic":"Scope, Agile and Scrum","kind":"Scope boundaries and MoSCoW","level":"3-area integration","stem":"A learning platform has clear exclusions but evolving features. The team marks all features Must. What is the best comment?","options":["Use a dynamic backlog and distinguish vital requirements from wanted and optional features using MoSCoW; retain boundaries.","Correct because all scoped features are equally vital.","Remove the PSS because Agile has no scope.","Classify all items Could."],"answer":0,"feedback":["Correct. Flexible scope and prioritisation work together; Must is reserved for vital elements.","Scope inclusion does not mean every item has equal criticality.","Agile scope boundaries can be more flexible but remain relevant.","This ignores the distinction between levels of necessity."],"why":"Correct. Flexible scope and prioritisation work together; Must is reserved for vital elements.","correct_position":"A"},{"id":"INT-CDE","area":"CDE","topic":"Schedule, risk and methodology","kind":"Uncertain duration and approach","level":"3-area integration","stem":"A construction project has stable requirements, but one critical activity has uncertain duration and severe failure impact. What is the most appropriate response?","options":["Remove the activity from the schedule.","Use PERT for duration estimation, analyse the risk and retain Predictive management where the wider project conditions support it.","Use only the optimistic estimate.","Switch the entire project to Agile because one duration is uncertain."],"answer":1,"feedback":["The activity is required work and should be planned.","Correct. PERT addresses probabilistic duration; risk analysis addresses consequences; stable requirements may still favour Predictive.","Optimistic duration is not a guaranteed estimate.","One uncertain activity does not necessarily determine the whole method."],"why":"Correct. PERT addresses probabilistic duration; risk analysis addresses consequences; stable requirements may still favour Predictive.","correct_position":"B"},{"id":"INT-CDF","area":"CDF","topic":"Schedule, risk and Scrum","kind":"Contingency with predecessor","level":"3-area integration","stem":"An external predecessor to a Sprint activity is delayed. A contingency supplier is ready. What should the team do when the trigger is reached?","options":["Activate the contingency, assess the Sprint Goal and schedule impact, and adapt the plan while respecting the dependency.","Start the dependent activity before its predecessor finishes.","Change the dependency without justification.","Ignore the issue until Sprint Retrospective."],"answer":0,"feedback":["Correct. Plan B can be activated, and Scrum supports inspection and adaptation.","This violates the mandatory predecessor condition.","A dependency should reflect the actual work logic.","Retrospective focuses on team process improvement, not immediate operational response."],"why":"Correct. Plan B can be activated, and Scrum supports inspection and adaptation.","correct_position":"A"},{"id":"INT-CEF","area":"CEF","topic":"Schedule, Agile and Scrum","kind":"Daily Scrum and dependencies","level":"3-area integration","stem":"During a Sprint, the team discovers a selected item depends on an activity that has not started. What is the most appropriate next step?","options":["Wait until the whole project ends.","Continue the item to maximise task count.","Inspect the impact on the Sprint Goal and adapt the plan so the work is feasible.","Ignore the dependency because Agile is adaptive."],"answer":2,"feedback":["The issue should be handled when discovered.","Task count is not the primary measure of meaningful progress.","Correct. Daily Scrum supports inspection of progress and adaptation of the plan; dependencies still matter.","Adaptive planning does not remove logical prerequisites."],"why":"Correct. Daily Scrum supports inspection of progress and adaptation of the plan; dependencies still matter.","correct_position":"C"},{"id":"INT-DEF","area":"DEF","topic":"Risk, Agile and Scrum","kind":"Emerging risk and inspection","level":"3-area integration","stem":"During a Sprint Review, stakeholders raise a possible product-safety limitation. The probability has not yet been assessed. What should happen?","options":["Remove all backlog items.","Automatically activate Plan B.","Make it transparent, inspect and analyse the risk, then choose an appropriate response and adapt subsequent work.","Ignore it because the increment is complete."],"answer":2,"feedback":["A risk does not automatically invalidate all other work.","A potential risk should be analysed before the contingency trigger is assumed to have been met.","Correct. The action connects SS4’s risk process with Scrum transparency, inspection and adaptation.","Sprint Review is a point of inspection and stakeholder feedback."],"why":"Correct. The action connects SS4’s risk process with Scrum transparency, inspection and adaptation.","correct_position":"C"},{"id":"INT-ABCD","area":"ABCD","topic":"Strategy, scope, schedule and risk","kind":"Integrated planning","level":"4-area integration","stem":"A hospital must be operational before monsoon. The PSS includes equipment but omits staff readiness. Training is a predecessor to final readiness checks, and there is a risk trainers will be unavailable. What is the best response?","options":["Wait until the risk occurs.","Keep the scope unchanged because training is operational.","Update the scope/WBS, schedule the readiness work and assess trainer availability as a risk with responses.","Remove readiness checks to protect the date."],"answer":2,"feedback":["Risk management is proactive.","The project objective may require training within project scope.","Correct. Strategic readiness must become a deliverable, scheduled activity and risk-managed requirement.","Removing a key readiness check undermines the CSF."],"why":"Correct. Strategic readiness must become a deliverable, scheduled activity and risk-managed requirement.","correct_position":"C"},{"id":"INT-ABCE","area":"ABCE","topic":"Strategy, scope, schedule and Agile","kind":"Hybrid integrated choice","level":"4-area integration","stem":"A charging-service project has stable infrastructure and evolving app features. Reliable customer access is a CSF. App release depends on the charging network being operational. Which approach is best?","options":["Pure Predictive and freeze all app requirements.","Pure Agile and remove the infrastructure prerequisite.","Hybrid planning: retain the infrastructure scope and dependency, adapt the app through feedback.","No PSS because the app changes."],"answer":2,"feedback":["This ignores evolving customer requirements.","A product cannot provide the promised service without the required infrastructure.","Correct. The project combines stable and uncertain components; dependency and CSF remain active.","PSS remains relevant under Agile/Hybrid."],"why":"Correct. The project combines stable and uncertain components; dependency and CSF remain active.","correct_position":"C"},{"id":"INT-ABCF","area":"ABCF","topic":"Strategy, scope, schedule and Scrum","kind":"Product value and feasibility","level":"4-area integration","stem":"A bank identifies secure onboarding as a CSF. The PSS includes identity verification and account activation. Activation testing depends on verification integration. The backlog currently prioritises a visual dashboard. What should the team do?","options":["Prioritise the vital verification work appropriately and plan a feasible sequence respecting the dependency.","Prioritise the dashboard because it is visible.","Test activation before verification integration.","Remove identity verification from scope."],"answer":0,"feedback":["Correct. Strategy and scope identify what matters; schedule logic determines feasibility.","Visibility is not the same as customer or strategic value.","This violates the predecessor relationship.","The feature is central to the stated CSF."],"why":"Correct. Strategy and scope identify what matters; schedule logic determines feasibility.","correct_position":"A"},{"id":"INT-ABDE","area":"ABDE","topic":"Strategy, scope, risk and methodology","kind":"Compliance and uncertain work","level":"4-area integration","stem":"A healthcare service needs clinical approval. Clinical requirements are stable, while the user experience is evolving. There is a risk specialists will be unavailable. Which choice is best?","options":["Use Agile and remove clinical approval.","Remove the CSF because the approval is external.","Use Predictive and assume specialists will be available.","Use Hybrid, retain clinical deliverables and manage specialist availability as a risk while adapting the user experience."],"answer":3,"feedback":["Agile does not remove mandatory approvals.","External dependencies can still be critical to success.","A plan should not assume away an identified uncertainty.","Correct. Stable approval requirements and evolving user experience can be managed differently; resource uncertainty needs risk treatment."],"why":"Correct. Stable approval requirements and evolving user experience can be managed differently; resource uncertainty needs risk treatment.","correct_position":"D"},{"id":"INT-ABDF","area":"ABDF","topic":"Strategy, scope, risk and Scrum","kind":"Security and backlog priority","level":"4-area integration","stem":"A government app has public trust as a CSF. Personal-data protection is in scope. A potential identity-service vulnerability is reported during backlog refinement. What should the team do?","options":["Remove identity protection from scope.","Classify it as Won’t because it is not confirmed.","Ignore it until release.","Assess the risk, preserve necessary protection deliverables and prioritise investigation/remediation in the backlog."],"answer":3,"feedback":["This contradicts the strategic and scope requirement.","An unconfirmed risk can still warrant analysis; Won’t is not a risk response.","Late discovery may create larger consequences; risk management is proactive.","Correct. Risk analysis and backlog prioritisation work together."],"why":"Correct. Risk analysis and backlog prioritisation work together.","correct_position":"D"},{"id":"INT-ABEF","area":"ABEF","topic":"Strategy, scope, Agile and Scrum","kind":"Customer feedback and backlog","level":"4-area integration","stem":"A platform’s CSF is customer retention. The PSS includes account management and recommendations. User testing shows account recovery is essential, while the backlog prioritises visual enhancements. Requirements evolve. What should the Product Owner do?","options":["Make every feature Must.","Use feedback to reprioritise essential account recovery while keeping project objectives and boundaries clear.","Remove the PSS.","Retain the original order because the PSS was approved."],"answer":1,"feedback":["Must should mean vital, not merely desirable.","Correct. The CSF provides strategic direction; backlog priority adapts to customer learning.","Agile does not eliminate scope definition.","An approved scope framework does not freeze all adaptive backlog ordering."],"why":"Correct. The CSF provides strategic direction; backlog priority adapts to customer learning.","correct_position":"B"},{"id":"INT-ACDE","area":"ACDE","topic":"Strategy, schedule, risk and methodology","kind":"Predictive with PERT and risk","level":"4-area integration","stem":"A product must be certified before an exhibition. Requirements are stable, but certification duration is uncertain and lies on the Critical Path. What should the manager do?","options":["Switch automatically to Pure Agile.","Use only optimistic duration.","Remove certification testing from the schedule.","Use Predictive planning where suitable, apply PERT to uncertain duration, assess the risk and examine critical-path recovery options."],"answer":3,"feedback":["Uncertain duration alone does not make all requirements adaptive.","Optimistic duration is not a commitment.","Certification is required work.","Correct. The method is selected from overall conditions; PERT and risk management address local uncertainty."],"why":"Correct. The method is selected from overall conditions; PERT and risk management address local uncertainty.","correct_position":"D"},{"id":"INT-ACDF","area":"ACDF","topic":"Strategy, schedule, risk and Scrum","kind":"Trigger response in a Sprint","level":"4-area integration","stem":"A reliable payment service is a CSF. Gateway integration precedes transaction testing and lies on the critical schedule. A supplier outage becomes imminent during a Sprint; a backup provider is ready. What should the team do?","options":["Change the dependency to SS.","Activate the relevant contingency, inspect impact on the Sprint Goal and critical schedule, and adapt the plan while preserving the dependency.","Test before integration.","Ignore the issue until Sprint Review."],"answer":1,"feedback":["Dependencies should not be changed merely to hide a delay.","Correct. It connects risk trigger, schedule logic and Scrum adaptation.","This violates the predecessor condition.","The issue requires timely response; Sprint ceremonies are not a reason to delay action."],"why":"Correct. It connects risk trigger, schedule logic and Scrum adaptation.","correct_position":"B"},{"id":"INT-ACEF","area":"ACEF","topic":"Strategy, schedule, Agile and Scrum","kind":"Customer value with prerequisites","level":"4-area integration","stem":"A travel app has a CSF of adoption. After Sprint Review, customers request that booking receive priority over a social feature. Booking depends on payment integration. What should the Product Owner do?","options":["Attempt booking before its prerequisite is ready.","Ignore feedback because the backlog order is fixed.","Remove payment integration.","Reprioritise future work toward booking while preserving the payment-integration dependency in Sprint planning."],"answer":3,"feedback":["This ignores technical feasibility.","SS7 says backlog items may be reprioritised.","Integration is required for the booking outcome.","Correct. Customer feedback can change future priority, but it does not remove prerequisites."],"why":"Correct. Customer feedback can change future priority, but it does not remove prerequisites.","correct_position":"D"},{"id":"INT-ADEF","area":"ADEF","topic":"Strategy, stakeholders, risk and Scrum","kind":"Stakeholder and risk response","level":"4-area integration","stem":"An emergency app has public safety as a CSF. Emergency authorities have high power; citizens have high interest. A Sprint Review reveals that notifications may fail in low-network areas. What should the team do?","options":["Make the issue transparent, analyse the risk, engage relevant stakeholders and adapt backlog/response to protect safety.","Transfer all responsibility to the authorities.","Accept the risk because stakeholders saw the increment.","Ignore citizen feedback because their power is low."],"answer":0,"feedback":["Correct. This combines CSF, stakeholder engagement, risk and Scrum adaptation.","Risk ownership and supplier/stakeholder responsibility need explicit analysis; transfer is not automatic.","Inspection does not equal automatic acceptance.","Low power does not mean a stakeholder is irrelevant or should be ignored."],"why":"Correct. This combines CSF, stakeholder engagement, risk and Scrum adaptation.","correct_position":"A"},{"id":"INT-BCDE","area":"BCDE","topic":"Scope, schedule, risk and methodology","kind":"Hybrid planning and risk","level":"4-area integration","stem":"A warehouse project has stable construction requirements but uncertain automation integration. The WBS and Gantt show installation dependencies; integration risk may delay commissioning. What is best?","options":["Use Hybrid as appropriate, retain scope/WBS and dependencies, and actively manage integration risk.","Use Agile and discard every schedule.","Remove commissioning from scope.","Assume the WBS eliminates risk."],"answer":0,"feedback":["Correct. Stable and uncertain components can be planned differently, while risk and dependencies remain active.","Agile does not mean no schedule.","Commissioning is a required deliverable in the scenario.","The project plan is an input to risk identification, not a guarantee against risk."],"why":"Correct. Stable and uncertain components can be planned differently, while risk and dependencies remain active.","correct_position":"A"},{"id":"INT-BCDF","area":"BCDF","topic":"Scope, schedule, risk and Scrum","kind":"Contingency and work sequence","level":"4-area integration","stem":"A software project’s migration must finish before reconciliation. During a Sprint, a supplier warns that its interface may fail; a backup method exists. What should the team do?","options":["Assess the integration risk, trigger the contingency when appropriate and adapt Sprint work while respecting the dependency.","Ignore the warning because the backlog is prioritised.","Remove migration from the WBS.","Start reconciliation before migration."],"answer":0,"feedback":["Correct. WBS/schedule logic, risk response and Scrum adaptation are integrated.","Prioritisation does not eliminate uncertainty or its consequences.","Migration remains required scope.","The mandatory predecessor relationship still applies."],"why":"Correct. WBS/schedule logic, risk response and Scrum adaptation are integrated.","correct_position":"A"},{"id":"INT-BCEF","area":"BCEF","topic":"Scope, WBS, Agile and Scrum","kind":"Dynamic planning architecture","level":"4-area integration","stem":"A platform has agreed exclusions and deliverables, but detailed features evolve through testing. Which statement correctly relates PSS, WBS, backlog and Sprint schedule?","options":["The PSS is abandoned; the backlog is the whole project plan.","The PSS sets boundaries, WBS helps decompose deliverable work, the backlog is dynamic and prioritised, and Sprint plans respect dependencies.","Flexible scope means any activity can start at any time.","The WBS fixes the backlog order permanently."],"answer":1,"feedback":["Scope and strategic direction remain relevant.","Correct. Each tool serves a distinct but connected purpose.","Scope flexibility does not remove logical sequencing.","The Agile backlog can be refined and reprioritised."],"why":"Correct. Each tool serves a distinct but connected purpose.","correct_position":"B"},{"id":"INT-BDEF","area":"BDEF","topic":"Scope, risk, Agile and Scrum","kind":"Compliance risk in adaptive development","level":"4-area integration","stem":"A healthcare portal has privacy and validation requirements. User interface features evolve. During backlog refinement, a possible model-accuracy problem appears. What is best?","options":["Analyse the accuracy risk, preserve mandatory scope requirements and prioritise the technical investigation/remediation in the backlog.","Freeze all user-interface requirements.","Ignore the issue until release.","Remove validation because requirements evolve."],"answer":0,"feedback":["Correct. Scope constraints, risk analysis and backlog work remain connected.","Freezing unrelated features does not resolve the accuracy issue.","Risk analysis is proactive.","Flexibility in one component does not remove mandatory safeguards."],"why":"Correct. Scope constraints, risk analysis and backlog work remain connected.","correct_position":"A"},{"id":"INT-CDEF","area":"CDEF","topic":"Schedule, risk, Agile and Scrum","kind":"Plan B within Sprint delivery","level":"4-area integration","stem":"A data-integration task must finish before reconciliation testing. A possible supplier outage becomes imminent during a Sprint. The team has a backup integration route. What should happen?","options":["Ignore the issue because the work is Agile.","Start reconciliation before integration.","Remove the deadline and dependency.","Activate the contingency when its trigger is met, inspect the dependency and Sprint Goal impact, and adapt the plan."],"answer":3,"feedback":["Agile does not remove risk management or dependencies.","This violates the predecessor relationship.","Self-management does not erase fixed external constraints.","Correct. It combines Plan B timing, schedule logic and Scrum inspection/adaptation."],"why":"Correct. It combines Plan B timing, schedule logic and Scrum inspection/adaptation.","correct_position":"D"}],"integration_intro":"50 scenario-based integration questions: all 15 two-area pairings, all 20 three-area combinations and all 15 four-area combinations. Each question has four option-specific explanations."};
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];

function persist(){try{localStorage.setItem(STORE,JSON.stringify(saved))}catch(e){toast('Local storage is unavailable in this browser.')}}

function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function go(p){currentPage=p;$('#crumb').textContent=pageNames[p]+' / Project Management';$$('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===p));$('#sidebar').classList.remove('open');render()}

document.addEventListener('click',e=>{const b=e.target.closest('[data-goto]');if(b)go(b.dataset.goto);const l=e.target.closest('[data-lesson]');if(l){currentLesson=l.dataset.lesson;go('theory')}});
$('#menuBtn').addEventListener('click',()=>$('#sidebar').classList.toggle('open'));

function completedCount(){return Object.values(saved.tracker||{}).filter(Boolean).length}

function render(){const c=$('#content');c.innerHTML='';if(currentPage==='home')c.innerHTML=home();else if(currentPage==='theory')c.innerHTML=theory();else if(currentPage==='cases')c.innerHTML=cases();else if(currentPage==='glossary')c.innerHTML=glossary();else if(currentPage==='tracker')c.innerHTML=tracker();else if(currentPage==='bank')c.innerHTML=bankPage();else if(currentPage==='integration')c.innerHTML=integrationPage();else if(currentPage.startsWith('mock')){c.innerHTML=mockPage(+currentPage.slice(4)-1)}else if(currentPage==='coverage')c.innerHTML=coverage();else if(currentPage==='original')c.innerHTML=originalPage();else if(currentPage==='sources')c.innerHTML=sources();bindPage()}
function home(){const n=completedCount(),t=allTracker();return `<section class="hero"><div class="eyebrow">SDA Bocconi Asia Center · IMB · Independent course resource</div><h2>Learn the logic.<br>Practise the judgement.</h2><p>This is a complete study journey through the Project Management course: understand the framework, work through real project decisions, calculate where required, diagnose mistakes and then attempt three closed-book-style examinations.</p><button class="btn primary" data-goto="theory">Begin with Session 1 →</button></section>
<div class="stats"><div class="stat"><strong>7</strong><span>Learning modules (A–F + application)</span></div><div class="stat"><strong>${DATA.bank.length+DATA.integration.length}</strong><span>Practice questions (topic + integration)</span></div><div class="stat"><strong>90</strong><span>Questions across 3 full mocks</span></div><div class="stat"><strong>${n}/${t}</strong><span>Revision topics checked</span></div></div>
<section class="panel"><h3>How this resource teaches</h3><div class="grid"><article class="card"><span class="tag">01 · Understand</span><h3>Build a mental model</h3><p>Learn not only what a term means, but why the method exists and where it fits in the project-management framework.</p></article><article class="card"><span class="tag">02 · Apply</span><h3>Walk through a decision</h3><p>Use worked examples to connect CSFs, scope, WBS, schedule, risk and adaptive delivery in realistic projects.</p></article><article class="card"><span class="tag">03 · Diagnose</span><h3>Learn from wrong answers</h3><p>Questions explain why each alternative is wrong, not just which letter is correct.</p></article></div></section>
<div class="section-head"><div><h2>The learning sequence</h2><p>Follow the course structure; the last module connects the simulations and final application session.</p></div></div><div class="grid">${DATA.lessons.map(l=>`<article class="card"><span class="tag">${esc(l.code)}</span><h3>${esc(l.title)}</h3><p>${esc(l.intro)}</p><div class="pillrow"><span class="pill">${l.sections.length} lecture sections</span><span class="pill">Worked walkthrough</span></div><p style="margin-top:13px"><button class="btn" data-lesson="${esc(l.code)}">Study this module →</button></p></article>`).join('')}</div>
<div class="section-head"><div><h2>Practice and assessment</h2><p>Move from topic mastery to mixed examination conditions.</p></div></div><div class="grid"><article class="card"><span class="tag green">Practice</span><h3>Topic question bank</h3><p>${DATA.bank.length} topic questions across the six knowledge areas, including classification, diagnosis, sequence, calculation, dependency logic and managerial decisions.</p><button class="btn" data-goto="bank">Open question bank</button></article><article class="card"><span class="tag gold">Combination practice</span><h3>Integration bank</h3><p>50 questions covering every two-, three- and four-area combination from the six-area map.</p><button class="btn" data-goto="integration">Open integration bank</button></article><article class="card"><span class="tag gold">Three examinations</span><h3>Full-length mock exams</h3><p>Three 30-question papers with a timer, navigation, flagging, submission and an answer-by-answer explanation.</p><button class="btn" data-goto="mock1">Open mock 1</button></article><article class="card"><span class="tag">Revision control</span><h3>Topic mastery tracker</h3><p>Track whether you can explain and apply a concept without the lecture slides.</p><button class="btn" data-goto="tracker">Open tracker</button></article></div>
<div class="callout"><b>Study protocol:</b> read one module, close the theory, explain its worked case in your own words, complete the relevant question-bank items, then mark the revision tracker. Do not mark a topic complete just because you have read its definition.</div>

function theory(){const l=DATA.lessons.find(x=>x.code===currentLesson)||DATA.lessons[0],m=l.masterclass;return `<h1 class="page-title">Theory & learning journey</h1><p class="lede">The lecture notes are the foundation. This expanded teaching layer explains how each concept works, how it connects to neighbouring sessions, how to apply it, and how the professor can turn it into a short scenario question.</p><div class="lesson-nav">${DATA.lessons.map(x=>`<button class="${x.code===currentLesson?'active':''}" data-lesson="${x.code}">${esc(x.code)} · ${esc(x.short)}</button>`).join('')}</div><section class="panel"><div class="eyebrow" style="color:var(--teal)">${esc(l.code)} · ${esc(l.refs)}</div><h2 class="page-title" style="font-size:29px;margin-top:6px">${esc(l.title)}</h2><p class="lede">${esc(l.intro)}</p><div class="lesson-outcome"><b>What you should be able to do:</b><br>${esc(m.promise)}</div><div class="concept-map"><small style="text-transform:uppercase;letter-spacing:.1em;color:var(--teal)">Concept map</small><br>${esc(m.map)}</div><h2 class="page-title" style="font-size:25px;margin:26px 0 10px">Lecture-grounded theory</h2>${l.sections.map((s,i)=>`<div class="master-block"><h3>${i+1}. ${esc(s.h)}</h3>${s.body}</div>`).join('')}<h2 class="page-title" style="font-size:25px;margin:28px 0 10px">Apply the whole module</h2><div class="master-worked"><h3>Worked decision walkthrough</h3><div>${m.worked[0]}</div><div class="exam-lens"><b>${m.worked[1]}</b></div></div><section class="panel"><h3>Original lecture notes and application note</h3><p class="small">${esc(l.application)}</p><p class="source-note"><b>Source basis:</b> ${esc(m.source)}. The worked examples are original teaching illustrations unless a lecture case is explicitly named. Supplementary explanations are labelled where lecture slides do not provide full mechanics.</p></section><div class="two-col"><div class="panel"><h3>Apply it in a case</h3><p>Move to the case labs and use this module as one part of a wider project decision.</p><button class="btn" data-goto="cases">Open application labs →</button></div><div class="panel"><h3>Check your understanding</h3><p>Filter the topic bank by this knowledge area and attempt both recall and application questions.</p><button class="btn primary" data-goto="bank">Open topic question bank →</button></div></div>`}
function cases(){return `<h1 class="page-title">Real-world application labs</h1><p class="lede">These are not decorative examples. Each case is a small project-management lab: identify the decision, choose the relevant framework, work through the sequence, and state what an exam answer should contain. Lecture cases are distinguished from original teaching scenarios.</p>${DATA.scenarios.map((s,i)=>`<section class="panel"><div class="qmeta"><span class="tag">Case ${i+1} · ${esc(s.areas)}</span><small>${i===0||i===1?'Lecture case reference':'Teaching exercise'}</small></div><h2>${esc(s.title)}</h2><p>${esc(s.context)}</p><h3 style="margin-top:17px">Decision walkthrough</h3>${s.steps.map((x,j)=>`<div class="case-step"><b>${j+1}. ${esc(x.h)}</b><div>${esc(x.d)}</div></div>`).join('')}<div class="case-output"><b>Exam takeaway:</b> ${esc(s.takeaway)}</div></section>`).join('')}<section class="panel"><h3>Integrated case method — use this on an unfamiliar scenario</h3><ol class="method-steps"><li><b>Find the objective:</b> what is the project trying to achieve and why?</li><li><b>Identify what must go well:</b> distinguish CSFs from measurable criteria and constraints.</li><li><b>Identify people:</b> who can affect, is affected by or perceives itself to be affected?</li><li><b>Define scope:</b> main deliverables, boundaries, constraints and exclusions.</li><li><b>Decompose the work:</b> WBS and work packages; do not sequence yet.</li><li><b>Build the schedule:</b> activity list, dependencies, durations, calendars, constraints and resources.</li><li><b>Look for uncertainty:</b> identify, describe, analyse and respond to risks.</li><li><b>Select the approach:</b> Predictive, Agile or Hybrid based on conditions—not fashion.</li><li><b>Prioritise and inspect:</b> if Scrum is used, connect backlog value to Sprint planning, Review and Retrospective.</li></ol></section>`}
function glossary(){return `<h1 class="page-title">Glossary, distinctions & worked formulas</h1><p class="lede">Use this as a quick-recall reference after studying the modules. The distinctions are deliberately phrased in the way they can be tested in an MCQ.</p>${DATA.glossary.map(g=>`<section class="panel"><h3>${esc(g.title)}</h3><div class="table-wrap"><table><thead><tr><th>Term</th><th>Meaning / examination distinction</th></tr></thead><tbody>${g.rows.map(r=>`<tr><td><b>${esc(r[0])}</b></td><td>${esc(r[1])}</td></tr>`).join('')}</tbody></table></div></section>`).join('')}<section class="panel"><h3>Formula and calculation workshop</h3><h4>Risk score</h4><div class="formula">Risk Score = Probability × Impact</div><p>Use this as the course’s simple score, but retain SS4’s qualification: for a single project, impact should receive greater attention; the risk matrix is asymmetric. Equal expected monetary values do not automatically mean equivalent managerial priority.</p><h4>PERT expected duration</h4><div class="formula">T<sub>E</sub> = (O + 4M + P) / 6</div><p>Worked: O=4, M=7, P=16 → (4 + 28 + 16)/6 = <b>8 days</b>.</p><h4>PERT standard deviation</h4><div class="formula">σ = (P − O) / 6</div><p>Worked: (16−4)/6 = <b>2 days</b>.</p><h4>Critical Path worked path comparison</h4><p>Path 1: A–B–D–E = 2+3+5+2 = 12 days. Path 2: A–C–D–E = 2+4+5+2 = 13 days. Path 2 is critical because it is the longer path. This arithmetic walkthrough is supplementary teaching detail for the CPM method named in SS3.</p><h4>Combination count used in our coverage plan</h4><div class="formula">C(n,r) = n! / [r!(n−r)!]</div><p>This is a study-planning formula used to enumerate combinations of six areas; it is not a Project Management lecture formula.</p></section><section class="panel"><h3>High-confusion distinctions</h3><div class="table-wrap"><table><thead><tr><th>Do not confuse</th><th>Difference</th></tr></thead><tbody><tr><td>CSF vs success criterion</td><td>CSF: area that must go well. Success criterion: measurable acceptable result.</td></tr><tr><td>Success criterion vs constraint</td><td>Target/result versus limiting condition on execution.</td></tr><tr><td>Output vs outcome</td><td>What the project produces versus the effect sought.</td></tr><tr><td>PSS vs WBS</td><td>Scope framework and major objectives versus hierarchical decomposition of work.</td></tr><tr><td>WBS vs Gantt</td><td>Scope decomposition with no time sequence versus temporal schedule.</td></tr><tr><td>Lead vs lag</td><td>Overlap/earlier start versus inserted waiting time.</td></tr><tr><td>Risk owner vs originator</td><td>Person in charge versus person who identified it.</td></tr><tr><td>Plan A vs Plan B</td><td>Preventive response before event versus contingency activated when event occurs or is near.</td></tr><tr><td>Agile vs no planning</td><td>Adaptive planning is still planning; CSFs, stakeholders, dependencies and risks remain relevant.</td></tr><tr><td>Sprint Review vs Retrospective</td><td>Inspect product outcome with stakeholders versus improve how the team works.</td></tr><tr><td>MoSCoW vs Kano</td><td>Priority/necessity classification versus attribute effect on customer satisfaction.</td></tr></tbody></table></div></section>`}
function tracker(){let total=allTracker(),done=completedCount();return `<h1 class="page-title">Revision tracker</h1><p class="lede">Mark a topic only when you can explain it without the slides and apply it to an unfamiliar scenario. Progress is saved in this browser.</p><div class="panel"><div style="display:flex;justify-content:space-between"><b>Overall mastery checklist</b><b>${done}/${total}</b></div><div class="progress" style="margin-top:9px"><i style="width:${done/total*100}%"></i></div><p class="small muted">${Math.round(done/total*100)}% of topics marked complete.</p></div>${DATA.tracker.map((g,i)=>`<section class="tracker-group"><h3>${esc(g.name)} <span class="muted small">· ${g.items.filter((x,j)=>saved.tracker?.[i+'-'+j]).length}/${g.items.length}</span></h3><div class="tracker-items">${g.items.map((x,j)=>`<label class="track-item"><input type="checkbox" data-track="${i}-${j}" ${saved.tracker?.[i+'-'+j]?'checked':''}><span>${esc(x)}</span></label>`).join('')}</div></section>`).join('')}<button class="btn" id="resetTracker">Reset checklist</button>`}
function bankPage(){let items=DATA.bank.filter(q=>(bankFilter==='all'||q.area.startsWith(bankFilter))&&(!bankQuery||[q.topic,q.stem,q.area,q.kind||''].join(' ').toLowerCase().includes(bankQuery.toLowerCase())));const kinds=[...new Set(DATA.bank.map(q=>q.kind||'Scenario application'))].sort();return `<h1 class="page-title">Topic question bank</h1><p class="lede">${esc(DATA.bank_intro)} The question formats are deliberately mixed: concept recognition, classification, diagnosis, process sequence, calculations, dependency logic and managerial decisions. Every option is explained after you answer.</p><div class="bank-summary"><span><b>${DATA.bank.length}</b> questions</span><span><b>6</b> knowledge areas</span><span><b>${kinds.length}</b> question styles</span><span>Instant option-level feedback</span></div><div class="bank-controls"><input id="bankSearch" placeholder="Search a concept, term, calculation or scenario…" value="${esc(bankQuery)}"><select id="bankFilter"><option value="all">All six areas</option>${['A','B','C','D','E','F'].map(x=>`<option ${bankFilter===x?'selected':''} value="${x}">${x} · ${esc(DATA.lessons.find(l=>l.code===x).short)}</option>`).join('')}</select></div><p class="small muted">Showing ${items.length} of ${DATA.bank.length} questions. Search covers the stem, topic and question style. Your selected answers are saved in this browser.</p><div id="bankItems">${items.map(q=>bankQuestion(q)).join('')||'<div class="panel">No questions match the current search.</div>'}</div>`}
function bankQuestion(q){return `<article class="question" data-q="${q.id}"><div class="qmeta"><span class="tag">${esc(q.area)}</span><small>${esc(q.level)} · ${esc(q.topic)}</small></div><div class="pillrow"><span class="question-type">${esc(q.kind||'Scenario application')}</span></div><div class="qstem">${esc(q.stem)}</div>${q.options.map((o,i)=>`<label class="option" data-option="${i}"><input type="radio" name="${q.id}" value="${i}"><span><b>${'ABCD'[i]}.</b> ${esc(o)}</span></label>`).join('')}<div class="bank-feedback"></div></article>`}
function bindBank(){const search=$('#bankSearch'),filter=$('#bankFilter');if(search)search.addEventListener('input',()=>{bankQuery=search.value.toLowerCase();$$('.question',$('#bankItems')).forEach(el=>{const q=DATA.bank.find(x=>x.id===el.dataset.q);el.classList.toggle('hidden',!([q.topic,q.stem,q.area,q.kind||''].join(' ').toLowerCase().includes(bankQuery)))})});if(filter)filter.addEventListener('change',()=>{bankFilter=filter.value;render()});$('#bankItems')?.addEventListener('change',e=>{const inp=e.target;if(!inp.matches('input[type=radio]'))return;const q=DATA.bank.find(x=>x.id===inp.name),idx=+inp.value,box=inp.closest('.question'),fb=box.querySelector('.bank-feedback');$$('.option',box).forEach((el,i)=>{el.classList.toggle('correct',i===q.answer);el.classList.toggle('wrong',i===idx&&idx!==q.answer)});fb.innerHTML=`<div class="q-explain"><b>${idx===q.answer?'You identified the best answer.':'Review the distinction.'}</b> ${esc(q.options[q.answer])}</div>`+q.feedback.map((f,i)=>`<div class="feedback ${i===q.answer?'good':i===idx?'bad':''}"><b>${'ABCD'[i]} ${i===q.answer?'· Correct reasoning':i===idx?'· Your selected option':'· Why this is weaker'}</b> — ${esc(f)}</div>`).join('');saved.bank=saved.bank||{};saved.bank[q.id]=idx;persist()})}
function integrationPage(){let items=DATA.integration.filter(q=>(integrationFilter==='all'||String(q.area.length)===integrationFilter)&&(!integrationQuery||[q.topic,q.stem,q.area,q.kind].join(' ').toLowerCase().includes(integrationQuery.toLowerCase())));return `<h1 class="page-title">Integration practice bank</h1><p class="lede">${esc(DATA.integration_intro)} This section takes the combination map from our earlier work and turns it into a traceable practice set. The combination label is shown here for study; it is hidden in the full mock examinations.</p><div class="bank-summary"><span><b>${DATA.integration.length}</b> integrated scenarios</span><span><b>15</b> two-area</span><span><b>20</b> three-area</span><span><b>15</b> four-area</span></div><div class="bank-controls"><input id="integrationSearch" placeholder="Search a combination or topic…" value="${esc(integrationQuery)}"><select id="integrationFilter"><option value="all">All combinations</option><option value="2" ${integrationFilter==='2'?'selected':''}>Two-area</option><option value="3" ${integrationFilter==='3'?'selected':''}>Three-area</option><option value="4" ${integrationFilter==='4'?'selected':''}>Four-area</option></select></div><p class="small muted">Showing ${items.length} of ${DATA.integration.length} questions.</p><div id="integrationItems">${items.map(q=>bankQuestion(q)).join('')||'<div class="panel">No questions match this filter.</div>'}</div>`}
let integrationFilter='all',integrationQuery='';
function bindIntegrationBank(){const search=$('#integrationSearch'),filter=$('#integrationFilter');search?.addEventListener('input',()=>{integrationQuery=search.value.toLowerCase();$$('.question',$('#integrationItems')).forEach(el=>{const q=DATA.integration.find(x=>x.id===el.dataset.q);el.classList.toggle('hidden',!([q.topic,q.stem,q.area,q.kind].join(' ').toLowerCase().includes(integrationQuery)))})});filter?.addEventListener('change',()=>{integrationFilter=filter.value;render()});$('#integrationItems')?.addEventListener('change',e=>{const inp=e.target;if(!inp.matches('input[type=radio]'))return;const q=DATA.integration.find(x=>x.id===inp.name),idx=+inp.value,box=inp.closest('.question'),fb=box.querySelector('.bank-feedback');$$('.option',box).forEach((el,i)=>{el.classList.toggle('correct',i===q.answer);el.classList.toggle('wrong',i===idx&&idx!==q.answer)});fb.innerHTML=`<div class="q-explain"><b>${idx===q.answer?'You identified the best answer.':'Review the integration.'}</b> ${esc(q.options[q.answer])}</div>`+q.feedback.map((f,i)=>`<div class="feedback ${i===q.answer?'good':i===idx?'bad':''}"><b>${'ABCD'[i]} ${i===q.answer?'· Correct reasoning':i===idx?'· Your selected option':'· Why this is weaker'}</b> — ${esc(f)}</div>`).join('');saved.integration=saved.integration||{};saved.integration[q.id]=idx;persist()})}

function mockPage(index){const questions=DATA.mocks[index],key='mock'+(index+1),state=mockState[key]||{answers:{},flags:{},pos:0,submitted:false,started:false,seconds:45*60};mockState[key]=state;const attempted=Object.keys(state.answers).length;const profiles=['Balanced foundation and application: classification, process logic, calculations and managerial judgement.','Applied judgement: diagnosing flawed plans, interpreting dependencies and choosing responses.','Integrated examination: cross-session reasoning, simulations, Scrum and project-level decisions.'];return `<h1 class="page-title">Mock examination ${index+1}</h1><p class="lede">${profiles[index]} Thirty single-best-answer MCQs in the compact scenario style of the supplied mock, with a wider mix of question forms. Suggested practice time: 45 minutes; this is not an official duration stated in the syllabus.</p><div class="mock-intro-grid"><div class="stat"><strong>30</strong><span>Single-best-answer MCQs</span></div><div class="stat"><strong>6</strong><span>Knowledge areas</span></div><div class="stat"><strong>45 min</strong><span>Suggested practice time</span></div></div>${!state.started?`<section class="panel"><span class="tag gold">Practice conditions</span><h3>Before you begin</h3><ul><li>Attempt without consulting the theory pages.</li><li>Question forms include classification, diagnosis, calculations, process order, dependency logic and managerial choices.</li><li>Use the palette to navigate and flag uncertain questions.</li><li>After submission, each of the four options receives an explanation.</li></ul><button class="btn primary" id="startMock">Start examination</button></section>`:state.submitted?mockReview(index):`<div class="exam-layout"><section class="panel"><div class="qmeta"><span class="tag">Question ${state.pos+1} of 30</span><small>${attempted} answered</small></div><div class="qstem">${esc(questions[state.pos].stem)}</div>${questions[state.pos].options.map((o,j)=>`<label class="exam-option ${state.answers[state.pos]===j?'selected':''}"><input type="radio" name="mock-answer" value="${j}" ${state.answers[state.pos]===j?'checked':''}><span><b>${'ABCD'[j]}.</b> ${esc(o)}</span></label>`).join('')}<div style="display:flex;justify-content:space-between;gap:8px;margin-top:17px"><button class="btn" id="prevQ" ${state.pos===0?'disabled':''}>← Previous</button><button class="btn" id="flagQ">${state.flags[state.pos]?'Unflag':'Flag'} question</button><button class="btn primary" id="nextQ" ${state.pos===29?'disabled':''}>Next →</button></div></section><aside class="exam-side"><div style="display:flex;justify-content:space-between"><b>Progress</b><b id="timer" data-seconds="${state.seconds}">${formatTime(state.seconds)}</b></div><p class="small muted">Suggested timer</p><div class="progress"><i style="width:${attempted/30*100}%"></i></div><div class="qgrid">${questions.map((q,i)=>`<button class="${state.pos===i?'current':''} ${state.answers[i]!==undefined?'answered':''} ${state.flags[i]?'flagged':''}" data-qpos="${i}">${i+1}</button>`).join('')}</div><p class="small muted">Green = answered · ⚑ = flagged</p><button class="btn primary" style="width:100%" id="submitMock">Submit examination</button><p class="small muted">You can revisit and change answers before submission.</p></aside></div>`}`}
function formatTime(s){return Math.floor(s/60).toString().padStart(2,'0')+':'+(s%60).toString().padStart(2,'0')}
let timerHandle=null;
function startTimer(index){if(timerHandle)clearInterval(timerHandle);const key='mock'+(index+1),st=mockState[key];timerHandle=setInterval(()=>{if(!st||st.submitted||!st.started){clearInterval(timerHandle);return}st.seconds=Math.max(0,st.seconds-1);const el=$('#timer');if(el)el.textContent=formatTime(st.seconds);if(st.seconds===0){st.submitted=true;clearInterval(timerHandle);go(key);toast('Time reached. Examination submitted automatically.')}},1000)}
function mockReview(index){const key='mock'+(index+1),st=mockState[key],qs=DATA.mocks[index],score=qs.filter((q,i)=>st.answers[i]===q.answer).length;const domains=['A · Strategy & stakeholders','B · Scope & WBS','C · Scheduling','D · Risk Management','E · Agile/Predictive/Hybrid','F · Scrum & prioritisation'];const missed=domains.map(d=>({d,wrong:qs.filter((q,i)=>(q.area||'').startsWith(d[0])&&st.answers[i]!==q.answer).length,total:qs.filter(q=>(q.area||'').startsWith(d[0])).length}));return `<div class="panel"><span class="tag ${score>=24?'green':score>=18?'gold':'red'}">Result</span><h2 class="page-title">${score}/30</h2><p>${score>=25?'Strong performance. Review the few missed distinctions.':score>=21?'Good performance; strengthen the specific concepts you missed.':score>=18?'Developing understanding; revisit the related theory and retry.':'Use the answer review diagnostically, then revise the relevant modules before retaking.'}</p><div class="stats"><div class="stat"><strong>${score}</strong><span>Correct</span></div><div class="stat"><strong>${30-score}</strong><span>Incorrect / unanswered</span></div><div class="stat"><strong>${Object.keys(st.answers).length}</strong><span>Attempted</span></div><div class="stat"><strong>${formatTime(45*60-st.seconds)}</strong><span>Time elapsed (approx.)</span></div></div><button class="btn" id="retakeMock">Retake this mock</button></div><section class="panel"><h3>Performance by area</h3><div class="table-wrap"><table><thead><tr><th>Area</th><th>Missed</th><th>Total questions</th></tr></thead><tbody>${missed.map(x=>`<tr><td>${esc(x.d)}</td><td>${x.wrong}</td><td>${x.total}</td></tr>`).join('')}</tbody></table></div><p class="small muted">A missed answer is a cue to revisit a concept, not proof that the whole area is weak.</p></section><section class="panel"><h3>Answer-by-answer reasoning</h3>${qs.map((q,i)=>`<div class="review-item"><div class="qmeta"><b>Q${i+1} · ${esc(q.topic)}</b><span class="question-type">${esc(q.kind||'Scenario application')}</span><span class="tag ${st.answers[i]===q.answer?'green':'red'}">${st.answers[i]===q.answer?'Correct':'Review'}</span></div><p>${esc(q.stem)}</p>${q.options.map((o,j)=>`<div class="review-option ${j===q.answer?'correct':st.answers[i]===j?'incorrect':''}"><b>${'ABCD'[j]}. ${esc(o)}</b><br>${esc(q.feedback[j])}</div>`).join('')}<div class="exam-lens"><b>Underlying reasoning:</b> ${esc(q.why)}</div></div>`).join('')}</section>`}
function bindMock(index){const key='mock'+(index+1),st=mockState[key];$('#startMock')?.addEventListener('click',()=>{st.started=true;go(key);startTimer(index)});if(!st.started||st.submitted)return;$('#prevQ')?.addEventListener('click',()=>{st.pos--;go(key)});$('#nextQ')?.addEventListener('click',()=>{st.pos++;go(key)});$('#flagQ')?.addEventListener('click',()=>{st.flags[st.pos]=!st.flags[st.pos];go(key)});$$('[data-qpos]').forEach(b=>b.addEventListener('click',()=>{st.pos=+b.dataset.qpos;go(key)}));$$('input[name=mock-answer]').forEach(inp=>inp.addEventListener('change',()=>{st.answers[st.pos]=+inp.value;go(key)}));$('#submitMock')?.addEventListener('click',()=>{if(confirm('Submit this examination and reveal the explanations?')){st.submitted=true;if(timerHandle)clearInterval(timerHandle);go(key)}});$('#retakeMock')?.addEventListener('click',()=>{mockState[key]={answers:{},flags:{},pos:0,submitted:false,started:false,seconds:45*60};go(key)})}
function coverage(){const pairs=DATA.coverage;return `<h1 class="page-title">Syllabus & question coverage</h1><p class="lede">The resource follows the official eight-session course, grouped into six core knowledge areas plus the two application/simulation sessions. Coverage labels distinguish direct lecture content from teaching examples.</p><div class="grid">${DATA.lessons.map(l=>`<article class="card"><span class="tag">${esc(l.code)}</span><h3>${esc(l.title)}</h3><p>${esc(l.intro)}</p><small class="muted">${esc(l.refs)}</small></article>`).join('')}</div><section class="panel"><h3>Combination coverage model</h3><p>Six core areas create 15 two-area pairings, 20 three-area combinations and 15 four-area combinations. This is a study-planning map, not an official examination weighting.</p><div class="table-wrap"><table><thead><tr><th>Coverage</th><th>Possible combinations</th><th>Generated practice</th></tr></thead><tbody>${pairs.map(x=>`<tr><td>${esc(x[0])}</td><td>${esc(x[1])}</td><td>${esc(x[2])}</td></tr>`).join('')}</tbody></table></div></section><div class="callout"><b>Scope note:</b> The mock examinations are original practice questions. They are not the professor's actual examination or a prediction of its topic distribution.</div>`}
function originalPage(){return `<h1 class="page-title">Professor’s original mock — analysis</h1><p class="lede">The supplied mock contains ten questions. This reference page maps each question to its intended concept, explains the answer logic and explains why every alternative is weaker. The file did not include an official answer key; these are reasoned interpretations of the lecture material.</p><div class="callout warning"><b>Important correction for Q4:</b> the ₹40 lakh sales target is a success criterion; the budget ceiling and legal prohibition are constraints. Do not classify the budget statement as a CSF simply because it is important.</div>${DATA.original.map(q=>`<article class="question"><div class="qmeta"><span class="tag">Q${q.n} · ${esc(q.topic)}</span><small>Original 2026 mock</small></div><div class="qstem">${esc(q.stem)}</div>${q.options.map((o,i)=>`<div class="review-option ${i===q.answer?'correct':''}"><b>${'ABCD'[i]}. ${esc(o)}</b><br>${esc(q.feedback[i])}</div>`).join('')}<div class="callout"><b>Underlying reasoning:</b> ${esc(q.why)}</div></article>`).join('')}`}
function sources(){return `<h1 class="page-title">Sources & study notes</h1><p class="lede">The material is grounded in the files supplied in this conversation. The lecture terminology and session organisation are retained; real-world examples are newly written teaching illustrations.</p><section class="panel"><h3>Source register</h3><div class="table-wrap"><table><thead><tr><th>Source</th><th>Session / pages</th><th>Used for</th></tr></thead><tbody>${DATA.sources.map(s=>`<tr><td>${esc(s[0])}</td><td>${esc(s[1])}<br>${esc(s[2])}</td><td>${esc(s[3])}</td></tr>`).join('')}</tbody></table></div></section><section class="panel"><h3>Important qualifications</h3><ul><li>SS3 and SS4 decks supplied are from 2024. The 2026 course summary and syllabus are used as cross-checks where relevant.</li><li>The supplied materials do not provide full LIBRA or Easter Eggs simulation mechanics. This resource covers only the learning objectives stated in the syllabus and course summary.</li><li>Critical Chain Project Management is named in SS3, but its mechanics are not developed in the uploaded slides. It is listed for awareness rather than expanded as if lecture detail were supplied.</li><li>The 2026 syllabus lists the Scrum Guide 2020 as a required reading. Some Scrum role/artifact clarifications are identified as supplementary where the slides are concise.</li><li>Question answer keys are authored interpretations of the slide material; the supplied original mock does not include an official answer key.</li></ul></section><section class="panel"><h3>Exam format stated in the syllabus</h3><p>Individual closed-book exam: 30 MCQs, 50% of course grade. Team Project Management Plan: 50%. A pass in both is required. The syllabus does not specify the examination duration in the supplied copy.</p></section>`}
function bindPage(){if(currentPage==='theory')$$('[data-lesson]').forEach(b=>b.addEventListener('click',()=>{currentLesson=b.dataset.lesson;render()}));if(currentPage==='tracker'){$$('[data-track]').forEach(x=>x.addEventListener('change',()=>{saved.tracker=saved.tracker||{};saved.tracker[x.dataset.track]=x.checked;persist();render()}));$('#resetTracker')?.addEventListener('click',()=>{if(confirm('Clear all revision checklist marks?')){saved.tracker={};persist();render()}})}if(currentPage==='bank')bindBank();if(currentPage==='integration')bindIntegrationBank();if(currentPage.startsWith('mock'))bindMock(+currentPage.slice(4)-1)}
render();
</script>
