is:</b> assess likelihood and the impact on the critical sequence; do not rank by probability alone.</li><li><b>Plan A:</b> confirm milestones, inspect readiness and agree escalation points.</li><li><b>Plan B:</b> use the pre-approved alternative supplier if the trigger is reached.</li><li><b>Roles:</b> originator = person who flags the risk; resource = technical expert; owner = accountable manager.</li></ol>","Examiner’s lens: identify which process stage applies, distinguish response strategies, and separate originator, resource and owner."],"source":"SS4 2024 pages 8–20; Course Summary SS4 page 6."}},{"code":"E","title":"Agile, Predictive & Hybrid Management","short":"Agile & methodology","intro":"Choose and adapt the approach to the project context. The course does not teach Agile as universally superior. It says traditional project management works well in many situations; Agile makes sense when the environment is unpredictable and potentially shippable products can be delivered during the project life.","refs":"SS6 · 2026","application":"Apply the concepts to identify what must go well, what work is required, which constraints apply and what decision best fits the project's conditions.","sections":[{"h":"What Agile means","body":"<p>SS6 describes Agile as discovering requirements and developing solutions through collaboration among self-organising, cross-functional teams and customers/end users. It advocates adaptive planning, evolutionary development, early delivery, continual improvement and flexible responses to change.</p><div class='callout'><b>Application / example:</b> Teaching example — an experimental consumer app with uncertain requirements and accessible users may benefit from short feedback cycles and useful increments.</div>"},{"h":"When Agile, when Predictive","body":"<p>Agile suits frequently changing/unclear requirements, intense customer collaboration and immediate feedback, meaningful learning during the project, modular increments with customer value, errors that can be a source of learning, lower cost of change and team-oriented cross-functional culture. Predictive suits stable/clear requirements, difficult customer access, predictable results, work tested mainly at the end, catastrophic error impact, high cost of change and specialised/hierarchical communication.</p><div class='callout'><b>Application / example:</b> Decision rule — examine requirements, customer access, modularity, error impact, change cost and organisational culture together.</div>"},{"h":"Hybrid","body":"<p>CSFs and stakeholder management apply to Predictive, Pure Agile and Hybrid. Scope statements remain relevant, with more flexible boundaries under Agile/Hybrid. Agile uses a more dynamic WBS-like approach represented by the backlog. Scheduling may sometimes be inside an iteration, but dependencies apply. Risk management remains relevant under all three.</p><div class='callout'><b>Application / example:</b> Teaching example — a regulated infrastructure component with stable specifications may be managed predictively, while an evolving customer-facing interface is developed adaptively.</div>"},{"h":"I-shaped and T-shaped organisations","body":"<p>SS6 identifies I-shaped organisations with differences in language, potential lack of respect and lack of role flexibility. T-shaped is a useful teaching shorthand for combining specialist depth with ability to collaborate across functions; this is an interpretation of the slide's I/T contrast.</p><div class='callout'><b>Application / example:</b> Teaching example — designers, engineers and marketers who understand their own disciplines but coordinate and respect one another are better placed for cross-functional work.</div>"},{"h":"Four Agile values","body":"<p>Individuals and interactions over processes and tools; working software over comprehensive documentation; customer collaboration over contract negotiation; responding to change over following a plan. Items on the right still have value; left-hand items are valued more.</p><div class='callout'><b>Application / example:</b> Exam trap — Agile does not prohibit documentation, tools, contracts or plans. It expresses relative priorities.</div>"},{"h":"Twelve Agile principles","body":"<p>The slides list early/continuous delivery; welcome changing requirements; frequent delivery; daily business-developer collaboration; motivated individuals; face-to-face conversation; working software as progress measure; sustainable development; technical excellence; simplicity; self-organising teams; and regular reflection/adjustment.</p><div class='callout'><b>Application / example:</b> Use scenarios to recognise a principle rather than memorise only its number.</div>"}],"masterclass":{"promise":"You should be able to choose Predictive, Pure Agile or Hybrid based on the project conditions, interpret the four Agile values and twelve principles, and understand why organisational behaviour affects methodology.","map":"Understand uncertainty + customer access + modularity + error impact + change cost + culture → choose a fit → retain project-management foundations → adapt execution.","sections":[["1. Agile is an approach to learning and adaptation","<p>SS6 describes Agile as discovering requirements and developing solutions through collaborative effort of self-organising, cross-functional teams and customers/end users. It advocates adaptive planning, evolutionary development, early delivery, continual improvement and flexible responses to change.</p><p>Agile is not a synonym for “no plan”. It changes when detail is committed and how the team responds as information improves. A project can still have objectives, CSFs, stakeholders, scope boundaries, a schedule and risks.</p>"],["2. Select the method from the project conditions","<div class=\"table-wrap\"><table><thead><tr><th>Condition</th><th>Agile tends to fit when…</th><th>Predictive tends to fit when…</th></tr></thead><tbody><tr><td>Requirements</td><td>Change frequently or are unclear.</td><td>Stable, predictable and clear.</td></tr><tr><td>Customer involvement</td><td>Intense collaboration and immediate feedback are possible.</td><td>Clients are difficult to reach.</td></tr><tr><td>Learning during project</td><td>Very relevant.</td><td>Less relevant.</td></tr><tr><td>Results</td><td>Unpredictable.</td><td>Predictable.</td></tr><tr><td>Modularity</td><td>Project can be broken into increments, each with customer value.</td><td>Product may be tested only at the end.</td></tr><tr><td>Impact of errors</td><td>Can become a source of learning.</td><td>Can be catastrophic.</td></tr><tr><td>Cost of change</td><td>Low.</td><td>High.</td></tr><tr><td>Culture</td><td>Team-oriented, cross-functional, shared leadership.</td><td>Specialisation, hierarchy and coordination through the boss.</td></tr></tbody></table></div><p>Do not choose by one keyword. Examine the pattern. A single uncertain activity does not automatically mean the entire project should be Agile. A stable infrastructure plus evolving customer interface may support Hybrid management.</p>"],["3. What Hybrid means in this course","<p>SS6 maps key methodologies across Predictive, Pure Agile and Hybrid. CSFs and stakeholder management are present in all three. Scope statements remain relevant, although boundaries are more flexible in Agile/Hybrid. The WBS exists in Predictive and Hybrid; in Agile a similar, more dynamic approach is represented by the backlog. Scheduling may sometimes be within a single iteration; dependencies still apply. Risk management is present in all three.</p><p><b>Worked decision:</b> a bank’s regulatory data migration has stable specifications and expensive changes; the customer-facing onboarding flow is still being tested with users. The infrastructure can be planned predictively, while the interface can be developed adaptively. This is a Hybrid rationale—not a claim that every project must be hybrid.</p>"],["4. I-shaped and T-shaped organisations","<p>SS6 describes I-shaped organisations through differences in language, potential lack of respect (“what I do is more relevant/challenging”) and lack of flexibility of roles. The slide contrasts I and T shapes. A useful teaching interpretation of T-shaped is a person with depth in a discipline who can also collaborate across boundaries. This supports the cross-functional, team-oriented culture associated with Agile.</p><p>The issue is not that specialisation is bad. The issue is silo behaviour that blocks communication, shared responsibility and role flexibility.</p>"],["5. Four Agile values — understand the comparison","<ol><li>Individuals and interactions over processes and tools.</li><li>Working software over comprehensive documentation.</li><li>Customer collaboration over contract negotiation.</li><li>Responding to change over following a plan.</li></ol><p>The Manifesto’s qualification matters: the items on the right still have value; the items on the left are valued more. Therefore Agile does not prohibit documentation, tools, contracts or plans. It emphasises what should receive greater priority when trade-offs arise.</p>"],["6. The twelve principles as behaviours","<ol><li>Satisfy the customer through early and continuous delivery of valuable software.</li><li>Welcome changing requirements, even late in development.</li><li>Deliver working software frequently, preferring shorter timescales.</li><li>Business people and developers work together daily.</li><li>Build projects around motivated individuals.</li><li>Face-to-face conversation is an efficient way to convey information.</li><li>Working software is the primary measure of progress.</li><li>Promote sustainable development.</li><li>Technical excellence and good design enhance agility.</li><li>Simplicity: maximise the amount of work not done.</li><li>Best architectures, requirements and designs emerge from self-organising teams.</li><li>At regular intervals, reflect and adjust behaviour.</li></ol><p>For scenario questions, translate the story into behaviour. Daily business/developer contact maps to principle 4; working software as progress maps to principle 7; retrospective improvement maps to principle 12.</p>"]],"worked":["<b>Method-selection walkthrough — digital insurance service.</b><ol><li>Claims rules and statutory data requirements are stable: plan these predictively.</li><li>The customer interface is uncertain and users are available: deliver prototypes and gather feedback adaptively.</li><li>Data integration is a mandatory dependency: preserve it regardless of method.</li><li>Regulatory approval is a risk and remains in risk management.</li><li>CSFs and stakeholder management remain active across both workstreams.</li><li>Use a Hybrid approach because different project components have different uncertainty and change-cost profiles.</li></ol>","Examiner’s lens: choose method by the whole pattern of requirements, customer access, modularity, error impact, cost of change and culture—not by “Agile is modern” or “Predictive is safer”."],"source":"SS6 2026 pages 3–11; Course Summary SS6 page 8."}},{"code":"F","title":"Scrum & Requirements Prioritisation","short":"Scrum & prioritisation","intro":"Turn feedback into ordered, meaningful increments. The course summary says the Product Backlog is pivotal in Agile, a good backlog is always prioritised, its structure is not standardised and prioritisation should reflect customer collaboration and customer value.","refs":"SS7 · 2026","application":"Apply the concepts to identify what must go well, what work is required, which constraints apply and what decision best fits the project's conditions.","sections":[{"h":"Scrum pillars","body":"<p>SS7 describes Transparency, Inspection and Adaptation. Work and artifacts must be visible. Scrum artifacts and progress toward goals are inspected frequently. If a process deviates or the product is unacceptable, the team adapts promptly. Transparency enables inspection; inspection enables adaptation.</p><div class='callout'><b>Application / example:</b> Teaching example — a Sprint Review exposes that users cannot complete a key task; the team and stakeholders decide what should change next.</div>"},{"h":"Scrum values","body":"<p>The SS7 visual lists five values: Courage, Focus, Commitment, Respect and Openness. The slide describes courage to do the right thing, focus on Sprint work and team goals, commitment to team goals, respect for capable independent people and openness about work and challenges.</p><div class='callout'><b>Application / example:</b> Exam connection — concealing problems conflicts with openness; protecting Sprint focus while solving a hard issue reflects focus and courage.</div>"},{"h":"Scrum events and flow","body":"<p>The SS7 diagram shows Product Backlog, backlog refinement, Sprint Planning, Sprint Backlog, Daily Scrum, Sprint, Increment, Sprint Review and Sprint Retrospective. Sprint Review inspects product result with stakeholders; Retrospective focuses on improving how the team works. Daily Scrum inspects progress and adapts the plan. Backlog refinement is ongoing work, not one of the five formal Scrum events in the Scrum Guide.</p><div class='callout'><b>Application / example:</b> Exam trap — the team participates in its own improvement; Sprint Review should not be restricted to the team alone.</div>"},{"h":"Product Backlog structure and detail","body":"<p>The slide shows a prioritised stack: high-priority items modelled in greater detail; new work items prioritised and added; items reprioritised or removed; lower-priority items may be less detailed. Another diagram connects features/use cases, epics, user stories and tasks. Treat this as an illustration, not an immutable standard structure.</p><div class='callout'><b>Application / example:</b> Teaching example — a broad seller-onboarding epic may be refined into user stories and tasks as the team learns more.</div>"},{"h":"Types of backlog items","body":"<p>The SS7 'Items' slide shows customer-side value and technical work: features create value; bugs are against value creation; knowledge acquisition is what the team needs to know to create value; technical tasks improve ability to generate value.</p><div class='callout'><b>Application / example:</b> Teaching example — investigating whether a payment API supports a required security method may be knowledge-acquisition work.</div>"},{"h":"MoSCoW","body":"<p>Must = vital; without it the initiative cannot be considered successful. Should = wanted but not vital. Could = nice to have. Won't = not now, maybe in future. Must should receive priority, with exceptions for dependencies and meaningful iteration sequencing.</p><div class='callout'><b>Application / example:</b> Exam trap — Must status does not make implementation order irrelevant and does not justify ignoring dependencies.</div>"},{"h":"Kano model","body":"<p>Kano relates execution quality (bad to good) to satisfaction/dissatisfaction. Basic attributes are expected; absence creates dissatisfaction while presence may not create delight. Performance attributes generally generate more satisfaction as execution improves. Excitement attributes are unexpected and can delight when present; absence need not dissatisfy. Indifferent attributes have little effect. SS7 includes an Exceptions slide.</p><div class='callout'><b>Application / example:</b> Slide example — beer at a pub is Basic. Faster service may be Performance. An unexpected complimentary experience may be Excitement.</div>"},{"h":"Roles and artifacts — course reading extension","body":"<p>The official syllabus prescribes Scrum Guide (2020) and identifies roles, events and artifacts as content. The uploaded slide text does not fully spell out all accountabilities and commitments. Supplementary reading: Product Owner maximises product value and manages Product Backlog; Scrum Master establishes Scrum and improves effectiveness; Developers create a usable Increment. Product Backlog, Sprint Backlog and Increment are the three artifacts; Product Goal, Sprint Goal and Definition of Done are their commitments. These are supplemental, not verbatim slide text.</p><div class='callout'><b>Application / example:</b> Use the required Scrum Guide reading to verify precise accountabilities and commitments.</div>"}],"masterclass":{"promise":"You should be able to explain the Scrum pillars and values, distinguish the events, read the Product Backlog diagrams, identify backlog item types, and apply MoSCoW and Kano to customer value.","map":"Product Backlog (refined and ordered) → Sprint Planning → Sprint Backlog → Sprint + Daily Scrum → Increment → Sprint Review → Sprint Retrospective → refine/adapt.","sections":[["1. Scrum sits inside Agile; it is not the whole of Agile","<p>SS7 introduces Scrum as an Agile framework. The course’s Agile values and principles describe a way of working; Scrum provides a structured framework with a backlog, Sprint, events and artifacts. Do not treat the framework as a replacement for the underlying intent of customer value, collaboration, learning and adaptation.</p>"],["2. Transparency, Inspection and Adaptation","<p><b>Transparency:</b> work and the emergent process must be visible to those doing and receiving the work. Low transparency can lead to decisions that reduce value and increase risk. <b>Inspection:</b> artifacts and progress toward goals are examined frequently and diligently. <b>Adaptation:</b> if a process deviates beyond acceptable limits or the product is unacceptable, the process or work is adjusted as soon as possible.</p><div class=\"formula\">Transparency → Inspection → Adaptation</div><p>Inspection without transparency is misleading; inspection without adaptation is pointless. The pillars are connected, not three isolated slogans.</p>"],["3. The five Scrum values in the slide visual","<p>SS7’s visual lists <b>Courage, Focus, Commitment, Respect and Openness</b>. Courage to do the right thing and work through tough problems; focus on Sprint work and team goals; personal commitment to those goals; respect for capable, independent people; openness about work and challenges. These values influence behaviour, not just terminology.</p>"],["4. Understand the Scrum flow and distinguish the events","<div class=\"table-wrap\"><table><thead><tr><th>Event / activity</th><th>What it is for</th><th>Question cue</th></tr></thead><tbody><tr><td>Sprint Planning</td><td>Plan the Sprint work and goal.</td><td>What should be done and how?</td></tr><tr><td>Daily Scrum</td><td>Inspect progress toward the Sprint Goal and adapt the plan.</td><td>How is progress and what should change today?</td></tr><tr><td>Sprint Review</td><td>Inspect the product outcome with stakeholders and consider future adaptation.</td><td>What did we create and what did stakeholders learn?</td></tr><tr><td>Sprint Retrospective</td><td>Inspect how the team worked and decide improvements.</td><td>How can we work better next Sprint?</td></tr><tr><td>Backlog refinement</td><td>Ongoing clarification, decomposition and ordering of backlog items.</td><td>Are items understood and ready to consider?</td></tr></tbody></table></div><p>The SS7 diagram shows backlog refinement and the Sprint flow. The five formal Scrum events in the prescribed Scrum Guide are Sprint, Sprint Planning, Daily Scrum, Sprint Review and Sprint Retrospective; refinement is ongoing work, not a separate formal event. The team participates in the Retrospective; the Sprint Review is not a team-only evaluation of the product outcome.</p>"],["5. Read the Product Backlog visuals carefully","<p>The SS7 backlog illustration shows a prioritised stack: high-priority work is modelled in greater detail; new work is prioritised and added; items can be reprioritised; lower-priority items may be removed or remain less detailed. Another visual shows a broad feature/use case becoming epics, user stories and tasks as detail is needed. Treat this as an illustration of progressive refinement, not a mandatory universal backlog structure.</p><p>The “Items” slide is especially important: customer-side features create value; bugs are against value creation; knowledge acquisition is what the team needs to know to create value; technical tasks improve the ability to generate value. A Product Backlog is not limited to customer-visible features.</p>"],["6. Prioritise with MoSCoW","<div class=\"table-wrap\"><table><thead><tr><th>Category</th><th>Lecture meaning</th><th>Practical question</th></tr></thead><tbody><tr><td><b>Must</b></td><td>Vital; without it the initiative cannot be considered successful.</td><td>Would the initiative fail without it?</td></tr><tr><td><b>Should</b></td><td>Wanted, but not vital.</td><td>Important, but can the initiative still succeed?</td></tr><tr><td><b>Could</b></td><td>Nice to have.</td><td>Useful if resources/time allow?</td></tr><tr><td><b>Won’t</b></td><td>Not now, maybe in future.</td><td>Explicitly not in the current delivery.</td></tr></tbody></table></div><p>Must items should not be deliberately postponed simply because they are mandatory. However, exact sequence can depend on prerequisites, technical dependencies and meaningful increments. “Must first” is a strong priority principle, not permission to violate dependencies.</p>"],["7. Prioritise with Kano: satisfaction is not the same as implementation priority","<p>Kano relates quality of execution (bad to good) to customer satisfaction/dissatisfaction. The common categories are:</p><ul><li><b>Basic / Must-be:</b> expected; absence creates dissatisfaction, presence may not create delight. SS7’s pub example treats beer as Basic.</li><li><b>Performance:</b> better execution generally increases satisfaction. Example: faster delivery or more accurate tracking.</li><li><b>Excitement:</b> unexpected feature that can delight; absence does not necessarily dissatisfy. Example: an unexpected complimentary service.</li><li><b>Indifferent:</b> attribute has little effect on satisfaction. The original mock includes this as an answer option; the lecture’s main graph emphasises the three curves.</li></ul><p>MoSCoW asks “how vital is this requirement to the initiative?” Kano asks “how does execution of this attribute influence satisfaction?” They are complementary, not interchangeable.</p>"],["8. Roles and artifacts — required reading extension","<p>The official syllabus lists Scrum roles, events and artifacts and prescribes the Scrum Guide (2020). The uploaded slide text is concise on detailed accountabilities. As a reading extension: Product Owner is accountable for maximising product value and effective Product Backlog management; Scrum Master establishes Scrum and improves team effectiveness; Developers create a usable Increment. Scrum artifacts include Product Backlog, Sprint Backlog and Increment, with Product Goal, Sprint Goal and Definition of Done as their commitments. Treat these details as supplementary to the slide visuals and verify them against the prescribed Scrum Guide.</p>"]],"worked":["<b>Worked prioritisation — pub launch.</b><ol><li>Beer is a Basic attribute: customers expect it; absence creates dissatisfaction.</li><li>Consistent service speed is Performance: better execution increases satisfaction.</li><li>A surprise live acoustic set may be Excitement: unexpected delight, not necessarily expected.</li><li>Use MoSCoW separately: legally required licensing or a vital payment capability may be Must; attractive but non-vital décor may be Could.</li><li>During Sprint Review, inspect the product outcome with stakeholders; during Retrospective, inspect how the team worked.</li></ol>","Examiner’s lens: distinguish Sprint Review from Retrospective, Basic from Performance/Excitement, and backlog work from only customer-facing features."],"source":"SS7 2026 pages 2–17; Scrum Guide 2020 is a required reading listed in the syllabus; detailed accountabilities/commitments are labelled supplementary."}},{"code":"S","title":"Simulation & integrated application","short":"Application sessions","intro":"Bring the framework together under trade-offs and complexity. SS5 and SS8 are application sessions, testing whether the learner can use concepts together rather than recite a tool definition.","refs":"SS5 and SS8","application":"Apply the concepts to identify what must go well, what work is required, which constraints apply and what decision best fits the project's conditions.","sections":[{"h":"LIBRA","body":"<p>The syllabus says LIBRA connects Stakeholder Management, Critical Success Factors and Project Performance. The course summary adds that projects contain trade-offs between stakeholder satisfaction and project performance. The supplied files do not include the full simulation mechanics, so this resource does not invent its specific decisions or scoring rules.</p><div class='callout'><b>Application / example:</b> Practice prompt — two stakeholder groups demand conflicting changes, but only one protects the project’s critical performance objective. Identify the CSF, classify stakeholders, clarify the trade-off and explain the engagement strategy.</div>"},{"h":"Easter Eggs","body":"<p>The syllabus says the Easter Eggs simulation demonstrates the difference between Predictive and adaptive project management. The course summary says traditional project management works in many settings, while Agile makes sense when the environment is unpredictable and potentially shippable products can be delivered during project life. The complete simulation files were not supplied.</p><div class='callout'><b>Application / example:</b> Practice prompt — requirements evolve after each customer test and a useful module can ship independently. Explain why an adaptive approach may make sense, and identify what project controls remain relevant.</div>"},{"h":"SS8 integrated project application","body":"<p>The course summary says that in complex environments emotions, energy and instinct are not enough; managers should leverage all resources. Use the complete sequence: clarify WHY and CSFs; identify stakeholders; define PSS and boundaries; decompose scope; schedule; analyse risks; choose a suitable approach; prioritise work; inspect, control and adapt.</p><div class='callout'><b>Application / example:</b> Application method — begin with the intended outcome, not a favourite tool. Ask what must go well, who can affect it, what work is required, what depends on what, what may go wrong and what approach fits the uncertainty.</div>"}],"masterclass":{"promise":"The simulations are integration exercises. This module uses only the learning outcomes stated in the syllabus and course summary; the complete simulation rules and scoring mechanics were not supplied.","map":"LIBRA: stakeholders + CSFs + project performance. Easter Eggs: predictive versus adaptive. SS8: apply the framework to a quick but complex project.","sections":[["1. LIBRA: trade-offs, not stakeholder appeasement","<p>The syllabus says LIBRA connects Stakeholder Management, Critical Success Factors and Project Performance. The course summary adds that projects contain trade-offs between stakeholder satisfaction and project performance. Therefore the managerial task is not “make every stakeholder happy at any cost”. Identify what matters to the project, understand which stakeholders can influence or be affected, and explain how a decision changes both stakeholder satisfaction and project performance.</p><p>The supplied files do not include full LIBRA simulation mechanics, so this module does not invent specific scoring rules, role cards or decisions.</p>"],["2. Easter Eggs: predictive versus adaptive","<p>The syllabus says the Easter Eggs simulation demonstrates the difference between predictive and adaptive project management. The course summary adds that traditional project management works well in many situations, while Agile makes sense when the environment is unpredictable and potentially shippable products can be delivered during the project. Customer collaboration and openness to feedback are central.</p><p>The supplied files do not include the complete simulation instructions. Use the debrief learning objective: what conditions make a fixed plan useful, and what conditions make frequent learning and adaptation more appropriate?</p>"],["3. SS8: manage complexity deliberately","<p>The course summary’s final message is that in complex environments, emotions, energy and instinct alone are not enough; a manager should leverage all available resources. That means returning to the framework: clarify the objective and CSFs, identify stakeholders, define scope, decompose the work, schedule, budget, analyse risks, choose an approach, prioritise work, then monitor/control and adapt.</p><p>The strongest exam answer usually does not choose a favourite tool in isolation. It connects the decision to the project purpose, affected people, work required, dependencies, uncertainty and expected result.</p>"]],"worked":["<b>Integrated 20-minute case — campus festival.</b><ol><li><b>CSF:</b> safe attendee experience and on-time opening.</li><li><b>Stakeholders:</b> students, performers, security, venue, neighbours, regulators, suppliers.</li><li><b>PSS:</b> event scope, main deliverables, success criteria, exclusions and constraints (venue, sound curfew, capacity).</li><li><b>WBS:</b> venue, stage, sound, ticketing, safety, performers, marketing, close-out.</li><li><b>Schedule:</b> stage build → sound check → opening; mark mandatory links.</li><li><b>Risk:</b> severe weather may make outdoor venue unsafe; identify, assess, prepare Plan A and Plan B.</li><li><b>Approach:</b> stable venue and safety work may be predictive; evolving programme/experience may be adapted if feedback can be used.</li><li><b>Control:</b> inspect readiness, communicate changes and adapt.</li></ol>","Examiner’s lens: a quick but complex case tests whether you use all resources and connect the tools, not whether you can recite definitions."],"source":"Official syllabus Session 5, Session 6 and Session 8; Course Summary SS5, SS6 and SS8."}}],"scenarios":[{"title":"Hospital diagnostic centre","areas":"A + B + C + D","context":"The hospital must open before a seasonal demand peak. Clinical validation and patient accessibility are critical. The PSS has construction and equipment but omits staff readiness. A supplier delay threatens a predecessor activity on the critical path.","steps":[{"h":"Question to ask 1","d":"What are the CSFs and which are merely measurable success criteria?"},{"h":"Question to ask 2","d":"Which deliverables and activities are missing from the PSS/WBS?"},{"h":"Question to ask 3","d":"Which dependency makes the supplier delay consequential?"},{"h":"Question to ask 4","d":"Describe the risk using condition → risk → consequence."},{"h":"Question to ask 5","d":"What is Plan A and what trigger activates Plan B?"}],"takeaway":"Translate clinical readiness into deliverables, staff capability and scope; revise the WBS; schedule predecessor relationships; assess probability and impact; assign a Risk Owner; plan prevention and a contingency triggered by a defined supplier delay."},{"title":"Market-entry launch","areas":"A + B + D + E","context":"A consumer brand enters a new country. Sales are targeted at ₹40 lakh in the first three months. Local law prohibits discounts. Customer preferences are evolving, while regulatory and import requirements are stable.","steps":[{"h":"Question to ask 1","d":"Which statement is a success criterion?"},{"h":"Question to ask 2","d":"Which statements are constraints?"},{"h":"Question to ask 3","d":"Who are the stakeholders?"},{"h":"Question to ask 4","d":"Would Predictive, Agile or Hybrid best fit the two kinds of work?"},{"h":"Question to ask 5","d":"How should the evolving customer proposition be kept within agreed boundaries?"}],"takeaway":"Treat the sales figure as a measurable success criterion, legal and budget limitations as constraints, identify customer/distributor/regulator stakeholders, manage stable compliance predictively and test customer-facing elements adaptively if modular feedback is possible."},{"title":"Digital booking platform","areas":"B + C + E + F","context":"The platform’s boundaries are known, but features evolve after user tests. Payment integration must finish before booking confirmation can be tested. The Product Backlog contains user-facing design features and technical investigation items.","steps":[{"h":"Question to ask 1","d":"How does the PSS differ from the Product Backlog?"},{"h":"Question to ask 2","d":"Which activities have a mandatory dependency?"},{"h":"Question to ask 3","d":"How should the backlog be ordered?"},{"h":"Question to ask 4","d":"What makes a Sprint increment meaningful?"}],"takeaway":"Keep the PSS as scope framing; use the WBS to understand deliverables and the dynamic backlog to order work; respect payment integration as a prerequisite; select a feasible Sprint that delivers a useful increment."},{"title":"Outdoor festival","areas":"A + C + D + F","context":"The festival’s CSF is safe attendee experience. Stage build precedes sound check, and sound check precedes opening. Severe weather is possible. The event team has an indoor backup venue and a stakeholder group concerned about noise.","steps":[{"h":"Question to ask 1","d":"Which dependencies are mandatory?"},{"h":"Question to ask 2","d":"How does noise regulation shape constraints and stakeholder engagement?"},{"h":"Question to ask 3","d":"What is Plan A and the contingency trigger?"},{"h":"Question to ask 4","d":"How does the CSF inform backlog or work priority?"}],"takeaway":"Identify attendees, residents, authorities, artists and suppliers; maintain required build/test/open sequence; analyse weather and noise risks; prepare preventive actions and activate the indoor venue if the weather trigger is reached."},{"title":"Mind the Gum — turning context into CSFs","areas":"A · Strategy & stakeholders","context":"The SS1 slide describes gum producers as large firms that may not accept small production batches. The case points toward securing a large contract before production. Use the actual slide facts; the analysis below is a guided interpretation, not a reconstruction of unseen simulation mechanics.","steps":[{"h":"Separate facts from success drivers","d":"Large producers may refuse small batches. That is a condition/input, not yet a CSF by itself."},{"h":"Analyse its impact","d":"If production cannot begin without an acceptable order size, demand/contract access becomes critical to viability."},{"h":"State the CSF","d":"Secure a large contract before production. The CSF expresses what must go well."},{"h":"Identify stakeholders","d":"Gum producers, distributors/agents, independent market participants, customers and the project team can affect or be affected."},{"h":"Translate into action","d":"The team must investigate the market and secure the contract; merely listing the CSF is not execution."}],"takeaway":"The case shows that CSFs are context-dependent and dynamic: a supplier’s commercial condition can change what is indispensable for success."},{"title":"Tesla Model 3 — product success versus project success","areas":"A · Strategy and CSFs","context":"The SS1 slides distinguish attractive product characteristics (range, price, performance and technology) from the project capability needed to scale production (sufficient battery production capacity). They also cite excessive automation and bottlenecks as execution difficulties.","steps":[{"h":"Name the product success factors","d":"Range, price, performance and technology influence product attractiveness."},{"h":"Name the project CSF","d":"Sufficient battery production capacity was indispensable to scaling production."},{"h":"Explain the distinction","d":"A product can be attractive but the project that must manufacture it at scale can still be constrained by capacity and process bottlenecks."},{"h":"Managerial implication","d":"Do not assume product desirability alone proves project execution is succeeding; review the CSFs when performance stalls."}],"takeaway":"Product success factors describe what makes the offering attractive; project CSFs identify the conditions that must be achieved to execute successfully."},{"title":"Personal Teller Machine — scope-to-risk workshop","areas":"B · Scope + C · Scheduling + D · Risk","context":"SS2 and SS4 use the PTM case in class exercises, but the complete case handout was not supplied. This workshop is therefore a generic PTM-style teaching exercise, not a claim about the original case facts.","steps":[{"h":"Draft the PSS","d":"State why the service is needed, what it does, main deliverables, measurable success criteria, exclusions and unusual constraints."},{"h":"Build the WBS","d":"Decompose the required service into customer interface, identity verification, transaction processing, hardware/software integration, testing, deployment and handover. Treat these as illustrative workstreams."},{"h":"Build predecessor logic","d":"For example, integration may need to finish before end-to-end transaction testing. Confirm which relationships are mandatory rather than assuming every preferred order is mandatory."},{"h":"Identify risks from the plan","d":"Use the scope, WBS, Gantt/Critical Path, contracts, brainstorming, assumption analysis and checklists."},{"h":"Write one full risk statement","d":"Due to an untested banking interface, there is a risk that transaction verification may fail, causing delayed acceptance testing."}],"takeaway":"The lecture’s risk exercise asks students to identify 5–10 risks and analyse probability, impact and response. This workshop models the reasoning without inventing the missing PTM handout."}],"tracker":[{"name":"A — Strategy & stakeholders","items":["Project versus process","Project complexity and temporary effort","Strategic versus operational planning","Project Charter and Project Management Plan","CSF definition and dynamic use","Product Success Factors versus Project CSFs","IPO approach","Typical CSFs (mission, support, people, technical tasks, acceptance, feedback, communication, troubleshooting)","Stakeholder definition and identification (including future users)","Stakeholder involvement and consultation","Power–Interest Matrix: four quadrants","Stakeholder attitude, relationships and management strategy"]},{"name":"B — Scope & WBS","items":["PSS definition and three characteristics","Justification: problems, opportunities, obligations","Project description and Statement of Work","Main deliverables","Success criteria and KPIs","Output versus outcome","Boundaries and exclusions","Constraints","WBS definition and deliverable orientation","WBS versus Gantt","Work package: estimatable","Work package: measurable","Work package: manageable / potential owner","Work package: clear input/output","Top Down, Bottom Up, Analogy and Template","Five Bottom-Up steps"]},{"name":"C — Scheduling","items":["Six scheduling inputs","FS dependency","SS dependency","FF dependency","SF dependency","Mandatory versus discretionary relationships","Leads and lags","Gantt and network diagrams","Critical Path Method","Critical activities and project duration","Optimisation through discretionary dependencies","PERT expected duration","PERT standard deviation","Critical Chain Project Management (named in slides; mechanics not detailed)"]},{"name":"D — Risk","items":["Risk definition: positive and negative effects","Five-stage risk process","Risk identification inputs and techniques","Condition → risk → consequence description","Probability and impact","Risk Score = Probability × Impact","Asymmetric risk matrix and impact emphasis","Avoid","Mitigate","Transfer / Share","Accept","Plan A versus Plan B","Risk Owner","Risk Resource","Risk Originator","Risk monitoring and control"]},{"name":"E — Agile & methodology choice","items":["Agile definition and adaptive planning","Agile versus Predictive conditions","Hybrid methodology selection","CSFs and stakeholder management across approaches","Scope boundaries under Agile/Hybrid","Dynamic WBS / backlog relationship","Scheduling and dependencies in Agile","Risk management across approaches","I-shaped versus T-shaped organisations","Four Agile Manifesto values","12 Agile principles"]},{"name":"F — Scrum & prioritisation","items":["Scrum transparency","Scrum inspection","Scrum adaptation","Five Scrum values","Sprint Planning","Daily Scrum","Sprint Review","Sprint Retrospective","Sprint and Increment","Backlog refinement","Product Backlog and Sprint Backlog","Backlog levels of detail / Epics / User Stories / Tasks","Four types of backlog items","MoSCoW","Kano: Basic","Kano: Performance","Kano: Excitement","Kano: Indifferent and exceptions","Scrum accountabilities and artifact commitments (supplement from required Scrum Guide reading)"]},{"name":"Application sessions","items":["LIBRA: stakeholder satisfaction, CSFs and project performance","Easter Eggs: Predictive versus adaptive management","SS8: managing a quick but complex project","Integrated strategic-to-operational planning"]}],"sources":[["SS1 2026","Project Management — SS1","Slides 1–38","Projects/processes; framework; CSFs; IPO; HCL/Tesla/Mind the Gum; stakeholders; Mendelow."],["SS2 2026","Project Management — SS2","Slides 1–25","PSS; justification; deliverables; success criteria; boundaries; constraints; WBS; work packages; WBS methods."],["SS3 2024","Project Management — SS3","Slides 1–13","Scheduling inputs; dependencies; leads/lags; CPM; PERT; Critical Chain named."],["SS4 2024","Project Management — SS4","Slides 1–20","Risk definition/process; identification; description; scoring; matrix; responses; Plan A/B; risk roles."],["SS6 2026","Project Management — SS6","Slides 1–11","I/T organisations; Agile definition; Agile/Predictive comparison; Hybrid mapping; Manifesto values and principles."],["SS7 2026","Project Management — SS7","Slides 1–17","Agile Manifesto; Scrum pillars/values/events flow; backlog; MoSCoW; Kano."],["Course Summary 2026","SS8 — Course Summary","Slides 1–10","Consolidated summary of SS1–SS7, LIBRA, Easter Eggs and SS8."],["Official syllabus Oct 2026","Project Management IMB Syllabus","Pages 1–5","Learning objectives; evaluation; session coverage; required readings including Scrum Guide 2020."],["Mock Exam 2026","Mock Exam IMB 2026","Questions 1–10","Professor’s original scenario, option and wording style reference."]],"glossary":[{"title":"Core project and strategy terminology","rows":[["Project","A temporary/non-repetitive, goal-oriented effort using a pool of resources; SS1 also emphasises sufficient complexity."],["Process","Repetitive effort characterised by stability and a focus on efficiency."],["CSF","Critical Success Factor: limited number of areas in which satisfactory results greatly increase the probability of project success."],["Product Success Factor","A factor that makes the product attractive or successful; distinct from the project capability required to deliver it."],["IPO","Input → Process → Output; a way to derive CSFs from project characteristics, environment and strategic directions."],["Stakeholder","Individual, group or organisation who may affect, be affected by, or perceive itself affected by a project decision, activity or outcome."],["Power / Interest","Power is ability to influence project performance; Interest is how much the stakeholder feels affected."],["Mendelow Matrix","Power–Interest stakeholder classification: manage closely, keep satisfied, keep informed, monitor."]]},{"title":"Scope and work decomposition","rows":[["PSS","Project Scope Statement: common understanding of scope and major objectives."],["Deliverable","Unique and verifiable product, result or capability to perform a service required by the project."],["Success Criteria","Measurable conditions used to judge whether the result is acceptable; not the same as CSFs."],["KPI","Key Performance Indicator, used to measure performance against a target or criterion."],["Boundary / Exclusion","Defines what is included and excluded from the project scope."],["Constraint","A limiting factor affecting project execution which, if respected, supports compliance."],["WBS","Work Breakdown Structure: hierarchical decomposition of total scope into manageable work elements; no time sequence."],["Work Package","Smallest WBS unit, to be estimatable, measurable, manageable and have clear input/output relationships."],["SOW","Statement of Work; detailed description may be located in an annex or supporting document."]]},{"title":"Scheduling terminology","rows":[["Predecessor / Successor","Activities that must occur before / after another activity under a dependency relationship."],["FS","Finish-to-Start: successor can start only after predecessor finishes."],["SS","Start-to-Start: successor can start only after predecessor starts."],["FF","Finish-to-Finish: successor can finish only after predecessor finishes."],["SF","Start-to-Finish: successor can finish only after predecessor starts."],["Mandatory dependency","Determined by the nature of the work."],["Discretionary dependency","Preferred sequence based on experience; potential starting point for schedule optimisation."],["Lead / Lag","Modifiers to predecessor relationships; a lead allows overlap and a lag introduces waiting time (teaching clarification)."],["CPM","Critical Path Method; identifies activities whose delay delays the whole project."],["PERT","Programme Evaluation and Review Technique; uses optimistic, most likely and pessimistic durations."]]},{"title":"Risk terminology","rows":[["Risk","Uncertain event or condition that may positively or negatively affect project objectives."],["Risk Score","Probability × Impact; SS4 cautions that impact deserves greater emphasis for a single project."],["Risk Matrix","Probability–Impact assessment; the lecture says it is not symmetric."],["Risk Owner","Person in charge of the risk."],["Risk Resource","Expert helping to assess, analyse and manage the risk."],["Risk Originator","Person who identified the risk."],["Plan A","Response actions/strategies implemented before the risk happens."],["Plan B","Contingency plan activated when the risk happens or is near."],["Avoid / Mitigate / Transfer / Accept","Change plan to remove source / reduce probability or impact / allocate consequences to another party / retain exposure and fund consequences."]]},{"title":"Agile and Scrum terminology","rows":[["Predictive","Approach suited in SS6 to stable, predictable, clear requirements, limited client access and high cost of change."],["Agile","Collaborative, adaptive approach using self-organising, cross-functional teams, early delivery and continual improvement."],["Hybrid","Combination of predictive and adaptive methods selected to fit different project components/conditions."],["Product Backlog","Prioritised and evolving list of product work; course says its structure is not standardised."],["MoSCoW","Must (vital), Should (wanted/not vital), Could (nice to have), Won’t (not now/maybe later)."],["Kano","Model relating execution of product attributes to customer satisfaction: Basic, Performance, Excitement and Indifferent. Indifferent is included here as explanatory framework terminology."],["Sprint Review","Scrum event to inspect the product outcome with stakeholders."],["Sprint Retrospective","Scrum event to inspect and improve the team's way of working."],["Transparency / Inspection / Adaptation","Three Scrum pillars presented in SS7."],["Scrum Values","Courage, Focus, Commitment, Respect and Openness (SS7 visual)."]]}],"coverage":[["One-area combinations","6","72 topic questions across the six core knowledge areas"],["Two-area combinations","15","15 integration questions — every pair represented once"],["Three-area combinations","20","20 integration questions — every triple represented once"],["Four-area combinations","15","15 integration questions — every four-area combination represented once"],["Five-area combinations","6","Not built as a separate integration set"],["Six-area combination","1","Not built as a separate integration set"]],"original":[{"n":1,"topic":"CSF → resources and budget","stem":"A medical equipment project identifies access to specialist clinical knowledge as essential. The budget contains no provision for clinicians and the team has no such expertise. What is the most appropriate action?","answer":3,"options":["Replace the CSF with a target for completing project documentation.","Postpone access to clinicians until the equipment has been delivered.","Retain the CSF as a reminder and rely on the existing team to improvise.","Secure the expertise and reflect the requirement in resource and budget planning."],"why":"An essential CSF must be translated into actual capability, resources and budget. A statement alone cannot provide the clinical expertise required for success.","feedback":["This replaces the strategic requirement instead of addressing the capability gap.","The expertise is required to deliver/validate the equipment; postponing it until after delivery defeats the purpose.","Keeping the CSF as a reminder does not close the expertise or resource gap.","Correct. Secure the required expertise and include it in operational resource and budget planning."]},{"n":2,"topic":"Stakeholder identification","stem":"A team developing an app for healthy-food recipes proposes including final users in stakeholder analysis, although the app does not yet exist. Was the team member right?","answer":3,"options":["No, final users are not directly involved in the project.","No, final users are exposed to the project only when it is finished.","No, because final users do not exist until the app exists.","Yes."],"why":"The stakeholder definition includes anyone who may affect, be affected by or perceive themselves affected by a project decision, activity or outcome. Potential users can be stakeholders before launch.","feedback":["Direct participation in project work is not required to qualify as a stakeholder.","People can influence and be affected by a project before completion.","A product need not exist for its intended users to exist.","Correct. Potential end users should be considered in stakeholder identification."]},{"n":3,"topic":"WBS before realistic Gantt scheduling","stem":"A team developing a new bank service is creating the WBS and Gantt chart in parallel. Do you agree with this practice?","answer":2,"options":["Yes, because the Gantt chart also includes the WBS.","Yes, because it takes less time.","No, because the final result will be less realistic.","No, because WBS and Gantt chart have no relationship."],"why":"The WBS is the scope breakdown and starting point for other methods such as Gantt scheduling. If the work breakdown is incomplete, activities, durations, resources and dependencies may be omitted, making the schedule less realistic.","feedback":["The Gantt is a time-oriented schedule; it does not replace the WBS's scope-decomposition role.","Saving time is not a sound reason to schedule work before the scope breakdown is sufficiently understood.","Correct. Incomplete work decomposition can produce unrealistic schedules and estimates.","They are related. The WBS supports development of the schedule."]},{"n":4,"topic":"Success criteria versus constraints","stem":"A team entering a new geographical market lists: sales of ₹40,00,000 in the first three months; the budget must be respected; local law does not allow discounts. What is your comment?","answer":1,"options":["Some CSFs are still missing.","They are a mix of success criteria and constraints.","They are a mix of CSFs and constraints.","They are fine."],"why":"The ₹40 lakh sales target is a measurable success criterion. “The budget must be respected” and “local law does not allow discounts” are constraints in the question’s framing. Therefore the list mixes success criteria and constraints; it is not a clean list of CSFs.","feedback":["The issue is not simply that more CSFs might be missing; the listed statements are misclassified.","Correct. Sales is a measurable success criterion; budget and legal restrictions are constraints.","The sales target is not itself a CSF merely because it matters; it is a measurable result. The other two items are constraints.","They are not all CSFs. The question deliberately combines different PSS concepts."]},{"n":5,"topic":"Multiple activity dependencies","stem":"Task C has an FS dependency with task A and an SS dependency with task B. When can task C start?","answer":3,"options":["When task A is finished.","When task B is finished.","When task A has started.","When task A has finished and task B has started."],"why":"Both predecessor conditions must be satisfied. FS with A means A must finish; SS with B means B must start. C can start only after both conditions hold.","feedback":["This ignores the SS condition involving B.","SS requires B to start, not finish, and this option ignores A's FS condition.","This satisfies neither the FS requirement that A finish nor the full combined logic.","Correct. Both dependencies must be satisfied simultaneously."]},{"n":6,"topic":"Plan A versus Plan B","stem":"In risk management, what is the contingency plan (Plan B)?","answer":1,"options":["The plan implemented before the risk happens.","The plan implemented once the risk has happened or it is obvious it is going to happen.","The plan that covers only the monetary impact of the risk.","The plan activated only when the project is close to failure."],"why":"SS4 distinguishes Plan A (response actions/strategies implemented before the risk happens) from Plan B (contingency plan activated when the risk happens or is near).","feedback":["This describes Plan A, the preventive response actions.","Correct. This is the lecture's definition of Plan B.","A contingency plan is not limited to a monetary reserve; it is an alternative response/action plan.","The lecture says when the risk happens or is near, not only when the whole project is close to failure."]},{"n":7,"topic":"Sprint Review versus team-only evaluation","stem":"A Scrum team decides that the results of its Sprints/iterations will be evaluated by the very same team. Do you agree?","answer":2,"options":["Yes, because the team knows the project very well.","Yes, especially if team members already worked on website development projects.","No.","No, because the team should not be involved in the discussion of its work."],"why":"The intended distinction is between Sprint Review, which inspects the product outcome with stakeholders, and Sprint Retrospective, which focuses on the team's way of working. Developers participate; the error is making outcome evaluation team-only.","feedback":["Team knowledge does not replace stakeholder inspection and feedback during the Sprint Review.","Experience does not remove the need to involve relevant stakeholders in reviewing the product outcome.","Correct. The Sprint outcome should be inspected with stakeholders, not solely by the team.","This reason is wrong: the team absolutely participates. The issue is excluding stakeholders from the Review."]},{"n":8,"topic":"MoSCoW and Must prioritisation","stem":"A team decides that all Must backlog items will be implemented last because they are mandatory and timing does not matter. Do you agree?","answer":1,"options":["Yes.","No, Must items should be prioritised first, although exceptions apply.","No, because different categories should always be mixed, especially near the end.","No, because Should items should be done last."],"why":"Must items are vital; without them the initiative cannot be considered successful. They should receive priority, while dependencies and meaningful iteration sequencing may affect exact execution order.","feedback":["This can leave essential functionality until too late and conflicts with the meaning of Must.","Correct. Must items are vital, with sensible exceptions for prerequisites and sequencing.","The lecture does not prescribe this as a universal rule; the key is value-based prioritisation.","Should items are wanted but not vital; the option does not establish a valid universal ordering rule."]},{"n":9,"topic":"Kano Basic attribute","stem":"A project is about developing a new pub. According to the Kano model, beer is which category?","answer":0,"options":["Basic.","Excitement.","Indifferent.","Performance."],"why":"Beer is treated as an expected baseline offering in a pub. Its absence causes dissatisfaction, while its presence is not necessarily an unexpected delight.","feedback":["Correct. Beer is a Basic/Must-be attribute in this scenario.","Excitement attributes are unexpected features that delight customers.","Beer is not an indifferent feature in the stated pub context.","Performance attributes create more satisfaction as execution improves; the example treats beer as a baseline expectation."]},{"n":10,"topic":"Project versus process","stem":"What distinguishes a process from a project?","answer":3,"options":["The usage of human resources.","The presence of constraints.","The presence of material resources.","None of the other answers is correct."],"why":"Both processes and projects can use human and material resources and operate under constraints. The course distinguishes them through repetitive/stable/efficiency-oriented processes versus one-time/innovative/effectiveness-oriented projects.","feedback":["Both processes and projects use human resources.","Both can be subject to constraints.","Both can use material resources.","Correct. None of the listed resource/constraint characteristics uniquely distinguishes the two. The key distinction is repetition, stability, innovation and purpose."]}],"resource_version":"2.0","bank_intro":"72 questions: 36 core recognition questions plus 36 applied questions. Question types include classification, diagnosis, sequence, calculation, dependency logic, method selection and managerial decision.","integration":[{"id":"INT-AB","area":"AB","topic":"CSF to scope deliverables","kind":"Scope diagnosis","level":"2-area integration","stem":"A project identifies rapid customer onboarding as a Critical Success Factor. The PSS lists software development and launch but no onboarding deliverable. What is the best comment?","options":["The scope is complete because the software is the final product.","Onboarding should be added only to the risk register.","The CSF should be removed because it is difficult to deliver.","The PSS should include the deliverables needed for onboarding, and the scope breakdown should represent the work."],"answer":3,"feedback":["A software launch does not automatically create customer onboarding.","Risk analysis may be needed, but it does not replace scope definition.","Difficulty does not make a CSF optional; it signals a planning problem.","Correct. A strategic success driver must be reflected in the scope and required deliverables."],"why":"Correct. A strategic success driver must be reflected in the scope and required deliverables.","correct_position":"D"},{"id":"INT-AC","area":"AC","topic":"CSF and critical path","kind":"Schedule diagnosis","level":"2-area integration","stem":"A project must open a new facility before the monsoon. This is a CSF. Certification lies on the Critical Path and may be delayed by an external inspection. What should the manager prioritise?","options":["Remove certification from the schedule.","Change the CSF to a less demanding deadline.","Assess the impact of the inspection delay on the critical path and plan responses to protect the strategic deadline.","Complete unrelated non-critical tasks first because they are easier."],"answer":2,"feedback":["Removing a required certification does not solve the underlying dependency or compliance need.","Changing the target avoids the problem rather than assessing the project’s success requirement.","Correct. The strategic deadline and critical-path consequence make the inspection delay important to analyse and manage.","Finishing non-critical work does not necessarily shorten the project duration."],"why":"Correct. The strategic deadline and critical-path consequence make the inspection delay important to analyse and manage.","correct_position":"C"},{"id":"INT-AD","area":"AD","topic":"CSF and risk","kind":"Risk analysis","level":"2-area integration","stem":"A medical project identifies specialist clinical expertise as essential to success. The required clinicians are not yet secured. Which action best connects the CSF with risk management?","options":["Treat the expertise gap only as a stakeholder communication issue.","Secure the expertise in resource planning and assess availability as a risk, including preventive and contingency responses.","Retain the CSF as a note and wait to see whether the team can improvise.","Replace the CSF with a documentation target."],"answer":1,"feedback":["Communication may matter, but it does not resolve the resource and delivery risk.","Correct. Secure the needed resource and address the uncertainty around availability.","A note does not provide the capability needed to meet the CSF.","This changes the success driver instead of solving the capability gap."],"why":"Correct. Secure the needed resource and address the uncertainty around availability.","correct_position":"B"},{"id":"INT-AE","area":"AE","topic":"CSF and methodology selection","kind":"Method selection","level":"2-area integration","stem":"A new service has unclear requirements, accessible customers and useful modules that can be released incrementally. Its CSF is customer adoption. Which management choice is best?","options":["Use no formal approach until requirements stabilise.","Use Predictive because a CSF must be fixed.","Use Agile while retaining the CSF and stakeholder management, adapting scope and delivery through feedback.","Use Agile and remove strategic planning."],"answer":2,"feedback":["The course teaches choosing and adapting methods, not avoiding project management.","A CSF does not force a predictive approach.","Correct. The project conditions favour Agile, while strategic planning remains relevant.","Agile does not eliminate strategic direction."],"why":"Correct. The project conditions favour Agile, while strategic planning remains relevant.","correct_position":"C"},{"id":"INT-AF","area":"AF","topic":"Stakeholders and backlog","kind":"Stakeholder and value judgement","level":"2-area integration","stem":"A powerful sponsor requests an elaborate dashboard. Users say reliable account recovery is essential. How should the Product Owner approach backlog priority?","options":["Engage the sponsor appropriately, but prioritise essential customer value and the project’s success requirements.","Automatically prioritise the sponsor request because power determines customer value.","Ignore the sponsor completely.","Give both requests Must status without analysis."],"answer":0,"feedback":["Correct. Stakeholder strategy and backlog prioritisation answer different questions and must be used together.","Power influences stakeholder management; it does not automatically establish product value.","A powerful stakeholder still needs appropriate engagement.","Must is reserved for vital requirements; it should not be assigned indiscriminately."],"why":"Correct. Stakeholder strategy and backlog prioritisation answer different questions and must be used together.","correct_position":"A"},{"id":"INT-BC","area":"BC","topic":"WBS and Gantt","kind":"Planning sequence","level":"2-area integration","stem":"A team builds a Gantt chart while the WBS is incomplete. Several deliverables are later discovered. Why is the schedule at risk?","options":["The Gantt chart cannot contain dependencies.","The WBS already contains the project calendar.","Missing scope elements may mean missing activities, estimates, resources and dependencies in the schedule.","WBS and Gantt charts are unrelated."],"answer":2,"feedback":["Dependencies are a core scheduling input.","The WBS has no time sequence.","Correct. An incomplete scope breakdown can produce an unrealistic schedule.","The WBS is a starting point for scheduling; the methods are related but distinct."],"why":"Correct. An incomplete scope breakdown can produce an unrealistic schedule.","correct_position":"C"},{"id":"INT-BD","area":"BD","topic":"WBS and risk identification","kind":"Risk discovery","level":"2-area integration","stem":"A WBS contains a specialist installation work package with unclear inputs and external supplier interfaces. How should this information be used?","options":["Wait until the Gantt chart is complete before identifying any risks.","Remove the work package because uncertainty is not allowed.","Use the WBS and project plan as inputs to identify and analyse possible risks.","Classify every unclear activity as a constraint."],"answer":2,"feedback":["The plan is already an input to risk identification; waiting is unnecessary.","Uncertainty should be analysed and managed, not automatically removed from scope.","Correct. SS4 explicitly lists the scope, WBS and Gantt/Critical Path among risk-identification inputs.","A constraint is a limiting factor, not a label for every uncertainty."],"why":"Correct. SS4 explicitly lists the scope, WBS and Gantt/Critical Path among risk-identification inputs.","correct_position":"C"},{"id":"INT-BE","area":"BE","topic":"Scope and Agile","kind":"Scope interpretation","level":"2-area integration","stem":"A start-up has fixed project objectives and explicit exclusions, but user-facing requirements will evolve through prototype testing. Which statement best reflects the course?","options":["The PSS and boundaries remain useful, while the scope can be refined more flexibly through a dynamic backlog.","Flexible scope means any request is automatically included.","Every detail must be fixed before the first iteration.","Agile requires the project to abandon its PSS."],"answer":0,"feedback":["Correct. Adaptability does not mean absence of scope management.","Scope boundaries still constrain the work.","This is more consistent with a rigid predictive approach.","SS6 maps scope statements to Agile as well, with more flexible boundaries."],"why":"Correct. Adaptability does not mean absence of scope management.","correct_position":"A"},{"id":"INT-BF","area":"BF","topic":"WBS and Product Backlog","kind":"Backlog transformation","level":"2-area integration","stem":"A project has a deliverable-oriented WBS. After adopting Scrum, the team copies its hierarchy and original order unchanged into the Product Backlog. What is the main weakness?","options":["A WBS is prohibited in every Agile project.","The Product Backlog should be dynamic and prioritised by value; it is not simply a fixed chronological WBS.","The Product Backlog must contain only technical tasks.","The team should remove deliverables from planning."],"answer":1,"feedback":["The course says Agile uses a similar but more dynamic WBS-like approach.","Correct. The backlog is continually prioritised and refined; sequence and value are not identical to a WBS hierarchy.","SS7 includes features, bugs, knowledge acquisition and technical tasks.","Deliverables and scope remain relevant."],"why":"Correct. The backlog is continually prioritised and refined; sequence and value are not identical to a WBS hierarchy.","correct_position":"B"},{"id":"INT-CD","area":"CD","topic":"Critical path and risk","kind":"Impact assessment","level":"2-area integration","stem":"A supplier delay threatens an activity on the Critical Path. The probability is low, but the delay could move the entire launch date. What is the best risk assessment?","options":["Consider the potential project-wide impact and use the risk matrix and response planning.","Treat it as harmless until the milestone is actually missed.","Ignore the event because probability is low.","Rank it only by expected monetary value."],"answer":0,"feedback":["Correct. The critical path helps reveal the consequence; SS4 emphasises impact in a single project.","Risk management is proactive, not limited to recording realised problems.","Low probability does not erase a severe consequence.","SS4 warns that equal expected values need not imply equal priority on a single project."],"why":"Correct. The critical path helps reveal the consequence; SS4 emphasises impact in a single project.","correct_position":"A"},{"id":"INT-CE","area":"CE","topic":"Dependencies and Agile","kind":"Method misconception","level":"2-area integration","stem":"A manager claims that activity dependencies no longer matter once a project adopts Agile. Is this correct?","options":["No; Agile requires a fully fixed Gantt for the entire project.","Yes; the Product Backlog replaces every predecessor relationship.","No; dependencies still apply, although detailed scheduling may occur within an iteration.","Yes; iterations are independent by definition."],"answer":2,"feedback":["This overstates the fixed-planning requirement and conflicts with adaptive scheduling.","Backlog prioritisation and activity dependency are different concepts.","Correct. SS6 says dependencies apply in Agile; scheduling may sometimes be within an iteration.","Iterations do not remove logical prerequisites."],"why":"Correct. SS6 says dependencies apply in Agile; scheduling may sometimes be within an iteration.","correct_position":"C"},{"id":"INT-CF","area":"CF","topic":"Dependencies and Scrum","kind":"Sprint planning","level":"2-area integration","stem":"A backlog item for transaction testing has a mandatory FS dependency on payment integration. Integration has not finished. What should Developers do in Sprint Planning?","options":["Select testing first because backlog priority overrides dependencies.","Plan a feasible sequence that respects the dependency and supports the Sprint Goal.","Assume testing can begin because it is in the Sprint Backlog.","Remove integration from the scope."],"answer":1,"feedback":["Priority does not make a dependent activity executable before its predecessor.","Correct. Agile planning remains constrained by the logical sequence of work.","Selection into a Sprint does not remove a predecessor condition.","This avoids rather than resolves the delivery requirement."],"why":"Correct. Agile planning remains constrained by the logical sequence of work.","correct_position":"B"},{"id":"INT-DE","area":"DE","topic":"Risk and methodology selection","kind":"Method selection","level":"2-area integration","stem":"A project has stable requirements, low client access and high change costs. It also faces a risk of regulatory approval delay. What is the most appropriate management approach?","options":["Remove risk management because the project is Predictive.","Predictive planning may fit the stable requirements, while the approval-delay risk is still identified, analysed and monitored.","Ignore the regulator because it is external.","Pure Agile because any risk requires adaptive management."],"answer":1,"feedback":["SS6 maps risk management to Predictive, Agile and Hybrid.","Correct. Method selection and risk management are separate decisions; the two can coexist.","External stakeholders can strongly affect project success.","A risk does not automatically make all requirements uncertain or favour Pure Agile."],"why":"Correct. Method selection and risk management are separate decisions; the two can coexist.","correct_position":"B"},{"id":"INT-DF","area":"DF","topic":"Risk and Scrum","kind":"Risk response and inspection","level":"2-area integration","stem":"During a Sprint Review, stakeholders identify a possible compliance risk in the increment. What should the team do?","options":["Transfer responsibility to stakeholders without assigning a risk owner.","Treat the Review as a demonstration only and ignore the concern.","Make the concern visible, analyse it, and adapt the relevant response and backlog priorities.","Automatically activate a contingency plan without assessing the risk."],"answer":2,"feedback":["The risk owner remains an explicit risk-management role.","Sprint Review includes inspection and discussion of the product outcome; it is not merely a presentation.","Correct. Scrum inspection/adaptation supports the SS4 risk process; it does not replace it.","A possible risk should be analysed; Plan B activates when its trigger conditions apply."],"why":"Correct. Scrum inspection/adaptation supports the SS4 risk process; it does not replace it.","correct_position":"C"},{"id":"INT-EF","area":"EF","topic":"Agile values and Scrum","kind":"Misconception diagnosis","level":"2-area integration","stem":"A team says the Agile Manifesto means documentation and planning have no value, so it cancels Sprint Planning. What is the best comment?","options":["Incorrect; Agile requires a fixed Gantt chart.","Incorrect; the Manifesto values the left-hand items more, but items on the right still have value and Scrum retains events.","Correct; Scrum has no formal events.","Correct; Agile rejects all planning."],"answer":1,"feedback":["A complete fixed Gantt is not required by Agile.","Correct. Scrum has planning and inspection events; Agile is a preference for values, not a ban on tools or plans.","Scrum includes formal events and artifacts.","This misreads the Manifesto’s explicit qualification."],"why":"Correct. Scrum has planning and inspection events; Agile is a preference for values, not a ban on tools or plans.","correct_position":"B"},{"id":"INT-ABC","area":"ABC","topic":"Strategy, scope and schedule","kind":"Scope-to-schedule diagnosis","level":"3-area integration","stem":"A project’s CSF is operational readiness. Its PSS lists construction but omits staff training. The WBS and Gantt are already prepared. What should the manager do?","options":["Replace operational readiness with a construction milestone.","Keep the plan because training is always an operational process.","Add training only to the risk register.","Revise scope and WBS to include readiness work, then update schedule estimates and dependencies."],"answer":3,"feedback":["This changes the objective rather than aligning the plan to it.","Training may be essential project work when it is required for the project outcome.","A risk register does not define required deliverables.","Correct. Scope completeness precedes a realistic schedule."],"why":"Correct. Scope completeness precedes a realistic schedule.","correct_position":"D"},{"id":"INT-ABD","area":"ABD","topic":"Strategy, scope and risk","kind":"CSF-resource-risk integration","level":"3-area integration","stem":"A medical device project includes clinical validation as a deliverable. The team lacks clinicians and no budget is allocated. What is the best action?","options":["Retain the deliverable, secure specialist capacity and assess the availability risk with preventive and contingency responses.","Wait until delivery to obtain clinical input.","Replace the CSF with a documentation target.","Remove clinical validation because there is no current expertise."],"answer":0,"feedback":["Correct. The CSF must be supported by scope, resources and risk actions.","Late expertise may be too late to affect design or validation.","A documentation target does not address clinical capability.","A capability gap is a problem to address, not a reason to silently remove an essential deliverable."],"why":"Correct. The CSF must be supported by scope, resources and risk actions.","correct_position":"A"},{"id":"INT-ABE","area":"ABE","topic":"Strategy, scope and Agile","kind":"Method and scope choice","level":"3-area integration","stem":"A product’s infrastructure requirements are stable, but customer-facing functions are uncertain and users are available for testing. Which approach best fits?","options":["Hybrid: maintain strategic objectives and clear boundaries while adapting uncertain features.","Pure Agile with no project boundaries.","No scope statement until users stop changing their minds.","Pure Predictive for every component."],"answer":0,"feedback":["Correct. Different components can be handled with different planning styles.","Agile does not remove boundaries or strategy.","Scope still needs a framework even when detail evolves.","Stable components may suit Predictive, but the scenario includes evolving features."],"why":"Correct. Different components can be handled with different planning styles.","correct_position":"A"},{"id":"INT-ABF","area":"ABF","topic":"Strategy, scope and backlog","kind":"Customer-value prioritisation","level":"3-area integration","stem":"A university’s CSF is access to essential academic services. The PSS includes exam registration and a social feature. Students say exam registration is vital; management prefers the social feature. What is the best backlog decision?","options":["Prioritise the social feature because management has more power.","Remove exam registration because it is an administrative function.","Treat both as Must without further analysis.","Prioritise the essential registration function in line with the CSF and customer value; manage management expectations as a stakeholder."],"answer":3,"feedback":["Power guides stakeholder management; it does not automatically create customer value.","The scope includes registration as an intended deliverable.","MoSCoW is meaningful only if priorities distinguish vital from non-vital items.","Correct. CSF, scope, stakeholder management and backlog priority are aligned."],"why":"Correct. CSF, scope, stakeholder management and backlog priority are aligned.","correct_position":"D"},{"id":"INT-ACD","area":"ACD","topic":"Strategy, scheduling and risk","kind":"Critical-path risk","level":"3-area integration","stem":"A facility must be certified before a seasonal deadline. Certification is a CSF-related milestone and is on the Critical Path. A low-probability inspection delay may occur. What is the best response?","options":["Complete non-critical work first.","Assess its impact on the overall deadline, prepare appropriate risk responses and monitor the inspection dependency.","Remove certification from the schedule.","Ignore it because it is unlikely."],"answer":1,"feedback":["Non-critical progress may not shorten the project.","Correct. The strategic objective and critical-path impact make the event important to analyse.","Required certification cannot be removed simply to improve a plan.","Probability alone is not enough to assess risk."],"why":"Correct. The strategic objective and critical-path impact make the event important to analyse.","correct_position":"B"},{"id":"INT-ACE","area":"ACE","topic":"Strategy, scheduling and Agile","kind":"Adaptive delivery with dependencies","level":"3-area integration","stem":"A new digital service has unclear requirements and can release useful modules. Some activities have mandatory dependencies. Which approach is justified?","options":["No schedule because requirements are unclear.","Agile with all dependencies removed.","Agile with iterative planning, early delivery and dependencies retained.","Predictive only because dependencies exist."],"answer":2,"feedback":["Adaptive scheduling is still scheduling.","Agile does not make technical prerequisites disappear.","Correct. The conditions favour Agile, but logical dependencies remain.","Dependencies exist in all approaches."],"why":"Correct. The conditions favour Agile, but logical dependencies remain.","correct_position":"C"},{"id":"INT-ACF","area":"ACF","topic":"Strategy, schedule and Scrum","kind":"Priorities versus prerequisites","level":"3-area integration","stem":"A payment feature is vital to a reliable booking service. Testing has an FS dependency on payment integration, which has not started. Which plan is appropriate?","options":["Remove integration from the WBS.","Change the FS dependency to SS without technical justification.","Start testi
