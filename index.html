deg,#122b43,#1d5061);color:#fff;border-radius:22px;padding:36px 38px;position:relative;overflow:hidden;box-shadow:var(--shadow)}.hero:after{content:"";position:absolute;width:350px;height:350px;border:1px solid rgba(255,255,255,.16);border-radius:50%;right:-75px;top:-180px;box-shadow:0 0 0 35px rgba(255,255,255,.035),0 0 0 75px rgba(255,255,255,.025)}.eyebrow{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:#a8d7d1;font-weight:700}.hero h2{font:500 clamp(30px,4vw,46px)/1.1 Georgia,serif;margin:13px 0 12px;max-width:720px}.hero p{max-width:710px;color:#d1e0e4;margin:0 0 22px}.hero .btn{position:relative;z-index:1}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:16px 0 27px}.stat,.card,.panel{background:#fff;border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}.stat{padding:15px 17px}.stat strong{display:block;font:600 25px Georgia;color:var(--navy)}.stat span{font-size:11px;color:var(--muted)}.section-head{display:flex;justify-content:space-between;align-items:end;gap:16px;margin:31px 0 13px}.section-head h2{margin:0;font:500 27px Georgia;color:var(--navy)}.section-head p{margin:3px 0 0;color:var(--muted);font-size:12px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:13px}.card{padding:18px}.card h3{margin:5px 0 8px;color:var(--navy);font:600 19px Georgia}.card p{font-size:13px;color:var(--muted);margin:0 0 12px}.tag{display:inline-block;border-radius:30px;background:#edf3f3;color:#41646c;padding:4px 8px;font-size:10px;font-weight:700;letter-spacing:.02em}.tag.green{background:#e4f3ed;color:#236a52}.tag.gold{background:#fbf1dd;color:#8c6426}.tag.red{background:#fae9e6;color:#963c34}.progress{height:7px;background:#e9eeee;border-radius:20px;overflow:hidden}.progress>i{display:block;height:100%;background:var(--teal);width:0}.muted{color:var(--muted)}.small{font-size:12px}.page-title{font:500 34px/1.1 Georgia;color:var(--navy);margin:0 0 7px}.lede{color:var(--muted);margin:0 0 24px;max-width:850px}.panel{padding:22px;margin:14px 0}.panel h3{font:600 20px Georgia;color:var(--navy);margin:0 0 10px}.panel h4{color:var(--navy);margin:18px 0 5px}.panel p{margin:7px 0}.callout{background:var(--teal2);border-left:3px solid var(--teal);padding:13px 15px;border-radius:0 10px 10px 0;margin:13px 0;font-size:13px}.warning{background:#fff5e4;border-left-color:var(--gold)}.source-note{font-size:11px;color:var(--muted);border-top:1px solid var(--line);padding-top:10px;margin-top:16px}.table-wrap{overflow:auto;margin:12px 0}table{border-collapse:collapse;width:100%;font-size:12px;min-width:520px}th,td{border-bottom:1px solid var(--line);padding:10px;text-align:left;vertical-align:top}th{background:#f1f5f4;color:var(--navy);font-weight:700}.formula{font:500 21px Georgia;background:#f3f6f5;padding:15px;border-radius:10px;text-align:center;color:var(--navy);margin:10px 0}.two-col{display:grid;grid-template-columns:1fr 1fr;gap:14px}.lesson-nav{display:flex;flex-wrap:wrap;gap:7px;margin:14px 0}.lesson-nav button{border:1px solid var(--line);background:#fff;border-radius:30px;padding:7px 11px;font-size:11px;color:var(--muted)}.lesson-nav button.active{background:var(--navy);color:#fff;border-color:var(--navy)}details{border:1px solid var(--line);border-radius:10px;margin:9px 0;background:#fff}summary{padding:11px 14px;cursor:pointer;font-size:13px;font-weight:700;color:var(--navy)}details .detail-body{padding:0 14px 14px;font-size:13px}.tracker-group{border:1px solid var(--line);border-radius:12px;margin:12px 0;background:#fff;overflow:hidden}.tracker-group h3{margin:0;padding:13px 15px;background:#f2f6f5;color:var(--navy);font:600 17px Georgia}.tracker-items{padding:8px 15px}.track-item{display:flex;gap:10px;align-items:flex-start;border-bottom:1px solid #edf0ef;padding:8px 0;font-size:13px}.track-item:last-child{border:0}.track-item input{accent-color:var(--teal);margin-top:4px}.bank-controls{display:flex;gap:9px;flex-wrap:wrap;margin:13px 0}.bank-controls input,.bank-controls select,.search{border:1px solid var(--line);background:#fff;padding:10px 12px;border-radius:9px;color:var(--ink)}.bank-controls input{flex:1;min-width:220px}.question{background:#fff;border:1px solid var(--line);border-radius:14px;padding:19px;margin:13px 0;box-shadow:var(--shadow)}.qmeta{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:9px}.qmeta small{color:var(--muted)}.qstem{font-weight:650;color:#223342;margin:8px 0 14px}.option{display:flex;gap:10px;border:1px solid var(--line);padding:10px 12px;border-radius:9px;margin:7px 0;font-size:13px;cursor:pointer}.option:hover{border-color:#75aaa7;background:#f7fbfa}.option input{accent-color:var(--teal);margin-top:3px}.option.correct{border-color:#83bca4;background:#eef8f2}.option.wrong{border-color:#d79b92;background:#fff4f1}.feedback{font-size:12px;padding:10px 12px;border-radius:9px;margin:7px 0;background:#f3f6f5}.feedback.good{background:#eaf6ef;color:#205f48}.feedback.bad{background:#fff0ed;color:#8d3b33}.exam-layout{display:grid;grid-template-columns:minmax(0,1fr) 225px;gap:16px;align-items:start}.exam-side{position:sticky;top:80px;background:#fff;border:1px solid var(--line);border-radius:13px;padding:14px}.qgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:12px 0}.qgrid button{border:1px solid var(--line);background:#fff;border-radius:7px;padding:7px 0;font-size:11px}.qgrid button.answered{background:#e2f3ed;border-color:#8abda7}.qgrid button.current{outline:2px solid var(--teal)}.qgrid button.flagged:after{content:" ⚑";color:#a46e20}.exam-option{display:flex;gap:10px;align-items:flex-start;padding:12px;border:1px solid var(--line);border-radius:9px;margin:8px 0;cursor:pointer;font-size:13px}.exam-option.selected{border-color:var(--teal);background:#eff8f6}.exam-option input{accent-color:var(--teal);margin-top:4px}.review-item{border-bottom:1px solid var(--line);padding:16px 0}.review-item:last-child{border:0}.review-option{font-size:12px;padding:8px 10px;border-radius:7px;margin:5px 0;background:#f5f6f4}.review-option.correct{background:#eaf6ef;border-left:3px solid var(--green)}.review-option.incorrect{background:#fff0ed;border-left:3px solid var(--red)}.toast{position:fixed;bottom:20px;right:20px;background:var(--navy);color:#fff;padding:11px 15px;border-radius:9px;box-shadow:var(--shadow);z-index:30;font-size:12px}.hidden{display:none!important}.footer{padding:25px 0;color:var(--muted);font-size:11px;border-top:1px solid var(--line);margin-top:35px}.pillrow{display:flex;gap:6px;flex-wrap:wrap}.pill{background:#edf2f1;padding:5px 8px;border-radius:30px;font-size:10px;color:#52686c}.case-step{border-left:2px solid #b7d4cf;padding:2px 0 12px 15px;margin-left:7px}.case-step b{color:var(--navy)}.mobile-menu{display:none}

.bank-summary{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0 16px}
.bank-summary span{background:#fff;border:1px solid var(--line);padding:6px 9px;border-radius:8px;font-size:11px;color:var(--muted)}
.mock-intro-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}
.mock-intro-grid .stat{box-shadow:none}
.case-tabs{display:flex;gap:7px;flex-wrap:wrap;margin:12px 0}
.case-tabs .tag{cursor:default}
@media(max-width:720px){.mock-intro-grid{grid-template-columns:1fr}.master-block{padding:15px}}

<script>
const DATA={"bank":[{"id":"A01","area":"A · Strategy & stakeholders","topic":"Project versus process","level":"Foundation","stem":"A company repeats the same payroll operation every month using stable procedures. What best describes this effort?","options":["A project, because it consumes human resources","A process, because it is repetitive and relatively stable","A project, because it has constraints","Neither, because it has a measurable result"],"answer":1,"feedback":["People are used by both projects and processes.","Repetition and stability are the course’s principal process characteristics.","Constraints can apply to both.","A measurable result does not by itself make an effort a project."],"kind":"Classification","correct_position":"B"},{"id":"A02","area":"A · Strategy & stakeholders","topic":"Project complexity","level":"Foundation","stem":"A colleague argues that moving one chair is necessarily a project because it is a one-time activity. What is the best response?","options":["Correct: every one-time activity is a project","Correct: any activity using material resources is a project","Incorrect: a project must involve external customers","Incorrect: the course also expects sufficient complexity and a goal-oriented, time-bounded effort using resources"],"answer":3,"feedback":["One-time effort is a clue, not a sufficient definition.","Correct. Complexity is the additional qualification in the slide.","Material resources are used by routine processes too.","SS1 says a project is non-repetitive, goal-oriented and time-bounded, using a pool of resources; it also says sufficient complexity is needed."],"kind":"Diagnosis","correct_position":"D"},{"id":"A03","area":"A · Strategy & stakeholders","topic":"Strategic planning","level":"Foundation","stem":"In the course framework, which activity belongs most directly to strategic planning?","options":["Preparing daily checklists","Preparing a detailed activity calendar","Assigning task start dates","Identifying CSFs and analysing stakeholders"],"answer":3,"feedback":["Correct. CSFs and stakeholder analysis shape strategic direction.","An activity calendar is operational scheduling.","Checklists are operational tools.","The framework places Critical Success Factors and stakeholder analysis in strategic planning."],"kind":"Classification","correct_position":"D"},{"id":"A04","area":"A · Strategy & stakeholders","topic":"CSF definition","level":"Foundation","stem":"Which statement best describes a Critical Success Factor?","options":["Every measurable target in the plan","A constraint imposed by an external authority","A limited number of areas in which satisfactory results greatly increase the probability of project success","A list of every activity required"],"answer":2,"feedback":["A target may be a success criterion, not automatically a CSF.","The activity breakdown is represented by the WBS.","This follows the Rockart-derived definition used in SS1.","Correct. This is the lecture definition."],"kind":"Definition recognition","correct_position":"C"},{"id":"A05","area":"A · Strategy & stakeholders","topic":"Product SF versus Project CSF","level":"Application","stem":"A device has excellent range, price and performance, but production cannot scale because battery capacity is insufficient. Which distinction does the Tesla example illustrate?","options":["Project CSFs are identical to product features","Production capacity is a customer satisfaction score","A successful product guarantees project success","Product success factors and project CSFs are different"],"answer":3,"feedback":["The example challenges this assumption.","These are different concepts.","Correct. Product desirability and execution capability are distinct.","The Tesla example separates attractive product characteristics from the project capability required to scale production."],"kind":"Case interpretation","correct_position":"D"},{"id":"A06","area":"A · Strategy & stakeholders","topic":"IPO approach","level":"Foundation","stem":"In the IPO approach to discovering CSFs, what is the Output?","options":["Analysis of inputs and correlations","The activity list","Key project characteristics","Final decisions expressed as CSFs"],"answer":3,"feedback":["This describes the Process.","Correct. The activity list is not the IPO output.","These are part of Input.","IPO Output is the final decision about the CSFs."],"kind":"Process interpretation","correct_position":"D"},{"id":"B01","area":"B · Scope & WBS","topic":"PSS definition","level":"Foundation","stem":"What is the primary purpose of a Project Scope Statement?","options":["Sequence activities by start date","Calculate the risk score","Provide a common understanding of project scope and describe major objectives","Describe only the budget"],"answer":2,"feedback":["Sequencing belongs to scheduling.","Correct. This is the SS2 definition.","The PSS provides a common understanding of project scope and describes major objectives.","Risk scoring belongs to risk analysis."],"kind":"Purpose","correct_position":"C"},{"id":"B02","area":"B · Scope & WBS","topic":"PSS characteristics","level":"Foundation","stem":"Which combination reflects the three characteristics of a good PSS in SS2?","options":["Clear on objectives, well known by stakeholders and agreeable","Detailed, chronological and legally binding","Measurable, optimised and risk-free","Flexible, confidential and optional"],"answer":0,"feedback":["The three stated characteristics are clear on objectives, well known by stakeholders and agreeable (not mandatory).","Chronology belongs to scheduling.","Confidentiality is not stated.","Correct. These are the three slide characteristics."],"kind":"Recall / distinction","correct_position":"A"},{"id":"B03","area":"B · Scope & WBS","topic":"Project justification","level":"Foundation","stem":"Which is NOT one of the three drivers of project justification in SS2?","options":["Opportunities","Problems","Team preferences","Obligations"],"answer":2,"feedback":["Opportunities are listed.","Problems are listed.","SS2 lists problems, opportunities and obligations.","Obligations are listed."],"kind":"Negative identification","correct_position":"C"},{"id":"B04","area":"B · Scope & WBS","topic":"Deliverables","level":"Foundation","stem":"A project deliverable is best described as:","options":["A risk response","A unique and verifiable product, result or capability to perform a service required to complete a process, phase or project","A predecessor relationship","Any meeting held during the project"],"answer":1,"feedback":["A predecessor is a scheduling relationship.","This follows the deliverable definition in SS2.","Correct. This is the slide definition.","A meeting may be an activity but is not automatically a deliverable."],"kind":"Definition recognition","correct_position":"B"},{"id":"B05","area":"B · Scope & WBS","topic":"Output versus outcome","level":"Application","stem":"A training project conducts 12 workshops, but employee performance does not improve. Which statement is correct?","options":["Neither can be measured","Workshops are output; improved performance is the intended outcome","Both are constraints","Workshops are outcome; improved performance is output"],"answer":1,"feedback":["Neither is necessarily a constraint.","Workshops are what the project delivers; improved performance is the effect sought.","Correct. Output is produced; outcome is the resulting effect.","This reverses the classification."],"kind":"Output/outcome classification","correct_position":"B"},{"id":"B06","area":"B · Scope & WBS","topic":"Success criteria versus CSF","level":"Foundation","stem":"Which statement correctly distinguishes success criteria from CSFs?","options":["Success criteria explain what must go well; CSFs are numerical measures","Success criteria are only constraints","They are interchangeable","CSFs identify limited areas critical to success; success criteria measure acceptable results"],"answer":3,"feedback":["This reverses the concepts.","The slides make a clear distinction.","Correct. CSF is a driver; criteria measure result acceptability.","SS2 explicitly says success criteria are not CSFs."],"kind":"Concept distinction","correct_position":"D"},{"id":"C01","area":"C · Scheduling","topic":"Scheduling inputs","level":"Foundation","stem":"Which item is NOT one of the six scheduling inputs shown in SS3?","options":["Dependencies","Calendars","Stakeholder attitude","Activity list"],"answer":2,"feedback":["Dependencies are an input.","Calendars are an input.","The six inputs are activity list, dependencies, durations, calendars, constraints and resources.","Activity list is an input."],"kind":"Input identification","correct_position":"C"},{"id":"C02","area":"C · Scheduling","topic":"Finish-to-Start","level":"Foundation","stem":"A has an FS dependency on B (B is predecessor). When can A start?","options":["Only when B finishes and another task starts","When B starts","Only after B finishes","Before B finishes"],"answer":2,"feedback":["That is SS.","Correct. This is the FS rule.","FS means the successor can start only after the predecessor finishes.","An extra condition is not implied."],"kind":"Dependency logic","correct_position":"C"},{"id":"C03","area":"C · Scheduling","topic":"Start-to-Start","level":"Foundation","stem":"In a Start-to-Start relationship, what must happen before successor B can start?","options":["A and B must both finish","A must start","B must finish before A starts","A must finish"],"answer":1,"feedback":["Correct. This is SS.","SS requires the predecessor to have started.","This is not the FF rule.","That is FS."],"kind":"Dependency logic","correct_position":"B"},{"id":"C04","area":"C · Scheduling","topic":"Finish-to-Finish","level":"Foundation","stem":"A Finish-to-Finish relationship means:","options":["B can start only after A finishes","B can finish only after A finishes","B must start when A starts","B can finish only after A starts"],"answer":1,"feedback":["That is FS.","FF constrains the successor’s finish relative to the predecessor’s finish.","Correct. This is FF.","That is SS."],"kind":"Dependency logic","correct_position":"B"},{"id":"C05","area":"C · Scheduling","topic":"Start-to-Finish","level":"Foundation","stem":"A Start-to-Finish relationship means:","options":["B can finish only after A finishes","B can start only after A finishes","B can finish only after A starts","B must start with A"],"answer":2,"feedback":["That is FS.","Correct. This is SF.","SF means the successor can finish only after the predecessor has started.","That is FF."],"kind":"Dependency logic","correct_position":"C"},{"id":"C06","area":"C · Scheduling","topic":"Critical Path","level":"Foundation","stem":"What is the purpose of the Critical Path Method?","options":["Identify stakeholders with highest interest","Eliminate every project risk","Classify product requirements","Identify activities whose delay delays the whole project"],"answer":3,"feedback":["This is stakeholder analysis.","This is backlog prioritisation.","Correct. This is the SS3 purpose.","CPM identifies activities that, if delayed, delay the whole project."],"kind":"Method purpose","correct_position":"D"},{"id":"D01","area":"D · Risk management","topic":"Risk definition","level":"Foundation","stem":"Which statement best defines a project risk in SS4?","options":["A project constraint","A confirmed problem already occurred","An uncertain event or condition that may positively or negatively affect project objectives","Any activity taking longer than planned"],"answer":2,"feedback":["A delay may be a consequence, not the general definition.","A confirmed issue is no longer uncertain.","SS4 includes uncertain events with positive or negative effects on objectives.","Correct. This is the SS4 definition."],"kind":"Definition recognition","correct_position":"C"},{"id":"D02","area":"D · Risk management","topic":"Risk process","level":"Foundation","stem":"Which is the correct five-stage risk management sequence?","options":["Identify, analyse, response planning, response, monitor/control","Analyse, identify, accept, close, report","Identify, budget, schedule, execute, close","Avoid, transfer, mitigate, accept, monitor"],"answer":0,"feedback":["SS4 lists Identification, Analysis, Response Planning, Response, and Monitor and Control.","Correct. This is the slide sequence.","This is out of order and omits named stages.","These are general project activities."],"kind":"Process sequence","correct_position":"A"},{"id":"D03","area":"D · Risk management","topic":"Risk identification inputs","level":"Application","stem":"Which project document is explicitly listed as an input to risk identification?","options":["Project Management Plan including scope, WBS and Gantt/Critical Path","Only the final invoice","Only final certificate","Only stakeholder attendance sheet"],"answer":0,"feedback":["SS4 lists the Project Management Plan and its scope, WBS and Gantt/Critical Path as inputs.","Invoices are not the listed core method.","This is not the listed core input.","Correct. These planning elements support risk identification."],"kind":"Method identification","correct_position":"A"},{"id":"D04","area":"D · Risk management","topic":"Risk description","level":"Foundation","stem":"A clear risk description should contain which three components?","options":["Owner, budget and deadline","Power, interest and attitude","Condition, risk event and consequence","Input, process and output"],"answer":2,"feedback":["These are not the three-part structure.","Correct. This is the SS4 format.","The slide structure is condition → risk → consequence: due to… there is a risk that… causing…","These are stakeholder dimensions."],"kind":"Risk statement diagnosis","correct_position":"C"},{"id":"D05","area":"D · Risk management","topic":"Risk response","level":"Application","stem":"A team changes the plan so that the identified source of risk no longer applies. Which response is this?","options":["Accept","Transfer","Avoid","Mitigate"],"answer":2,"feedback":["Accept retains exposure.","Transfer/share allocates defined consequences to another party.","Avoid changes the plan so the stated source of risk no longer applies.","Correct. This is avoidance."],"kind":"Response classification","correct_position":"C"},{"id":"D06","area":"D · Risk management","topic":"Plan A and Plan B","level":"Foundation","stem":"When is Plan B, the contingency plan, activated?","options":["Only when the project is close to failure","Before the risk happens in every case","At project closure","When the risk happens or is near to happening"],"answer":3,"feedback":["Correct. This is the slide definition.","This describes Plan A preventive actions.","The trigger is not limited to near-total project failure.","SS4 defines Plan B as the contingency plan activated when the risk happens or is near."],"kind":"Trigger interpretation","correct_position":"D"},{"id":"E01","area":"E · Agile & methodologies","topic":"Agile definition","level":"Foundation","stem":"Which description best matches the SS6 summary of Agile?","options":["A method removing all scheduling and risk management","A fixed sequential plan with minimal customer interaction","Collaborative discovery and solution development by self-organising cross-functional teams and customers, using adaptive planning","A method only for software with no constraints"],"answer":2,"feedback":["Correct. It includes collaboration and adaptive planning.","This is closer to predictive management.","This is the core SS6 summary of Agile.","SS6 includes scheduling and risk management in Agile."],"kind":"Concept interpretation","correct_position":"C"},{"id":"E02","area":"E · Agile & methodologies","topic":"Predictive selection","level":"Application","stem":"Requirements are stable, customers are difficult to reach and changes are expensive. Which approach is favoured by SS6?","options":["Predictive","Scrum without project planning","No methodology","Agile"],"answer":0,"feedback":["Stable requirements, limited client access and high cost of change favour Predictive.","The course expects a method to be selected.","Correct. This matches the SS6 comparison.","These are not the Agile-favouring conditions."],"kind":"Method selection","correct_position":"A"},{"id":"E03","area":"E · Agile & methodologies","topic":"Agile conditions","level":"Application","stem":"Requirements are unclear, clients can provide immediate feedback and modules can each deliver value. Which approach is favoured?","options":["Only Critical Chain","No scheduling","Predictive","Agile"],"answer":3,"feedback":["Agile does not mean no scheduling.","Correct. This is an Agile profile.","These are not the Predictive conditions.","Uncertainty, collaboration, learning and incremental value favour Agile."],"kind":"Method selection","correct_position":"D"},{"id":"E04","area":"E · Agile & methodologies","topic":"Hybrid","level":"Application","stem":"A project has stable regulatory components and evolving customer-facing features. Which approach can combine different styles?","options":["Hybrid","Pure Predictive only","No project management","Pure Agile only"],"answer":0,"feedback":["Hybrid combines predictive and adaptive elements where appropriate.","This may be too rigid for evolving features.","A project still requires management.","This may not exploit stable components."],"kind":"Method selection","correct_position":"A"},{"id":"E05","area":"E · Agile & methodologies","topic":"Methodology mapping","level":"Foundation","stem":"According to the SS6 mapping, which methodology includes CSFs and stakeholder management?","options":["Hybrid only","All three","Predictive only","Pure Agile only"],"answer":1,"feedback":["The slide includes Hybrid.","The slide marks CSFs and stakeholder management as applicable to Predictive, Pure Agile and Hybrid.","The slide includes Predictive.","The slide includes Pure Agile."],"kind":"Matrix interpretation","correct_position":"B"},{"id":"E06","area":"E · Agile & methodologies","topic":"I-shaped organisations","level":"Application","stem":"Which characteristic is explicitly associated with I-shaped organisations in SS6?","options":["No specialist expertise","Differences in language and lack of role flexibility","Flexible roles and shared language","Universal cross-functional collaboration"],"answer":1,"feedback":["This is not the I-shaped problem.","SS6 lists differences in language, potential lack of respect and lack of role flexibility.","This is closer to the intended T-shaped contrast.","Correct. These are the I-shaped characteristics."],"kind":"Organisational diagnosis","correct_position":"B"},{"id":"F01","area":"F · Scrum & prioritisation","topic":"Scrum pillars","level":"Foundation","stem":"Which sequence reflects the relationship among Scrum’s three pillars in SS7?","options":["Planning → Budgeting → Closing","Transparency → Inspection → Adaptation","Adaptation → Transparency → Inspection","Inspection → Adaptation → Transparency"],"answer":1,"feedback":["This is not the pillar relationship.","Transparency enables inspection; inspection enables adaptation.","This reverses the logic.","Correct. This is the SS7 sequence."],"kind":"Pillar sequence","correct_position":"B"},{"id":"F02","area":"F · Scrum & prioritisation","topic":"Sprint Review","level":"Application","stem":"Who should contribute to inspecting the product outcome during a Sprint Review?","options":["Only the Product Owner","Only the Scrum Master","Only Developers without stakeholders","The Scrum Team and relevant stakeholders"],"answer":3,"feedback":["Correct. The review should not be restricted to the team.","The Product Owner does not replace all participants.","This misses stakeholder collaboration.","Sprint Review inspects the product outcome with stakeholders and considers future direction."],"kind":"Stakeholder participation","correct_position":"D"},{"id":"F03","area":"F · Scrum & prioritisation","topic":"MoSCoW","level":"Foundation","stem":"A requirement is wanted but not vital. Which MoSCoW category fits?","options":["Could","Should","Won’t","Must"],"answer":1,"feedback":["Correct. This is the SS7 definition.","Should means wanted but not vital.","Could is nice to have.","Must is vital."],"kind":"Classification","correct_position":"B"},{"id":"F04","area":"F · Scrum & prioritisation","topic":"Kano Basic","level":"Application","stem":"A pub is being developed. According to the Kano model, beer is most naturally classified as:","options":["Indifferent","Basic","Excitement","Performance"],"answer":1,"feedback":["Correct. Its absence would create dissatisfaction.","Beer is an expected baseline offering in the mock scenario.","It is not an unexpected delight.","It is not being framed as a linear differentiator."],"kind":"Kano application","correct_position":"B"},{"id":"F05","area":"F · Scrum & prioritisation","topic":"Sprint Review versus Retrospective","level":"Application","stem":"A team discusses customer feedback on the delivered increment and what product changes may follow. Which event is this?","options":["Sprint Retrospective","Sprint Review","Sprint Planning","Daily Scrum"],"answer":1,"feedback":["Retrospective focuses on the team’s way of working.","Sprint Review inspects the product outcome with stakeholders and informs future direction.","Daily Scrum inspects progress toward the Sprint Goal.","Correct. This is the product review."],"kind":"Event distinction","correct_position":"B"},{"id":"F06","area":"F · Scrum & prioritisation","topic":"Backlog item types","level":"Application","stem":"A team adds a technical investigation to learn whether an integration method can work. Does this fit SS7’s concept of backlog items?","options":["No, only customer-visible features count","No, investigation is always outside the backlog","Only after every feature is complete","Yes, knowledge acquisition and technical tasks may be needed to create value"],"answer":3,"feedback":["The backlog is not limited to visible features.","Correct. Technical learning can enable value creation.","The slide explicitly includes technical and knowledge work.","The SS7 items slide includes knowledge acquisition and technical tasks as valid types of backlog work."],"kind":"Backlog item classification","correct_position":"D"},{"id":"A07","area":"A · Strategy & stakeholders","topic":"Dynamic CSFs","level":"Application","kind":"Diagnose a changing condition","stem":"Mind the Gum discovers that large gum producers will not accept small production batches. Which response best reflects the slide’s point that CSFs are dynamic?","options":["Replace the CSF with a target for the number of meetings held.","Keep the original plan unchanged because CSFs are fixed at project approval.","Reassess what must go well and secure a large contract before committing to production.","Remove the supplier from the stakeholder analysis because it is not an employee."],"answer":2,"feedback":["Meeting count is an activity measure, not necessarily a driver of success.","A dynamic CSF may need review when project conditions change; freezing it defeats that lesson.","Correct. The supplier condition changes what is indispensable for success; the slide specifically connects large contracts to overcoming refusal of small batches.","Suppliers are stakeholders when they can affect project outcomes."],"correct_position":"C"},{"id":"A08","area":"A · Strategy & stakeholders","topic":"Power–Interest Matrix","level":"Classification","kind":"Classify a stakeholder","stem":"A regulator has the authority to stop a project, but is affected only slightly by its day-to-day progress. Under Mendelow’s matrix, how should the project team generally manage this stakeholder?","options":["Manage closely","Monitor","Keep informed","Keep satisfied"],"answer":3,"feedback":["High power/high interest stakeholders are managed closely.","Low power/low interest stakeholders are monitored.","Low power/high interest stakeholders are generally kept informed.","Correct. High power and low interest maps to Keep satisfied."],"correct_position":"D"},{"id":"A09","area":"A · Strategy & stakeholders","topic":"Stakeholder attitude and relationships","level":"Interpretation","kind":"Read beyond the matrix","stem":"Two stakeholders have identical power and interest scores. One supports the project; the other actively resists it. What does the SS1 stakeholder-analysis template tell the manager to examine in addition to power and interest?","options":["Attitude, perceptions, stakeholder relationships and the management strategy","Whether both stakeholders are internal employees","Only the project budget","Only the number of meetings attended"],"answer":0,"feedback":["Correct. SS1’s summary template includes attitude, how the stakeholder views the project, what the project needs from the group, relationships and management strategy.","Stakeholders can be internal or external.","Budget is part of project planning, but it does not explain the difference in stakeholder stance.","Meeting attendance alone is an inadequate proxy for stakeholder attitude or influence."],"correct_position":"A"},{"id":"A10","area":"A · Strategy & stakeholders","topic":"IPO approach to CSFs","level":"Sequence / interpretation","kind":"Identify the output of analysis","stem":"A team lists project characteristics, the external environment and strategic direction; analyses correlations and their impacts; and then selects the few areas that must go particularly well. Which IPO stage is the final selection?","options":["Output","Monitoring","Process","Input"],"answer":0,"feedback":["Correct. The final decisions expressed as CSFs are the output.","Monitoring is part of project control, not the final IPO stage.","Process is the analysis of inputs, correlations, impacts and possible solutions.","Input comprises the key project characteristics, project environment and strategic directions."],"correct_position":"A"},{"id":"A11","area":"A · Strategy & stakeholders","topic":"Project versus process","level":"Classification","kind":"Diagnose project complexity","stem":"A retailer runs a weekly stock reconciliation using a stable, repeatable procedure. It also launches a one-time, multi-location redesign of its inventory system involving several functions and a fixed completion window. Which classification best fits?","options":["The weekly reconciliation is a process; the redesign is a project.","Both are processes because both use employees.","The weekly reconciliation is a project; the redesign is a process.","Both are projects because both have constraints."],"answer":0,"feedback":["Correct. Repetitive, stable work is a process; a temporary, unique, complex effort is a project.","Resource use does not distinguish projects from processes; both use people.","This reverses the defining distinction.","Constraints apply to both and therefore do not distinguish them."],"correct_position":"A"},{"id":"A12","area":"A · Strategy & stakeholders","topic":"Typical CSFs","level":"Application","kind":"Connect a CSF to a management action","stem":"A project depends on a new technology for which the organisation has no in-house expertise. Which typical CSF from the Pinto and Slevin list is most directly threatened?","options":["Technical Tasks and Personnel","Client Acceptance only","Troubleshooting only","Project Schedule/Plan only"],"answer":0,"feedback":["Correct. The list includes availability of technology/expertise under Technical Tasks and recruitment/selection/training under Personnel.","Client acceptance matters, but it does not directly resolve the expertise gap.","Troubleshooting addresses unexpected crises; it is not a substitute for securing needed expertise.","The schedule may be affected, but the immediate capability gap concerns personnel and technical tasks."],"correct_position":"A"},{"id":"B07","area":"B · Scope & WBS","topic":"PSS element classification","level":"Classification","kind":"Classify the statement","stem":"A project team writes: “International rollout is excluded from this phase.” Which Project Scope Statement element is being defined?","options":["Project justification","Project boundaries / exclusions","Project description","Success criteria"],"answer":1,"feedback":["Justification explains why the project is needed.","Correct. An explicit exclusion sets a scope boundary and prevents grey areas.","Project description explains what the project is about.","Success criteria define measurable acceptable results."],"correct_position":"B"},{"id":"B08","area":"B · Scope & WBS","topic":"Constraints versus boundaries","level":"Classification","kind":"Distinguish two similar terms","stem":"A project statement says: (1) “The pilot will cover Mumbai only”; (2) “The solution must comply with local data-protection law.” Which classification is most accurate?","options":["Both are success criteria.","(1) is a constraint; (2) is a boundary.","Both are deliverables.","(1) is a boundary; (2) is a constraint."],"answer":3,"feedback":["Neither statement gives a measurable performance result.","This reverses the two concepts.","Neither statement describes a product or result to be produced.","Correct. The geographic inclusion defines the scope boundary; the legal requirement limits execution."],"correct_position":"D"},{"id":"B09","area":"B · Scope & WBS","topic":"Output versus outcome","level":"Interpretation","kind":"Separate delivery from impact","stem":"A leadership programme delivers 8 workshops to 160 managers. Six months later, decision quality improves. Which is the output and which is the outcome?","options":["Both are outputs","Output: 8 workshops; outcome: improved decision quality","Both are constraints","Output: improved decision quality; outcome: 8 workshops"],"answer":1,"feedback":["The improvement is an effect, not simply another delivered session.","Correct. Workshops are delivered outputs; improved decision quality is the intended outcome.","Neither is a limitation on execution.","This reverses what is produced and the effect sought."],"correct_position":"B"},{"id":"B10","area":"B · Scope & WBS","topic":"Bottom-Up WBS","level":"Sequence","kind":"Choose the correct development logic","stem":"A team uses a Bottom-Up approach to develop a WBS. Which sequence best reflects SS2?","options":["Brainstorm activities without sequencing → recognise the difficulty → group activities → organise around deliverables → check omissions","Write a Gantt chart → derive the scope → select the deliverables","Start with a template → assign dates → remove activities → identify stakeholders","Sequence activities → estimate dates → define CSFs → group by department"],"answer":0,"feedback":["Correct. This is the five-step Bottom-Up logic in SS2.","SS2 states that WBS has no timeline and is not a Gantt chart.","This mixes unrelated planning methods and omits the five-step process.","Bottom-Up brainstorming deliberately avoids activity sequencing at the start and is organised around deliverables."],"correct_position":"A"},{"id":"B11","area":"B · Scope & WBS","topic":"Work package rules","level":"Diagnosis","kind":"Find the work-package defect","stem":"A WBS work package is described as “complete the digital transformation”. No duration, resource estimate, measurable progress or owner can be identified. What should the team do?","options":["Keep it because every WBS item should be broad.","Break it into smaller, estimatable and measurable work packages with clear ownership and inputs/outputs.","Convert it directly into a milestone date.","Move it to the risk register and remove it from scope."],"answer":1,"feedback":["A work package should be manageable; an umbrella phrase is too vague to control.","Correct. It fails the estimatable, measurable, manageable and clear I/O tests.","A milestone date does not decompose the work or make it measurable.","The work may contain risks, but it still belongs in the scope breakdown."],"correct_position":"B"},{"id":"B12","area":"B · Scope & WBS","topic":"WBS versus Gantt","level":"Conceptual distinction","kind":"Diagnose a planning error","stem":"A consultant argues that the WBS should be drawn in chronological order because it is the project schedule. What is the best response?","options":["Disagree; WBS and Gantt charts are unrelated.","Disagree; the WBS decomposes scope and has no time sequence. Scheduling uses the activities and dependencies to establish timing.","Agree, but only for small projects.","Agree; the WBS is a time-sequenced plan."],"answer":1,"feedback":["They are related: the WBS is a starting point for schedule development.","Correct. WBS says what work is needed; scheduling establishes when and in what dependency order it occurs.","The distinction applies regardless of project size.","This contradicts SS2, which explicitly says the WBS is not a Gantt."],"correct_position":"B"},{"id":"C07","area":"C · Scheduling","topic":"Multiple dependencies","level":"Logic / deduction","kind":"Satisfy two predecessor conditions","stem":"Task D has an FS dependency on A and an SS dependency on B. A has finished, but B has not started. Can D start?","options":["Yes, because A has finished.","Yes, because only one predecessor condition matters.","No; both conditions must be satisfied, and B must also have started.","No; B must finish before D can start."],"answer":2,"feedback":["A’s FS condition is satisfied, but that is not the only predecessor.","All predecessor conditions must be met.","Correct. D needs A finished and B started.","The SS relationship requires B to start, not finish."],"correct_position":"C"},{"id":"C08","area":"C · Scheduling","topic":"Leads and lags","level":"Application","kind":"Interpret a schedule modifier","stem":"A successor activity is scheduled to begin two days after its predecessor finishes. Which notation best describes the relationship?","options":["SF with a two-day lead","SS with a two-day lead","FS with a two-day lag","FF with a two-day lag"],"answer":2,"feedback":["SF constrains the successor finish after predecessor start.","SS constrains starts; a lead is overlap, not a waiting period.","Correct. FS defines the predecessor finish before successor start; the two-day waiting interval is a lag.","FF constrains finishes, not the successor start."],"correct_position":"C"},{"id":"C09","area":"C · Scheduling","topic":"Mandatory versus discretionary dependencies","level":"Classification","kind":"Identify an optimisable relationship","stem":"A team chooses to conduct design reviews before procurement because this sequence worked well on previous projects. The work could technically be performed in another order. What kind of dependency is this?","options":["Discretionary","A project constraint","Finish-to-Finish by definition","Mandatory"],"answer":0,"feedback":["Correct. The preferred sequence is based on experience, so it is discretionary.","A constraint is a limiting factor, not a preferred sequence.","FF is a relationship type, not a classification of why the relationship exists.","Mandatory dependencies are determined by the nature of the work."],"correct_position":"A"},{"id":"C10","area":"C · Scheduling","topic":"Critical Path worked calculation","level":"Calculation","kind":"Find the longest path","stem":"A project has two complete paths: A–B–D–E = 2+3+5+2 days; A–C–D–E = 2+4+5+2 days. Which path is critical and what is the project duration?","options":["A–C–D–E; 13 days","A–B–D–E; 12 days","A–C–D–E; 11 days","Both paths; 25 days"],"answer":0,"feedback":["Correct. The second path totals 13 days and is the longest; it determines the project duration.","This path totals 12 days, shorter than the other path.","The second path totals 13 days, not 11.","The paths are alternatives through the network, not added together."],"correct_position":"A"},{"id":"C11","area":"C · Scheduling","topic":"PERT expected duration","level":"Calculation","kind":"Calculate an expected time","stem":"An activity has optimistic duration 4 days, most likely duration 7 days and pessimistic duration 16 days. Using the SS3 PERT formula, what is its expected duration?","options":["8 days","7 days","9 days","10 days"],"answer":0,"feedback":["Correct: (4 + 4×7 + 16) / 6 = 48 / 6 = 8 days.","7 is the most likely estimate, not the weighted expected duration.","This is not the result of the weighted formula.","This overstates the expected value."],"correct_position":"A"},{"id":"C12","area":"C · Scheduling","topic":"PERT standard deviation","level":"Calculation","kind":"Calculate uncertainty","stem":"Using optimistic duration 4 days and pessimistic duration 16 days, what standard deviation does the SS3 PERT expression give?","options":["6 days","1 day","2 days","4 days"],"answer":2,"feedback":["This is half the full range, not the slide formula.","(16−4)/6 is 2, not 1.","Correct: σ = (P−O)/6 = (16−4)/6 = 2 days.","This omits the division by six."],"correct_position":"C"},{"id":"D07","area":"D · Risk Management","topic":"Risk description","level":"Diagnosis","kind":"Improve a vague risk statement","stem":"Which statement is the clearest risk description?","options":["There may be delays.","Supplier risk.","The project is risky and the team should be careful.","Due to the new supplier’s untested process, there is a risk that components arrive late, causing the installation milestone to slip."],"answer":3,"feedback":["It identifies a possible event but not its cause or consequence.","Too generic; it does not explain condition, event or consequence.","This is a general judgement, not an actionable risk description.","Correct. It contains condition (“due to”), risk event and consequence (“causing”)."],"correct_position":"D"},{"id":"D08","area":"D · Risk Management","topic":"Risk response strategies","level":"Classification","kind":"Choose the matching response","stem":"A project changes its technical design so that a known hazardous process is no longer required. Which response strategy is being used?","options":["Avoid","Accept","Transfer/share","Mitigate"],"answer":0,"feedback":["Correct. The plan changes so the identified source of risk no longer applies.","Acceptance retains exposure and funds possible consequences.","Transfer/share allocates defined consequences to another party.","Mitigation reduces probability or impact but leaves residual risk."],"correct_position":"A"},{"id":"D09","area":"D · Risk Management","topic":"Risk matrix and impact","level":"Interpretation","kind":"Do not rank on probability alone","stem":"Risk X is likely but would cause a minor inconvenience. Risk Y is very unlikely but could make the project’s key deliverable unusable. What does SS4 warn the manager not to do?","options":["Consider impact when assessing a single-project risk.","Consider the severe consequence of Risk Y.","Use the risk matrix to examine likelihood and impact.","Assume equal expected value means equal managerial priority."],"answer":3,"feedback":["This is consistent with the lecture’s emphasis on impact.","A severe impact can make a low-probability event important.","This is part of the SS4 approach.","Correct answer to the question: the lecture explicitly argues that equal expected values do not necessarily imply equal priority on a single project; the matrix is asymmetric."],"correct_position":"D"},{"id":"D10","area":"D · Risk Management","topic":"Risk roles","level":"Role matching","kind":"Distinguish originator, resource and owner","stem":"An engineer first reports a possible ground-condition problem. A geotechnical expert supports analysis. The project manager is assigned accountability for handling the risk. Which pairing is correct?","options":["All three are risk owners","Engineer = owner; expert = originator; manager = resource","Engineer = originator; expert = resource; manager = owner","Engineer = resource; expert = owner; manager = originator"],"answer":2,"feedback":["The roles are distinct, not interchangeable.","The engineer identifies the risk; the manager is accountable.","Correct. It matches all three slide definitions.","The engineer is the originator; the expert contributes specialist knowledge."],"correct_position":"C"},{"id":"D11","area":"D · Risk Management","topic":"Risk identification methods","level":"Method selection","kind":"Choose a listed identification input","stem":"A project manager wants to identify risks before execution. Which set is explicitly supported by SS4?","options":["Only contingency plans","Scope, WBS, Gantt/Critical Path, contracts, brainstorming, assumption analysis and checklists","Only stakeholder interviews after delivery","Only financial statements and annual reports"],"answer":1,"feedback":["Contingency plans are responses, not a complete identification method.","Correct. These are the SS4 examples of risk identification inputs and techniques.","Risk identification is not postponed until delivery.","These may help in some contexts but are not the listed set in the slide."],"correct_position":"B"},{"id":"D12","area":"D · Risk Management","topic":"Plan A and Plan B","level":"Sequence / trigger","kind":"Distinguish preventive action from contingency","stem":"A team installs a backup power supply before an event. If the primary supply fails, it switches to the backup. Which statement is correct?","options":["The installation is a Plan A response; switching to the backup is Plan B when the trigger occurs.","The installation is Plan B; switching is Plan A.","Both actions are Plan B.","Plan B is activated only after the entire project fails."],"answer":0,"feedback":["Correct. Plan A is implemented before the risk; Plan B is activated when it occurs or is near.","This reverses the course definitions.","The preventative preparation and contingency activation are different.","The slide says Plan B is activated when the risk happens or is near, not only after project failure."],"correct_position":"A"},{"id":"E07","area":"E · Agile, Predictive & Hybrid","topic":"Method selection","level":"Decision","kind":"Select based on several conditions","stem":"A project has stable requirements, limited access to the client, predictable results and high costs of change. Which approach is better supported by the SS6 comparison?","options":["Pure Scrum regardless of project conditions","No formal project approach","Agile","Predictive"],"answer":3,"feedback":["Scrum is an Agile framework, not an automatic choice for every project.","The course teaches method selection, not absence of management.","These are not the Agile-favouring conditions in the slide.","Correct. Stable requirements, difficult client access, predictable results and high cost of change favour Predictive."],"correct_position":"D"},{"id":"E08","area":"E · Agile, Predictive & Hybrid","topic":"Hybrid approach","level":"Application","kind":"Separate stable and uncertain components","stem":"A project contains a stable, regulated infrastructure component and a customer-facing feature set that will evolve through frequent trials. Which approach can accommodate both?","options":["Hybrid","Pure Agile with no fixed constraints","Pure Predictive for every workstream","No project management plan"],"answer":0,"feedback":["Correct. Hybrid can combine predictive and adaptive approaches according to component characteristics.","This ignores the stable regulated component and its constraints.","This may be suitable for the stable component but not necessarily the evolving features.","The framework remains relevant under all methods."],"correct_position":"A"},{"id":"E09","area":"E · Agile, Predictive & Hybrid","topic":"Agile Manifesto values","level":"Recognition","kind":"Identify the exact value","stem":"A customer changes the desired feature after testing an early release. The team updates its plan rather than insisting on the original plan. Which Agile value is most directly reflected?","options":["Working software over comprehensive documentation","Customer collaboration over contract negotiation","Responding to change over following a plan","Individuals and interactions over processes and tools"],"answer":2,"feedback":["This concerns the preference for working software.","Collaboration may be involved, but the scenario specifically emphasises changing the plan.","Correct. The team values responding to change over rigidly following an earlier plan.","This concerns how people work together rather than the change response."],"correct_position":"C"},{"id":"E10","area":"E · Agile, Predictive & Hybrid","topic":"Agile principles","level":"Recognition","kind":"Identify the principle","stem":"Business representatives and developers coordinate every day throughout a project. Which Agile principle is most directly represented?","options":["Simplicity is essential.","Business people and developers must work together daily throughout the project.","The most efficient and effective communication is face-to-face conversation.","Working software is the primary measure of progress."],"answer":1,"feedback":["This concerns maximising work not done.","Correct. It directly matches principle 4 in SS6/SS7.","This is the separate communication principle about conveying information.","This concerns progress measurement."],"correct_position":"B"},{"id":"E11","area":"E · Agile, Predictive & Hybrid","topic":"I-shaped and T-shaped organisations","level":"Interpretation","kind":"Diagnose organisational behaviour","stem":"A product team has deep specialists, but members also understand neighbouring disciplines, respect one another’s expertise and collaborate across roles. Which organisational idea does this contrast support?","options":["A fixed functional hierarchy","A process-only organisation","T-shaped collaboration","I-shaped silos"],"answer":2,"feedback":["This reinforces the rigid structure criticised in the slide.","This is not the organisational contrast presented.","Correct. T-shaped is the useful shorthand for specialist depth plus cross-functional collaboration; the precise shorthand is an interpretation of the I/T slide.","The slide associates I-shaped organisations with language differences, lack of respect and inflexible roles."],"correct_position":"C"},{"id":"E12","area":"E · Agile, Predictive & Hybrid","topic":"Agile does not mean no planning","level":"Evaluate a claim","kind":"Correct a common misconception","stem":"A manager claims: “We are Agile, so we do not need CSFs, stakeholder management, scope boundaries or risk management.” What is the best comment?","options":["Correct; Agile replaces all traditional project management.","Correct, provided the Product Owner writes a backlog.","Incorrect; SS6 maps CSFs, stakeholders and risk management to Predictive, Agile and Hybrid, while scope boundaries can be more flexible.","Incorrect; Agile requires a complete fixed Gantt chart."],"answer":2,"feedback":["This contradicts the methodology mapping in SS6.","A Product Owner does not remove the need for these disciplines.","Correct. Agile changes how planning is adapted; it does not eliminate project management foundations.","This overstates predictive scheduling requirements and contradicts Agile adaptability."],"correct_position":"C"},{"id":"F07","area":"F · Scrum & prioritisation","topic":"Sprint Review versus Retrospective","level":"Event selection","kind":"Choose the right event","stem":"After an increment is demonstrated, users and stakeholders discuss what was achieved, market changes and what should be considered next. Which event is this?","options":["Sprint Review","Backlog refinement","Daily Scrum","Sprint Retrospective"],"answer":0,"feedback":["Correct. Sprint Review inspects the product outcome with stakeholders and considers future adaptation.","Refinement is ongoing work to clarify and order backlog items.","Daily Scrum inspects progress toward the Sprint Goal and adapts the plan.","Retrospective focuses on how the team worked and how to improve."],"correct_position":"A"},{"id":"F08","area":"F · Scrum & prioritisation","topic":"Scrum pillars","level":"Sequence / logic","kind":"Complete the inspection loop","stem":"A team makes work visible, examines progress frequently and changes its approach when results are unacceptable. Which sequence best describes the three Scrum pillars?","options":["Adaptation → Transparency → Inspection","Inspection → Adaptation → Transparency","Transparency → Adaptation → Inspection","Transparency → Inspection → Adaptation"],"answer":3,"feedback":["Adaptation is the response after inspection, not the starting pillar.","The sequence is reversed.","Inspection must precede adaptation.","Correct. Transparency enables inspection; inspection enables adaptation."],"correct_position":"D"},{"id":"F09","area":"F · Scrum & prioritisation","topic":"Backlog item types","level":"Classification","kind":"Classify technical discovery work","stem":"A team adds an item to investigate whether a payment provider supports a required authentication standard. According to the SS7 “Items” slide, what kind of backlog item is this?","options":["Feature","Bug","Customer acceptance criterion","Knowledge acquisition"],"answer":3,"feedback":["A feature creates customer value; this item is discovery work.","A bug works against value creation; the scenario is an unanswered question.","This is not the item category depicted in the slide.","Correct. It is knowledge the team needs in order to create value."],"correct_position":"D"},{"id":"F10","area":"F · Scrum & prioritisation","topic":"MoSCoW","level":"Classification","kind":"Rank requirement criticality","stem":"Without a particular requirement, the initiative cannot be considered successful. Which MoSCoW category applies?","options":["Could","Must","Should","Won’t"],"answer":1,"feedback":["Could is nice to have.","Correct. Must is the vital category in SS7.","Should is wanted but not vital.","Won’t means not now, perhaps in the future."],"correct_position":"B"},{"id":"F11","area":"F · Scrum & prioritisation","topic":"Kano Performance","level":"Classification","kind":"Distinguish performance from basic","stem":"For a food-delivery service, customers become progressively more satisfied as delivery speed improves. Which Kano category best fits this attribute?","options":["Basic","Excitement","Indifferent","Performance"],"answer":3,"feedback":["Basic attributes are expected; presence does not necessarily create increasing delight as execution improves.","Excitement is unexpected delight.","Indifferent attributes have little effect on satisfaction.","Correct. Performance attributes show a generally positive relationship between better execution and satisfaction."],"correct_position":"D"},{"id":"F12","area":"F · Scrum & prioritisation","topic":"Product Backlog prioritisation","level":"Decision","kind":"Reorder based on value","stem":"A user test shows that a previously low-priority feature solves a major customer problem. The team has not yet committed it to a Sprint. What should happen?","options":["Reprioritise the Product Backlog using the new customer information and consider dependencies and value.","Add the feature at the bottom because all new work must be last.","Change every existing item to Must.","Keep the original order because the backlog cannot change."],"answer":0,"feedback":["Correct. The backlog should reflect customer collaboration and value, while considering practical dependencies.","The visual shows new work items are prioritised and added to the stack.","MoSCoW categories should distinguish levels of necessity, not collapse them.","SS7 says backlog items may be reprioritised."],"correct_position":"A"}],"mocks":[[{"id":"M1-01","area":"D · Risk Management","topic":"CSF and resource planning","level":"Exam standard","stem":"A project identifies specialist clinical expertise as essential, but the budget makes no provision for it. What is the most appropriate action?","options":["Rely on the existing team to improvise","Wait until after delivery","Replace the CSF with a documentation target","Secure the expertise and reflect it in resource and budget planning"],"answer":3,"feedback":["A reminder does not create expertise.","The requirement is needed before delivery, not afterwards.","This avoids the real capability gap.","An essential CSF must be translated into people, capability and budget."],"kind":"Managerial decision","correct_position":"D"},{"id":"M1-02","area":"A · Strategy & stakeholders","topic":"Stakeholders and future users","level":"Exam standard","stem":"A team developing an app argues that potential users should not be stakeholders until launch. Is this correct?","options":["Yes, users are affected only after launch","No, users count only if they have budget authority","Yes, only project staff are stakeholders","No, potential users may be affected by or perceive themselves affected by project outcomes"],"answer":3,"feedback":["Users can be influenced before launch.","Correct. This is consistent with SS1.","The stakeholder definition is broader than project staff.","Stakeholder status does not require direct project participation or an already-launched product."],"kind":"Evaluate a proposal","correct_position":"D"},{"id":"M1-03","area":"B · Scope & WBS","topic":"WBS and Gantt","level":"Exam standard","stem":"A team develops a detailed Gantt while the WBS is still incomplete. What is the main concern?","options":["The Gantt includes the WBS automatically","The final schedule may be less realistic because work is missing","WBS and Gantt are unrelated","It saves time, so it is preferable"],"answer":1,"feedback":["Gantt does not replace scope decomposition.","WBS decomposes the scope and supports scheduling; missing work makes estimates and schedule less realistic.","They are related; WBS is a starting point for Gantt.","Speed does not correct omissions."],"kind":"Concept in context","correct_position":"B"},{"id":"M1-04","area":"B · Scope & WBS","topic":"Success criteria and constraints","level":"Exam standard","stem":"A market-entry team lists sales of ₹40 lakh in three months, a budget ceiling and a law prohibiting discounts as CSFs. What is your comment?","options":["They are all deliverables","They are all CSFs","They mix a success criterion and constraints","They are all stakeholder activities"],"answer":2,"feedback":["These are not stakeholder activities.","A target and constraints are not automatically CSFs.","Sales is a measurable success criterion; budget ceiling and legal restriction are constraints.","Correct. This reflects the mock’s intended classification."],"kind":"Evaluate a proposal","correct_position":"C"},{"id":"M1-05","area":"C · Scheduling","topic":"Multiple dependencies","level":"Exam standard","stem":"Task C has an FS dependency on A and an SS dependency on B. When can C start?","options":["When B finishes, regardless of A","When A starts","When A finishes and B starts","When A finishes, regardless of B"],"answer":2,"feedback":["SS requires B to start, not finish, and ignores A.","This ignores A’s FS requirement.","Both predecessor conditions must be satisfied.","This ignores B."],"kind":"Dependency logic","correct_position":"C"},{"id":"M1-06","area":"D · Risk Management","topic":"Contingency planning","level":"Exam standard","stem":"What is Plan B in the risk-management process?","options":["Preventive action before the risk happens","A monetary reserve only","Contingency activated when the risk happens or is near","A plan used only when the project is near failure"],"answer":2,"feedback":["This is Plan A.","Correct.","Plan B is activated when risk occurs or is near; Plan A is preventive action.","A contingency is not merely money."],"kind":"Concept in context","correct_position":"C"},{"id":"M1-07","area":"F · Scrum & prioritisation","topic":"Sprint Review","level":"Exam standard","stem":"A Scrum team decides that only Developers will evaluate the Sprint result. Do you agree?","options":["No, Developers must not participate","Yes, experience makes stakeholders unnecessary","No, Sprint Review should inspect the outcome with stakeholders","Yes, they know the work best"],"answer":2,"feedback":["Correct. The issue is excluding stakeholders.","Experience does not change the Review purpose.","Developers participate, but the review should involve relevant stakeholders and inspect the product outcome.","Team knowledge does not replace stakeholder feedback."],"kind":"Evaluate a proposal","correct_position":"C"},{"id":"M1-08","area":"F · Scrum & prioritisation","topic":"MoSCoW Must","level":"Exam standard","stem":"A team plans to implement all Must backlog items last because they are mandatory. What is the best comment?","options":["Must and Should are identical","Must items should receive priority, subject to dependencies and meaningful sequencing","Correct, timing is irrelevant","Could items should always go first"],"answer":1,"feedback":["Could does not automatically outrank Must.","Must is vital; priority matters, although prerequisites and iteration value can affect exact order.","This risks leaving essentials too late.","Correct."],"kind":"Managerial decision","correct_position":"B"},{"id":"M1-09","area":"F · Scrum & prioritisation","topic":"Kano Basic","level":"Exam standard","stem":"In a pub development project, beer is which Kano category?","options":["Indifferent","Basic","Performance","Excitement"],"answer":1,"feedback":["Excitement is unexpected delight.","Beer is an expected baseline offering in the scenario.","It is not indifferent in this scenario.","Correct."],"kind":"Concept in context","correct_position":"B"},{"id":"M1-10","area":"A · Strategy & stakeholders","topic":"Project versus process","level":"Exam standard","stem":"What distinguishes a project from a process?","options":["Use of human resources","Presence of material resources","Presence of constraints","Temporary, non-repetitive effort aimed at a unique result"],"answer":3,"feedback":["Both use human resources.","Both can use material resources.","Both can have constraints.","Both projects and processes use resources and face constraints; projects are temporary and unique."],"kind":"Classification / distinction","correct_position":"D"},{"id":"M1-11","area":"A · Strategy & stakeholders","topic":"Mendelow","level":"Exam standard","stem":"A stakeholder has low power and high interest. What is the usual engagement approach?","options":["Keep informed","Manage closely","Keep satisfied","Ignore"],"answer":0,"feedback":["Low-power/high-interest stakeholders are generally kept informed.","Manage closely is high/high.","Keep satisfied is high power/low interest.","Ignoring is not the prescribed approach."],"kind":"Concept in context","correct_position":"A"},{"id":"M1-12","area":"A · Strategy & stakeholders","topic":"PSS boundaries","level":"Exam standard","stem":"The team leaves international rollout ambiguous; stakeholders disagree whether it is included. Which PSS element is weak?","options":["Success criteria","Justification","Boundaries","Constraints only"],"answer":2,"feedback":["Correct.","Justification explains why.","Boundaries define inclusion and exclusions and clear grey areas.","Success criteria measure acceptability."],"kind":"Concept in context","correct_position":"C"},{"id":"M1-13","area":"D · Risk Management","topic":"WBS work package","level":"Exam standard","stem":"A work package has no measurable output and no potential owner. Which rule is violated?","options":["Estimatable, measurable, manageable and clear I/O","Kano","Top Down method","CPM"],"answer":0,"feedback":["Work packages should be estimatable, measurable, manageable and have clear I/O relationships.","CPM is scheduling.","Correct.","Top Down is a WBS development method."],"kind":"Concept in context","correct_position":"A"},{"id":"M1-14","area":"D · Risk Management","topic":"Scheduling inputs","level":"Exam standard","stem":"A schedule has activities and dependencies but no estimated durations or resource assessment. What is missing?","options":["Only stakeholder attitude","Only the Sprint Goal","Important scheduling inputs","Only the risk matrix"],"answer":2,"feedback":["Stakeholder attitude is not a scheduling input.","Risk matrix is not a scheduling input.","Duration and resources are among the six scheduling inputs.","Correct."],"kind":"Calculation","correct_position":"C"},{"id":"M1-15","area":"C · Scheduling","topic":"FF dependency","level":"Exam standard","stem":"B can finish only after A finishes. What dependency is this?","options":["FS","SF","SS","FF"],"answer":3,"feedback":["FS constrains successor start.","Correct.","SS constrains successor start after predecessor start.","FF constrains successor finish relative to predecessor finish."],"kind":"Dependency logic","correct_position":"D"},{"id":"M1-16","area":"C · Scheduling","topic":"Lead and lag","level":"Exam standard","stem":"A successor waits two days after a predecessor finishes. Which modifier is present?","options":["Lag","Critical Chain","Lead","Sprint Goal"],"answer":0,"feedback":["A lag is a waiting interval.","Correct.","Lead permits overlap or earlier start.","These are unrelated concepts."],"kind":"Concept in context","correct_position":"A"},{"id":"M1-17","area":"C · Scheduling","topic":"Critical Path","level":"Exam standard","stem":"A delay in activity X will delay the whole project. What does this indicate?","options":["X is a constraint only","X is a critical activity","X is an output","X is a stakeholder"],"answer":1,"feedback":["Correct.","A critical activity is one whose delay delays the whole project.","A constraint is a limitation.","This is not a stakeholder classification."],"kind":"Concept in context","correct_position":"B"},{"id":"M1-18","area":"C · Scheduling","topic":"PERT","level":"Exam standard","stem":"O=3 days, M=6 days, P=15 days. What is the expected duration?","options":["8","6","9","7"],"answer":3,"feedback":["Correct.","Incorrect calculation.","Incorrect calculation.","TE=(3+4×6+15)/6=7 days."],"kind":"Calculation","correct_position":"D"},{"id":"M1-19","area":"D · Risk Management","topic":"Risk description","level":"Exam standard","stem":"Which description is clearest?","options":["Due to a single-source supplier, delivery may be delayed, causing commissioning to slip","Supplier risk","Risk owner is procurement","Bad project"],"answer":0,"feedback":["It contains condition, risk and consequence.","Too vague.","Too general.","Correct."],"kind":"Concept in context","correct_position":"A"},{"id":"M1-20","area":"D · Risk Management","topic":"Risk roles","level":"Exam standard","stem":"An engineer identifies a risk; an expert helps assess it; a manager owns it. The expert is the:","options":["Risk Resource","Project Sponsor","Risk Originator","Risk Owner"],"answer":0,"feedback":["Risk Resource is the expert supporting assessment and management.","Originator identified the risk.","Correct.","Owner is accountable."],"kind":"Concept in context","correct_position":"A"},{"id":"M1-21","area":"E · Agile, Predictive & Hybrid","topic":"Agile/Predictive selection","level":"Exam standard","stem":"Requirements are stable, client access is limited and changes are expensive. Which approach is favoured?","options":["No method","Scrum without planning","Predictive","Agile"],"answer":2,"feedback":["Correct.","The course expects method selection.","These conditions favour Predictive in SS6.","Agile suits uncertainty and feedback."],"kind":"Concept in context","correct_position":"C"},{"id":"M1-22","area":"E · Agile, Predictive & Hybrid","topic":"Hybrid selection","level":"Exam standard","stem":"Stable infrastructure and evolving customer-facing features are in one project. What approach may fit?","options":["Hybrid","No project plan","Pure Predictive only","Pure Agile only"],"answer":0,"feedback":["Hybrid can use predictive methods for stable work and adaptive methods for evolving work.","Correct.","Too rigid for evolving features.","May not exploit stable components."],"kind":"Concept in context","correct_position":"A"},{"id":"M1-23","area":"E · Agile, Predictive & Hybrid","topic":"Agile value","level":"Exam standard","stem":"Which is an Agile Manifesto value?","options":["Processes and tools over people","Customer collaboration over contract negotiation","Following a plan over responding to change","Documentation over working software"],"answer":1,"feedback":["Reverses a value.","The Manifesto values customer collaboration over contract negotiation.","Correct.","Reverses a value."],"kind":"Concept in context","correct_position":"B"},{"id":"M1-24","area":"F · Scrum & prioritisation","topic":"Scrum pillars","level":"Exam standard","stem":"A team makes work visible, inspects it and adjusts when results deviate. Which pillars are shown?","options":["Budget, Quality, Cost","Transparency, Inspection, Adaptation","Power, Interest, Attitude","Must, Should, Could"],"answer":1,"feedback":["Correct.","These are the three Scrum pillars.","These are not Scrum pillars.","These are stakeholder dimensions."],"kind":"Concept in context","correct_position":"B"},{"id":"M1-25","area":"F · Scrum & prioritisation","topic":"Sprint Retrospective","level":"Exam standard","stem":"Which event focuses on improving the team’s way of working?","options":["Daily Scrum","Sprint Retrospective","Sprint Planning","Sprint Review"],"answer":1,"feedback":["Correct.","The Retrospective focuses on team effectiveness and improvements.","Daily Scrum checks progress.","Review inspects product outcome with stakeholders."],"kind":"Concept in context","correct_position":"B"},{"id":"M1-26","area":"F · Scrum & prioritisation","topic":"Backlog structure","level":"Exam standard","stem":"What does the course say about Product Backlog structure?","options":["Not standardised, but a good backlog is prioritised","Must copy the Gantt chart","Contains only visible features","Identical in all projects"],"answer":0,"feedback":["The course summary states its structure is not standardised and a good backlog is prioritised.","Correct.","Backlog is not a Gantt.","The slide says otherwise."],"kind":"Concept in context","correct_position":"A"},{"id":"M1-27","area":"F · Scrum & prioritisation","topic":"Backlog knowledge items","level":"Exam standard","stem":"A team adds technical investigation to understand whether an integration can work. Is this valid backlog work?","options":["Yes, knowledge acquisition and technical tasks can enable value","Only after feature work is finished","No, all investigation is outside scope","No, only customer features count"],"answer":0,"feedback":["SS7 includes knowledge acquisition and technical tasks among backlog item types.","Investigation may be necessary scope work.","Correct.","The backlog is broader than features."],"kind":"Concept in context","correct_position":"A"},{"id":"M1-28","area":"A · Strategy & stakeholders","topic":"LIBRA","level":"Exam standard","stem":"LIBRA links which concepts?","options":["MoSCoW, Kano and Scrum roles","CPM, PERT and Gantt","Risk roles only","Stakeholder Management, CSFs and Project Performance"],"answer":3,"feedback":["Correct.","Scheduling topics.","Backlog topics.","The syllabus explicitly gives this LIBRA connection."],"kind":"Concept in context","correct_position":"D"},{"id":"M1-29","area":"E · Agile, Predictive & Hybrid","topic":"Easter Eggs","level":"Exam standard","stem":"The Easter Eggs simulation illustrates the difference between:","options":["Risk avoidance and acceptance","Predictive and adaptive project management","Power and interest","WBS and PSS"],"answer":1,"feedback":["Stakeholder dimensions.","The syllabus states this simulation contrasts predictive and adaptive approaches.","Correct.","Scope tools."],"kind":"Concept in context","correct_position":"B"},{"id":"M1-30","area":"A · Strategy & stakeholders","topic":"SS8","level":"Exam standard","stem":"What is the main SS8 management lesson?","options":["Tools should never be used","Strategic planning matters only at kickoff","Instinct is sufficient in complex environments","Managers should leverage all available resources; emotion and instinct alone are insufficient"],"answer":3,"feedback":["Strategic planning is central across the course.","Correct.","Contradicts the summary.","The course summary states this explicitly."],"kind":"Concept in context","correct_position":"D"}],[{"id":"M2-01","area":"D · Risk Management","topic":"CSF, budget and capability","level":"Exam standard","stem":"A project needs a cybersecurity specialist as a CSF-related capability, but budget and resource plans omit the role. What is best?","options":["Assume the existing team can improvise","Secure the expertise and reflect it in resource/budget planning","Change the CSF","Wait until testing"],"answer":1,"feedback":["The expertise is required before testing/delivery.","A CSF must be supported by capability and resources.","This avoids the strategic need.","Correct."],"kind":"Concept in context","correct_position":"B"},{"id":"M2-02","area":"A · Strategy & stakeholders","topic":"Stakeholders and future users","level":"Exam standard","stem":"A product is not launched, but likely users can affect adoption and requirements. Should they be identified?","options":["Yes, they may be affected by project outcomes","No, they are not on the team","No, the product is unfinished","Only after purchase"],"answer":0,"feedback":["Stakeholders need not be direct participants and may be affected before launch.","Direct membership is not required.","The product being unfinished does not erase users.","Purchase is not the definition."],"kind":"Managerial decision","correct_position":"A"},{"id":"M2-03","area":"B · Scope & WBS","topic":"Scope and deliverables","level":"Exam standard","stem":"A CSF is fast customer onboarding, but the PSS lists only software development. What is missing?","options":["A new risk matrix only","An onboarding deliverable/process and its work","A second project charter","A Kano diagram"],"answer":1,"feedback":["Correct.","A CSF should translate into deliverables and WBS work that enable the intended result.","Risk analysis alone does not add required scope.","No reason to create a second charter."],"kind":"Concept in context","correct_position":"B"},{"id":"M2-04","area":"B · Scope & WBS","topic":"Success criteria and constraints","level":"Exam standard","stem":"A project sets an adoption target and must comply with a fixed statutory requirement. Which classification is right?","options":["Adoption target is success criterion; statutory rule is constraint","Both are CSFs","Both are deliverables","Statutory rule is a KPI"],"answer":0,"feedback":["The target measures the result; the law limits execution.","Correct.","They are different kinds of project information.","A target/constraint are not automatically CSFs."],"kind":"Concept in context","correct_position":"A"},{"id":"M2-05","area":"B · Scope & WBS","topic":"WBS and Gantt","level":"Exam standard","stem":"Why should work breakdown be sufficiently developed before a realistic Gantt is produced?","options":["WBS contains calendar dates","The schedule depends on identifying the work to be done","Gantt replaces scope boundaries","WBS and Gantt have no connection"],"answer":1,"feedback":["WBS has no timeline.","The WBS defines scope work and supports the schedule; omissions make the schedule unrealistic.","Correct.","The Gantt does not replace scope definition."],"kind":"Concept in context","correct_position":"B"},{"id":"M2-06","area":"D · Risk Management","topic":"Work package measurement","level":"Exam standard","stem":"A package cannot show progress or have a responsible owner. What should be improved?","options":["Its stakeholder power","Its risk matrix colour","Its Kano classification","Its measurable/manageable definition"],"answer":3,"feedback":["Risk matrix colour is unrelated.","Kano is product satisfaction.","Correct.","Work packages should be measurable and manageable, with potential ownership."],"kind":"Managerial deci
